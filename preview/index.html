background-color:#FFFFFF;border:1px solid #F5E9E0;border-radius:4px;padding:28px;\">\n          <div style=\"font-size:12px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:#8A6F5C;margin-bottom:16px;\">Without Advanced Sequence Manager<\/div>\n          <div style=\"font-family:'JetBrains Mono',Consolas,monospace;font-size:13px;color:#856F60;background-color:#FCFAF8;border:1px dashed #E1D4CB;border-radius:4px;padding:12px 14px;margin-bottom:16px;line-height:1.9;\">\n            S00148 \u00b7 INV/2026/0007 \u00b7 WH/OUT/00031<br>BNK1/2026/05/0012 \u00b7 P00062\n          <\/div>\n          <p style=\"margin:0 0 8px;font-size:15px;color:#695547;line-height:1.6;\">\u2717\u00a0 Different formats in every app<\/p>\n          <p style=\"margin:0 0 8px;font-size:15px;color:#695547;line-height:1.6;\">\u2717\u00a0 Prefixes edited one sequence at a time<\/p>\n          <p style=\"margin:0 0 8px;font-size:15px;color:#695547;line-height:1.6;\">\u2717\u00a0 Backdated documents land in the wrong year<\/p>\n          <p style=\"margin:0;font-size:15px;color:#695547;line-height:1.6;\">\u2717\u00a0 Anyone can change a number or a prefix<\/p>\n        <\/div>\n      <\/div>\n      <div class=\"col-md-6\" style=\"margin-bottom:20px;\">\n        <div class=\"h-100\" style=\"background-color:#FDF5F0;border:1px solid #F7DFCE;border-radius:4px;padding:28px;\">\n          <div style=\"font-size:12px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:#AD591D;margin-bottom:16px;\">With Advanced Sequence Manager<\/div>\n          <div style=\"font-family:'JetBrains Mono',Consolas,monospace;font-size:13px;color:#81512E;background-color:#FFFFFF;border:1px solid #F7DFCE;border-radius:4px;padding:12px 14px;margin-bottom:16px;line-height:1.9;\">\n            QT/SKL/2026/00148 \u00b7 INV/SKL/2026/00145<br>DO/SKL/2026/00097 \u00b7 PV/SKL/2026/00318\n          <\/div>\n          <p style=\"margin:0 0 8px;font-size:15px;color:#402C1E;line-height:1.6;\"><span style=\"color:#A0521A;font-weight:800;\">\u2713<\/span>\u00a0 One pattern: <b>CODE / COMPANY / YEAR / NUMBER<\/b><\/p>\n          <p style=\"margin:0 0 8px;font-size:15px;color:#402C1E;line-height:1.6;\"><span style=\"color:#A0521A;font-weight:800;\">\u2713<\/span>\u00a0 One wizard sets the prefix for every document type<\/p>\n          <p style=\"margin:0 0 8px;font-size:15px;color:#402C1E;line-height:1.6;\"><span style=\"color:#A0521A;font-weight:800;\">\u2713<\/span>\u00a0 Backdated documents use their own period's series<\/p>\n          <p style=\"margin:0;font-size:15px;color:#402C1E;line-height:1.6;\"><span style=\"color:#A0521A;font-weight:800;\">\u2713<\/span>\u00a0 Locked sequences and a Sequence Editor permission<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- Feature grid -->\n\n<section class=\"oe_container\" id=\"sk-features\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:40px 0 20px;\">\n    <div style=\"text-align:center;margin-bottom:30px;\">\n      <div style=\"font-size:12px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:#B65E1E;margin-bottom:10px;\">Key Features<\/div>\n      <h2 style=\"font-size:32px;font-weight:800;color:#26160B;margin:0;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#FAEADF;padding-bottom:14px;\">Everything you need for clean numbering<\/h2>\n    <\/div>\n    <div class=\"row\">\n      <div class=\"col-md-6 col-lg-4\" style=\"margin-bottom:20px;\"><div class=\"h-100\" style=\"background-color:#FFFFFF;border:1px solid #F5E9E0;border-radius:4px;padding:24px;\">\n        <div style=\"display:inline-block;font-family:'JetBrains Mono',Consolas,monospace;font-size:13px;font-weight:700;color:#363636;background-color:#E1894A;border-radius:4px;padding:8px 11px;margin-bottom:14px;\">01<\/div>\n        <h3 style=\"font-size:18px;font-weight:800;color:#26160B;margin:0 0 8px;\">One Advanced Sequence Manager screen<\/h3>\n        <p style=\"font-size:14px;color:#826B5B;line-height:1.65;margin:0;\">All document sequences in one list, with a live Pattern Example of the next number.<\/p>\n      <\/div><\/div>\n      <div class=\"col-md-6 col-lg-4\" style=\"margin-bottom:20px;\"><div class=\"h-100\" style=\"background-color:#FFFFFF;border:1px solid #F5E9E0;border-radius:4px;padding:24px;\">\n        <div style=\"display:inline-block;font-family:'JetBrains Mono',Consolas,monospace;font-size:13px;font-weight:700;color:#363636;background-color:#E1894A;border-radius:4px;padding:8px 11px;margin-bottom:14px;\">02<\/div>\n        <h3 style=\"font-size:18px;font-weight:800;color:#26160B;margin:0 0 8px;\">Reset Company Prefix<\/h3>\n        <p style=\"font-size:14px;color:#826B5B;line-height:1.65;margin:0;\">Type a prefix like <b>SKL<\/b> once. Every sequence for the company is rebuilt in one click.<\/p>\n      <\/div><\/div>\n      <div class=\"col-md-6 col-lg-4\" style=\"margin-bottom:20px;\"><div class=\"h-100\" style=\"background-color:#FFFFFF;border:1px solid #F5E9E0;border-radius:4px;padding:24px;\">\n        <div style=\"display:inline-block;font-family:'JetBrains Mono',Consolas,monospace;font-size:13px;font-weight:700;color:#FFFFFF;background-color:#A0521A;border-radius:4px;padding:8px 11px;margin-bottom:14px;\">03<\/div>\n        <h3 style=\"font-size:18px;font-weight:800;color:#26160B;margin:0 0 8px;\">Yearly or monthly series<\/h3>\n        <p style=\"font-size:14px;color:#826B5B;line-height:1.65;margin:0;\">4 or 2-digit year, 4 or 5-digit number. Counters restart each year or each month.<\/p>\n      <\/div><\/div>\n      <div class=\"col-md-6 col-lg-4\" style=\"margin-bottom:20px;\"><div class=\"h-100\" style=\"background-color:#FFFFFF;border:1px solid #F5E9E0;border-radius:4px;padding:24px;\">\n        <div style=\"display:inline-block;font-family:'JetBrains Mono',Consolas,monospace;font-size:13px;font-weight:700;color:#363636;background-color:#E1894A;border-radius:4px;padding:8px 11px;margin-bottom:14px;\">04<\/div>\n        <h3 style=\"font-size:18px;font-weight:800;color:#26160B;margin:0 0 8px;\">40+ document types<\/h3>\n        <p style=\"font-size:14px;color:#826B5B;line-height:1.65;margin:0;\">Sales, purchase, accounting, inventory, projects, CRM, manufacturing, helpdesk and more.<\/p>\n      <\/div><\/div>\n      <div class=\"col-md-6 col-lg-4\" style=\"margin-bottom:20px;\"><div class=\"h-100\" style=\"background-color:#FFFFFF;border:1px solid #F5E9E0;border-radius:4px;padding:24px;\">\n        <div style=\"display:inline-block;font-family:'JetBrains Mono',Consolas,monospace;font-size:13px;font-weight:700;color:#26160B;background-color:#E0823F;border-radius:4px;padding:8px 11px;margin-bottom:14px;\">05<\/div>\n        <h3 style=\"font-size:18px;font-weight:800;color:#26160B;margin:0 0 8px;\">Lock protection<\/h3>\n        <p style=\"font-size:14px;color:#826B5B;line-height:1.65;margin:0;\">Locked sequences can't have their prefix or pattern changed until someone unlocks them.<\/p>\n      <\/div><\/div>\n      <div class=\"col-md-6 col-lg-4\" style=\"margin-bottom:20px;\"><div class=\"h-100\" style=\"background-color:#FFFFFF;border:1px solid #F5E9E0;border-radius:4px;padding:24px;\">\n        <div style=\"display:inline-block;font-family:'JetBrains Mono',Consolas,monospace;font-size:13px;font-weight:700;color:#FFFFFF;background-color:#A0521A;border-radius:4px;padding:8px 11px;margin-bottom:14px;\">06<\/div>\n        <h3 style=\"font-size:18px;font-weight:800;color:#26160B;margin:0 0 8px;\">Backdated documents<\/h3>\n        <p style=\"font-size:14px;color:#826B5B;line-height:1.65;margin:0;\">An invoice dated last year gets the next number in last year's series, not this year's.<\/p>\n      <\/div><\/div>\n      <div class=\"col-md-6 col-lg-4\" style=\"margin-bottom:20px;\"><div class=\"h-100\" style=\"background-color:#FFFFFF;border:1px solid #F5E9E0;border-radius:4px;padding:24px;\">\n        <div style=\"display:inline-block;font-family:'JetBrains Mono',Consolas,monospace;font-size:13px;font-weight:700;color:#363636;background-color:#E1894A;border-radius:4px;padding:8px 11px;margin-bottom:14px;\">07<\/div>\n        <h3 style=\"font-size:18px;font-weight:800;color:#26160B;margin:0 0 8px;\">Quotation revisions<\/h3>\n        <p style=\"font-size:14px;color:#826B5B;line-height:1.65;margin:0;\">Revise a quotation as <b>-R1<\/b>, <b>-R2<\/b>\u2026 without using up a new quotation number.<\/p>\n      <\/div><\/div>\n      <div class=\"col-md-6 col-lg-4\" style=\"margin-bottom:20px;\"><div class=\"h-100\" style=\"background-color:#FFFFFF;border:1px solid #F5E9E0;border-radius:4px;padding:24px;\">\n        <div style=\"display:inline-block;font-family:'JetBrains Mono',Consolas,monospace;font-size:13px;font-weight:700;color:#363636;background-color:#E1894A;border-radius:4px;padding:8px 11px;margin-bottom:14px;\">08<\/div>\n        <h3 style=\"font-size:18px;font-weight:800;color:#26160B;margin:0 0 8px;\">Smart next number<\/h3>\n        <p style=\"font-size:14px;color:#826B5B;line-height:1.65;margin:0;\">Continues after the highest number already used and skips any posted duplicate.<\/p>\n      <\/div><\/div>\n      <div class=\"col-md-6 col-lg-4\" style=\"margin-bottom:20px;\"><div class=\"h-100\" style=\"background-color:#FFFFFF;border:1px solid #F5E9E0;border-radius:4px;padding:24px;\">\n        <div style=\"display:inline-block;font-family:'JetBrains Mono',Consolas,monospace;font-size:13px;font-weight:700;color:#FFFFFF;background-color:#A0521A;border-radius:4px;padding:8px 11px;margin-bottom:14px;\">09<\/div>\n        <h3 style=\"font-size:18px;font-weight:800;color:#26160B;margin:0 0 8px;\">Multi-company &amp; permissions<\/h3>\n        <p style=\"font-size:14px;color:#826B5B;line-height:1.65;margin:0;\">Each company gets its own prefix. Only Sequence Editors can change document numbers.<\/p>\n      <\/div><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- 01 One screen -->\n\n<section class=\"oe_container\" id=\"cpa-section-4\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background-color:#FEF9F6;border:1px solid #F5E9E0;border-radius:4px;padding:34px;margin:20px 0;\">\n    <div style=\"font-size:12px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:#A0521A;margin-bottom:8px;\">01 \u00b7 One screen<\/div>\n    <h2 style=\"font-size:28px;font-weight:800;color:#26160B;margin:0 0 10px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#FAEADF;padding-bottom:14px;\">All your document numbers in one list<\/h2>\n    <p style=\"font-size:16px;color:#826B5B;line-height:1.7;margin:0 0 20px;max-width:820px;\">\n      Open <b>Settings \u2192 Users &amp; Companies \u2192 Advanced Sequence Manager<\/b> to see every CPA Books ERP sequence for the companies\n      you're working in: name, lock state, document type, period format and a live <b>Pattern Example<\/b> of the next number.\n    <\/p>\n    <img src=\"../smart_sequence_engine/static/description/01_resequences_list.png\" alt=\"Advanced Sequence Manager list\" style=\"max-width:100%;border-radius:4px;display:block;border:1px solid #F5E9E0;height:auto;\">\n  <\/div>\n<\/section>\n\n\n<!-- 02 Reset Company Prefix -->\n\n<section class=\"oe_container\" id=\"cpa-section-5\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background-color:#FEF9F6;border:1px solid #F5E9E0;border-radius:4px;padding:34px;margin:20px 0;\">\n    <div style=\"font-size:12px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:#A0521A;margin-bottom:8px;\">02 \u00b7 One click setup<\/div>\n    <h2 style=\"font-size:28px;font-weight:800;color:#26160B;margin:0 0 10px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#FAEADF;padding-bottom:14px;\">Reset Company Prefix<\/h2>\n    <p style=\"font-size:16px;color:#826B5B;line-height:1.7;margin:0 0 20px;max-width:820px;\">\n      Enter your company code, choose a yearly or monthly series, the year format and the number length.\n      The <b>Pattern Preview<\/b> shows the result before you apply it. Every document type for the company is\n      updated at once and locked automatically afterwards.\n    <\/p>\n    <img src=\"../smart_sequence_engine/static/description/02_reset_company_prefix.png\" alt=\"Reset Company Prefix wizard\" style=\"max-width:100%;border-radius:4px;display:block;border:1px solid #F5E9E0;height:auto;\">\n  <\/div>\n<\/section>\n\n\n<!-- 03 Number formats -->\n\n<section class=\"oe_container\" id=\"cpa-section-6\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:20px 0;\">\n    <div style=\"font-size:12px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:#A0521A;margin-bottom:8px;\">03 \u00b7 Number formats<\/div>\n    <h2 style=\"font-size:28px;font-weight:800;color:#26160B;margin:0 0 10px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#FAEADF;padding-bottom:14px;\">Pick the format that fits your books<\/h2>\n    <p style=\"font-size:16px;color:#826B5B;line-height:1.7;margin:0 0 22px;max-width:820px;\">\n      Every option keeps the same readable structure: document code, company prefix, period and a padded running number.\n    <\/p>\n    <div class=\"row\">\n      <div class=\"col-md-6 col-lg-3\" style=\"margin-bottom:16px;\"><div class=\"h-100\" style=\"background-color:#26160B;border-radius:4px;padding:22px;color:#5684C4;\">\n        <div style=\"font-size:12px;font-weight:700;color:#F2CBAF;margin-bottom:10px;\">Yearly \u00b7 4-digit year<\/div>\n        <div style=\"font-family:'JetBrains Mono',Consolas,monospace;font-size:16px;font-weight:700;color:#E9A777;\">INV/SKL/2026/00145<\/div>\n        <div style=\"font-size:12px;color:#B89E8B;margin-top:10px;\">Restarts every 1 January<\/div>\n      <\/div><\/div>\n      <div class=\"col-md-6 col-lg-3\" style=\"margin-bottom:16px;\"><div class=\"h-100\" style=\"background-color:#26160B;border-radius:4px;padding:22px;color:#5684C4;\">\n        <div style=\"font-size:12px;font-weight:700;color:#F2CBAF;margin-bottom:10px;\">Yearly \u00b7 2-digit year<\/div>\n        <div style=\"font-family:'JetBrains Mono',Consolas,monospace;font-size:16px;font-weight:700;color:#E9A777;\">INV/SKL/26/00145<\/div>\n        <div style=\"font-size:12px;color:#B89E8B;margin-top:10px;\">Shorter, same yearly reset<\/div>\n      <\/div><\/div>\n      <div class=\"col-md-6 col-lg-3\" style=\"margin-bottom:16px;\"><div class=\"h-100\" style=\"background-color:#26160B;border-radius:4px;padding:22px;color:#5684C4;\">\n        <div style=\"font-size:12px;font-weight:700;color:#F2CBAF;margin-bottom:10px;\">Monthly<\/div>\n        <div style=\"font-family:'JetBrains Mono',Consolas,monospace;font-size:16px;font-weight:700;color:#E9A777;\">JV/SKL/26/05/0027<\/div>\n        <div style=\"font-size:12px;color:#B89E8B;margin-top:10px;\">Restarts every month<\/div>\n      <\/div><\/div>\n      <div class=\"col-md-6 col-lg-3\" style=\"margin-bottom:16px;\"><div class=\"h-100\" style=\"background-color:#26160B;border-radius:4px;padding:22px;color:#5684C4;\">\n        <div style=\"font-size:12px;font-weight:700;color:#F2CBAF;margin-bottom:10px;\">Number length<\/div>\n        <div style=\"font-family:'JetBrains Mono',Consolas,monospace;font-size:16px;font-weight:700;color:#E0823F;\">0001 \u00b7 00001<\/div>\n        <div style=\"font-size:12px;color:#B89E8B;margin-top:10px;\">4 or 5 digits<\/div>\n      <\/div><\/div>\n    <\/div>\n    <img src=\"../smart_sequence_engine/static/description/03_number_formats.png\" alt=\"Number formats\" style=\"max-width:100%;border-radius:4px;display:block;margin-top:8px;border:1px solid #F5E9E0;height:auto;\">\n  <\/div>\n<\/section>\n\n\n<!-- 04 Coverage -->\n\n<section class=\"oe_container\" id=\"cpa-section-7\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background-color:#26160B;border-radius:4px;padding:38px 34px;margin:20px 0;color:#FFFFFF;\">\n    <div style=\"font-size:12px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:#E9A777;margin-bottom:8px;\">04 \u00b7 Document coverage<\/div>\n    <h2 style=\"font-size:28px;font-weight:800;color:#FFFFFF;margin:0 0 10px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#FAEADF;padding-bottom:14px;\">40+ document types, one numbering rule<\/h2>\n    <p style=\"font-size:15px;color:#F7DFCE;line-height:1.7;margin:0 0 22px;max-width:820px;\">\n      Types for optional apps (Manufacturing, Helpdesk, site reports, transport, PDC) apply when those apps are installed.\n    <\/p>\n    <div class=\"row\">\n      <div class=\"col-md-6 col-lg-4\" style=\"margin-bottom:16px;\"><div class=\"h-100\" style=\"background-color:#452A16;border:1px solid #704A2E;border-radius:4px;padding:18px;\">\n        <div style=\"font-size:14px;font-weight:800;color:#FFFFFF;margin-bottom:8px;\">Sales<\/div>\n        <div style=\"font-family:'JetBrains Mono',Consolas,monospace;font-size:12px;color:#F2CBAF;line-height:2;\">QT Quotation \u00b7 DO Delivery<br>INV Invoice \u00b7 RINV Credit Note<\/div>\n      <\/div><\/div>\n      <div class=\"col-md-6 col-lg-4\" style=\"margin-bottom:16px;\"><div class=\"h-100\" style=\"background-color:#452A16;border:1px solid #704A2E;border-radius:4px;padding:18px;\">\n        <div style=\"font-size:14px;font-weight:800;color:#FFFFFF;margin-bottom:8px;\">Purchase<\/div>\n        <div style=\"font-family:'JetBrains Mono',Consolas,monospace;font-size:12px;color:#F2CBAF;line-height:2;\">LPO Purchase Order \u00b7 GRN Receipt<br>BILL Vendor Bill \u00b7 RBILL Debit Note<\/div>\n      <\/div><\/div>\n      <div class=\"col-md-6 col-lg-4\" style=\"margin-bottom:16px;\"><div class=\"h-100\" style=\"background-color:#452A16;border:1px solid #704A2E;border-radius:4px;padding:18px;\">\n        <div style=\"font-size:14px;font-weight:800;color:#FFFFFF;margin-bottom:8px;\">Accounting<\/div>\n        <div style=\"font-family:'JetBrains Mono',Consolas,monospace;font-size:12px;color:#F2CBAF;line-height:2;\">PV Payment \u00b7 RV Receipt \u00b7 JV Journal<br>PDP / PDR PDC Vouchers \u00b7 A Reconcile<\/div>\n      <\/div><\/div>\n      <div class=\"col-md-6 col-lg-4\" style=\"margin-bottom:16px;\"><div class=\"h-100\" style=\"background-color:#452A16;border:1px solid #704A2E;border-radius:4px;padding:18px;\">\n        <div style=\"font-size:14px;font-weight:800;color:#FFFFFF;margin-bottom:8px;\">Inventory<\/div>\n        <div style=\"font-family:'JetBrains Mono',Consolas,monospace;font-size:12px;color:#F2CBAF;line-height:2;\">INT Transfer \u00b7 SAJ Stock Adjustment<br>MIN Issue Note \u00b7 MRN Return Note<\/div>\n      <\/div><\/div>\n      <div class=\"col-md-6 col-lg-4\" style=\"margin-bottom:16px;\"><div class=\"h-100\" style=\"background-color:#452A16;border:1px solid #704A2E;border-radius:4px;padding:18px;\">\n        <div style=\"font-size:14px;font-weight:800;color:#FFFFFF;margin-bottom:8px;\">Projects &amp; CRM<\/div>\n        <div style=\"font-family:'JetBrains Mono',Consolas,monospace;font-size:12px;color:#F2CBAF;line-height:2;\">JOB Project \u00b7 TID Task \u00b7 CRM Lead<br>EST Estimation \u00b7 JO Job Order<\/div>\n      <\/div><\/div>\n      <div class=\"col-md-6 col-lg-4\" style=\"margin-bottom:16px;\"><div class=\"h-100\" style=\"background-color:#452A16;border:1px solid #704A2E;border-radius:4px;padding:18px;\">\n        <div style=\"font-size:14px;font-weight:800;color:#FFFFFF;margin-bottom:8px;\">Operations<\/div>\n        <div style=\"font-family:'JetBrains Mono',Consolas,monospace;font-size:12px;color:#F2CBAF;line-height:2;\">BoM \u00b7 MO \u00b7 QC \u00b7 HT Helpdesk<br>DR / WR / MR Site Reports \u00b7 Transport<\/div>\n      <\/div><\/div>\n    <\/div>\n    <img src=\"../smart_sequence_engine/static/description/04_document_coverage.png\" alt=\"Document coverage\" style=\"max-width:100%;border-radius:4px;display:block;margin-top:10px;border:1px solid #704A2E;height:auto;\">\n  <\/div>\n<\/section>\n\n\n<!-- 05 Lock protection -->\n\n<section class=\"oe_container\" id=\"cpa-section-8\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background-color:#FCF4EE;border:1px solid #EEBC99;border-radius:4px;padding:34px;margin:20px 0;\">\n    <div style=\"font-size:12px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:#A3531A;margin-bottom:8px;\">05 \u00b7 Lock protection<\/div>\n    <h2 style=\"font-size:28px;font-weight:800;color:#26160B;margin:0 0 10px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#FAEADF;padding-bottom:14px;\">Nobody breaks your numbering by accident<\/h2>\n    <p style=\"font-size:16px;color:#826B5B;line-height:1.7;margin:0 0 10px;max-width:820px;\">\n      New sequences are locked by default. On a locked sequence the name, prefix, pattern and implementation can't be\n      edited. Select rows and press <b>Lock / Unlock<\/b> when a change is really needed.\n    <\/p>\n    <p style=\"font-size:16px;color:#826B5B;line-height:1.7;margin:0 0 20px;max-width:820px;\">\n      The document number on invoices, quotations, purchase orders and transfers can only be edited by users in the\n      <b>Sequence Editor<\/b> group.\n    <\/p>\n    <img src=\"../smart_sequence_engine/static/description/05_lock_protection.png\" alt=\"Lock protection\" style=\"max-width:100%;border-radius:4px;display:block;border:1px solid #EEBC99;height:auto;\">\n  <\/div>\n<\/section>\n\n\n<!-- 06 Backdated -->\n\n<section class=\"oe_container\" id=\"cpa-section-9\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background-color:#FEF9F6;border:1px solid #F5E9E0;border-radius:4px;padding:34px;margin:20px 0;\">\n    <div style=\"font-size:12px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:#A0521A;margin-bottom:8px;\">06 \u00b7 Backdated documents<\/div>\n    <h2 style=\"font-size:28px;font-weight:800;color:#26160B;margin:0 0 10px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#FAEADF;padding-bottom:14px;\">The right number for the right period<\/h2>\n    <p style=\"font-size:16px;color:#826B5B;line-height:1.7;margin:0 0 20px;max-width:820px;\">\n      Change an invoice, journal voucher or payment date to an earlier year or month and its number moves to that\n      period's series, continuing after the highest number already used there.\n      For example <b style=\"font-family:'JetBrains Mono',Consolas,monospace;color:#B25B1D;\">INV/SKL/2026/00146<\/b> moved to December 2025\n      becomes <b style=\"font-family:'JetBrains Mono',Consolas,monospace;color:#B25B1D;\">INV/SKL/2025/00913<\/b>.\n    <\/p>\n    <img src=\"../smart_sequence_engine/static/description/06_backdated_documents.png\" alt=\"Backdated documents\" style=\"max-width:100%;border-radius:4px;display:block;border:1px solid #F5E9E0;height:auto;\">\n  <\/div>\n<\/section>\n\n\n<!-- 07 Revisions -->\n\n<section class=\"oe_container\" id=\"cpa-section-10\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background-color:#FEF9F6;border:1px solid #F5E9E0;border-radius:4px;padding:34px;margin:20px 0;\">\n    <div style=\"font-size:12px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:#A0521A;margin-bottom:8px;\">07 \u00b7 Quotation revisions<\/div>\n    <h2 style=\"font-size:28px;font-weight:800;color:#26160B;margin:0 0 10px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#FAEADF;padding-bottom:14px;\">Revise without wasting numbers<\/h2>\n    <p style=\"font-size:16px;color:#826B5B;line-height:1.7;margin:0 0 20px;max-width:820px;\">\n      Use <b>Action \u2192 Revision<\/b> on a quotation to copy it with all its lines as\n      <b style=\"font-family:'JetBrains Mono',Consolas,monospace;color:#B25B1D;\">QT/SKL/2026/00148-R1<\/b>, then -R2 and so on.\n      The original keeps its number and new quotations simply continue the normal series.\n    <\/p>\n    <img src=\"../smart_sequence_engine/static/description/07_quotation_revision.png\" alt=\"Quotation revision\" style=\"max-width:100%;border-radius:4px;display:block;border:1px solid #F5E9E0;height:auto;\">\n  <\/div>\n<\/section>\n\n\n<!-- 08 Smart next number -->\n\n<section class=\"oe_container\" id=\"cpa-section-11\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background-color:#FEF9F6;border:1px solid #F5E9E0;border-radius:4px;padding:34px;margin:20px 0;\">\n    <div style=\"font-size:12px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:#A0521A;margin-bottom:8px;\">08 \u00b7 Smart next number<\/div>\n    <h2 style=\"font-size:28px;font-weight:800;color:#26160B;margin:0 0 10px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#FAEADF;padding-bottom:14px;\">Respects imports, prevents duplicates<\/h2>\n    <p style=\"font-size:16px;color:#826B5B;line-height:1.7;margin:0 0 20px;max-width:820px;\">\n      By default the next number continues after the highest number already used for the current prefix and period,\n      even after imports or manual entries. If a posted entry already has the same number, the next free one is used.\n      Turn on <b>Start New Sequence<\/b> when you really want to restart from the counter.\n    <\/p>\n    <img src=\"../smart_sequence_engine/static/description/08_smart_next_number.png\" alt=\"Smart next number\" style=\"max-width:100%;border-radius:4px;display:block;border:1px solid #F5E9E0;height:auto;\">\n  <\/div>\n<\/section>\n\n\n<!-- 09 Multi-company -->\n\n<section class=\"oe_container\" id=\"cpa-section-12\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background-color:#FEF9F6;border:1px solid #F5E9E0;border-radius:4px;padding:34px;margin:20px 0;\">\n    <div style=\"font-size:12px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:#A0521A;margin-bottom:8px;\">09 \u00b7 Multi-company &amp; permissions<\/div>\n    <h2 style=\"font-size:28px;font-weight:800;color:#26160B;margin:0 0 10px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#FAEADF;padding-bottom:14px;\">Every company keeps its own series<\/h2>\n    <p style=\"font-size:16px;color:#826B5B;line-height:1.7;margin:0 0 20px;max-width:820px;\">\n      Sequences are created per company, so <b style=\"font-family:'JetBrains Mono',Consolas,monospace;color:#B25B1D;\">INV/SKL/\u2026<\/b> and\n      <b style=\"font-family:'JetBrains Mono',Consolas,monospace;color:#B25B1D;\">INV/NVB/\u2026<\/b> run side by side without clashing.\n      Give the <b>Sequence Editor<\/b> permission only to the people who may change document numbers.\n    <\/p>\n    <img src=\"../smart_sequence_engine/static/description/09_multi_company_permissions.png\" alt=\"Multi-company and permissions\" style=\"max-width:100%;border-radius:4px;display:block;border:1px solid #F5E9E0;height:auto;\">\n  <\/div>\n<\/section>\n\n\n<!-- How it works -->\n\n<section class=\"oe_container\" id=\"cpa-section-13\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:30px 0 20px;\">\n    <div style=\"text-align:center;margin-bottom:28px;\">\n      <div style=\"font-size:12px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:#B65E1E;margin-bottom:10px;\">How it works<\/div>\n      <h2 style=\"font-size:32px;font-weight:800;color:#26160B;margin:0;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#FAEADF;padding-bottom:14px;\">Ready in three steps<\/h2>\n    <\/div>\n    <div class=\"row\">\n      <div class=\"col-md-4\" style=\"margin-bottom:20px;\"><div class=\"h-100\" style=\"border-radius:4px;padding:26px;background-color:#FFFFFF;border:1px solid #F5E9E0;\">\n        <div style=\"display:inline-block;width:44px;height:44px;line-height:44px;text-align:center;border-radius:50%;background-color:#FDF5F0;color:#AD591D;font-weight:800;font-size:18px;margin-bottom:14px;\">1<\/div>\n        <h3 style=\"font-size:18px;font-weight:800;color:#26160B;margin:0 0 8px;\">Install<\/h3>\n        <p style=\"font-size:14px;color:#826B5B;line-height:1.65;margin:0;\">Install Advanced Sequence Manager. Missing sequences are created for your companies, locked by default.<\/p>\n      <\/div><\/div>\n      <div class=\"col-md-4\" style=\"margin-bottom:20px;\"><div class=\"h-100\" style=\"border-radius:4px;padding:26px;background-color:#FFFFFF;border:1px solid #F5E9E0;\">\n        <div style=\"display:inline-block;width:44px;height:44px;line-height:44px;text-align:center;border-radius:50%;background-color:#FCF4EF;color:#A0521A;font-weight:800;font-size:18px;margin-bottom:14px;\">2<\/div>\n        <h3 style=\"font-size:18px;font-weight:800;color:#26160B;margin:0 0 8px;\">Set your prefix<\/h3>\n        <p style=\"font-size:14px;color:#826B5B;line-height:1.65;margin:0;\">Unlock the rows, open Reset Company Prefix, type your code and choose the format.<\/p>\n      <\/div><\/div>\n      <div class=\"col-md-4\" style=\"margin-bottom:20px;\"><div class=\"h-100\" style=\"border-radius:4px;padding:26px;background-color:#FFFFFF;border:1px solid #F5E9E0;\">\n        <div style=\"display:inline-block;width:44px;height:44px;line-height:44px;text-align:center;border-radius:50%;background-color:#FCF4EE;color:#A3531A;font-weight:800;font-size:18px;margin-bottom:14px;\">3<\/div>\n        <h3 style=\"font-size:18px;font-weight:800;color:#26160B;margin:0 0 8px;\">Work as usual<\/h3>\n        <p style=\"font-size:14px;color:#826B5B;line-height:1.65;margin:0;\">Create documents normally. Numbers follow the rule, sequences relock and only editors can change them.<\/p>\n      <\/div><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- FAQ -->\n\n<section class=\"oe_container\" id=\"cpa-section-14\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:20px 0;max-width:880px;margin:0 auto;\">\n    <h2 style=\"font-size:28px;font-weight:800;color:#26160B;margin:0 0 18px;text-align:center;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#FAEADF;padding-bottom:14px;\">Frequently asked questions<\/h2>\n    <div style=\"border:1px solid #F5E9E0;border-radius:4px;padding:18px 22px;margin-bottom:12px;background-color:#FFFFFF;\">\n      <div style=\"font-size:16px;font-weight:800;color:#26160B;margin-bottom:6px;\">Is it really free?<\/div>\n      <div style=\"font-size:14px;color:#826B5B;line-height:1.65;\">Yes. Advanced Sequence Manager is free to download and use.<\/div>\n    <\/div>\n    <div style=\"border:1px solid #F5E9E0;border-radius:4px;padding:18px 22px;margin-bottom:12px;background-color:#FFFFFF;\">\n      <div style=\"font-size:16px;font-weight:800;color:#26160B;margin-bottom:6px;\">Will it renumber documents I've already posted?<\/div>\n      <div style=\"font-size:14px;color:#826B5B;line-height:1.65;\">No. The new rule applies to new numbers. Existing posted documents keep their numbers.<\/div>\n    <\/div>\n    <div style=\"border:1px solid #F5E9E0;border-radius:4px;padding:18px 22px;margin-bottom:12px;background-color:#FFFFFF;\">\n      <div style=\"font-size:16px;font-weight:800;color:#26160B;margin-bottom:6px;\">Which apps does it need?<\/div>\n      <div style=\"font-size:14px;color:#826B5B;line-height:1.65;\">Accounting, Sales, Purchase, Inventory, Project and CRM. Extra document types switch on when their apps are installed.<\/div>\n    <\/div>\n    <div style=\"border:1px solid #F5E9E0;border-radius:4px;padding:18px 22px;background-color:#FFFFFF;\">\n      <div style=\"font-size:16px;font-weight:800;color:#26160B;margin-bottom:6px;\">Does it work with several companies?<\/div>\n      <div style=\"font-size:14px;color:#826B5B;line-height:1.65;\">Yes. Every company has its own sequences and its own prefix.<\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- Upgrade to any Odoo version: indigo strip styled like a number sequence -->\n\n<section class=\"oe_container\" id=\"cpa-section-15\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background-color:#FDF5F0;border:1px solid #F7DFCE;border-radius:4px;padding:34px 26px;margin:30px 0 0;text-align:center;\">\n    <div style=\"font-size:12px;font-weight:800;letter-spacing:0.18em;text-transform:uppercase;color:#AD591D;margin-bottom:8px;\">Next in sequence<\/div>\n    <h2 style=\"font-size:30px;font-weight:800;color:#26160B;margin:0 0 10px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#FAEADF;padding-bottom:14px;\">Upgradeable to any Odoo version<\/h2>\n    <p style=\"font-size:15px;color:#826B5B;line-height:1.7;max-width:640px;margin:0 auto 20px;\">Available for Odoo 14 now. Need the Advanced Sequence Manager on another Odoo version? We upgrade it for you. Contact us on WhatsApp or email.<\/p>\n    <div style=\"font-family:'JetBrains Mono',Consolas,monospace;font-size:16px;margin:0 0 22px;\">\n      <span style=\"display:inline-block;background-color:#A36030;color:#FFFFFF;border-radius:4px;padding:8px 12px;margin:4px;font-weight:700;\">ODOO/14.0 \u2713<\/span>\n      <span style=\"display:inline-block;background-color:#FFFFFF;color:#A36030;border:1px solid #F2CBAF;border-radius:4px;padding:7px 11px;margin:4px;\">ODOO/15.0<\/span>\n      <span style=\"display:inline-block;background-color:#FFFFFF;color:#A36030;border:1px solid #F2CBAF;border-radius:4px;padding:7px 11px;margin:4px;\">ODOO/16.0<\/span>\n      <span style=\"display:inline-block;background-color:#FFFFFF;color:#A36030;border:1px solid #F2CBAF;border-radius:4px;padding:7px 11px;margin:4px;\">ODOO/17.0<\/span>\n      <span style=\"display:inline-block;background-color:#FFFFFF;color:#A36030;border:1px solid #F2CBAF;border-radius:4px;padding:7px 11px;margin:4px;\">ODOO/18.0<\/span>\n      <span style=\"display:inline-block;background-color:#FFFFFF;color:#A36030;border:1px solid #F2CBAF;border-radius:4px;padding:7px 11px;margin:4px;\">ODOO/19.0<\/span>\n    <\/div>\n    <a href=\"https://wa.me/971562568128?text=Hello%20Saaskul%2C%20I%20need%20Advanced%20Sequence%20Manager%20on%20another%20Odoo%20version.\" style=\"display:inline-block;background-color:#A36030;color:#FFFFFF;padding:14px 26px;border-radius:4px;font-weight:800;font-size:15px;margin:4px 6px;text-decoration:none;\">WhatsApp +971 56 256 8128<\/a>\n    <a href=\"mailto:info.cpabooks@gmail.com?subject=Advanced%20Sequence%20Manager%20-%20Odoo%20version%20upgrade\" style=\"display:inline-block;background-color:#FFFFFF;color:#81512E;padding:13px 25px;border-radius:4px;font-weight:800;font-size:15px;margin:4px 6px;text-decoration:none;border:1px solid #F2CBAF;\">info.cpabooks@gmail.com<\/a>\n  <\/div>\n<\/section>\n\n\n<!-- CTA -->\n\n<section class=\"oe_container\" id=\"cpa-section-16\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;text-align:center;background-color:#A36030;border-radius:4px;padding:48px 24px;margin:20px 0 40px;color:#FFFFFF;\">\n    <img src=\"../smart_sequence_engine/static/description/icon.png\" alt=\"Advanced Sequence Manager\" style=\"width:72px;height:auto;border-radius:4px;display:block;margin:0 auto 16px;max-width:100%;\">\n    <h2 style=\"font-size:32px;font-weight:800;color:#FFFFFF;margin:0 0 10px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#FAEADF;padding-bottom:14px;\">Clean numbering, free forever<\/h2>\n    <p style=\"font-size:16px;color:#FCF4ED;line-height:1.7;max-width:620px;margin:0 auto 22px;\">\n      Need help setting up prefixes or migrating existing numbers? The CPA Books ERP team is happy to help.\n    <\/p>\n    <a href=\"mailto:info.cpabooks@gmail.com?subject=CPA%20Books%20ERP%20Advanced%20Advanced%20Sequence%20Manager%20Support\" style=\"display:inline-block;background-color:#FFFFFF;color:#81512E;padding:14px 28px;border-radius:4px;font-weight:800;font-size:15px;margin:5px;text-decoration:none;\">info.cpabooks@gmail.com<\/a>\n    <div style=\"font-size:13px;color:#FDF6F1;margin-top:18px;\">Advanced Sequence Manager \u00b7 Odoo 14 \u00b7 by CPA Books ERP<\/div>\n  <\/div>\n<\/section>\n"}, {"name": "Recipe Library Management", "theme": "Olive / Restaurant operations", "path": "recipe_library_pro/static/description/index.html", "html": "<section class=\"oe_container\" style=\"padding:18px 8px;border-bottom:1px solid #E2E8F0;margin-bottom:24px;font-family:Arial,Helvetica,sans-serif;\"><strong style=\"color:#182B45;font-size:18px;\">CPA Books ERP<\/strong><a href=\"https://cpabookserp.com/contactus\" style=\"display:inline-block;margin:6px 0 6px 20px;color:#40536A;font-size:13px;text-decoration:none;\">Live Demo<\/a><a href=\"#cpa-section-1\" style=\"display:inline-block;margin:6px 0 6px 20px;color:#40536A;font-size:13px;text-decoration:none;\">Overview<\/a><a href=\"#cpa-section-2\" style=\"display:inline-block;margin:6px 0 6px 20px;color:#40536A;font-size:13px;text-decoration:none;\">Features<\/a><a href=\"#cpa-section-14\" style=\"display:inline-block;margin:6px 0 6px 20px;color:#40536A;font-size:13px;text-decoration:none;\">Support<\/a><\/section>\n<!-- Recipe Book. apps.odoo.com keeps only whitelisted inline styles (no background shorthand, gradients, flex,\n     box-shadow): use background-color and Bootstrap grid classes for layout. -->\n\n\n<!-- Hero -->\n\n<section class=\"oe_container\" id=\"cpa-section-1\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background-color:#556B2E;border-radius:20px;padding:28px 18px;text-align:left;color:#FFFFFF;\">\n    <div class=\"row align-items-center\"><div class=\"col-lg-7\" style=\"padding:18px;text-align:left;\"><img src=\"../recipe_library_pro/static/description/icon.png\" alt=\"Recipe Library Management\" style=\"width:96px;height:auto;border-radius:20px;display:block;margin:0 auto 20px;border:3px solid #C6EB86;max-width:100%;\">\n    <div style=\"display:inline-block;background-color:#556B2E;border:1px solid #556B2E;color:#EEF9DB;padding:6px 16px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;margin-bottom:18px;\">\n      CPA Books ERP \u00b7 Odoo 14 \u00b7 Free\n    <\/div>\n    <h1 style=\"font-size:38px;line-height:1.15;font-weight:800;letter-spacing:-0.02em;margin:0 auto 16px;max-width:820px;color:#FFFFFF;overflow-wrap:break-word;\">Recipe Library Management<\/h1><p style=\"font-size:19px;line-height:1.6;color:#EEF9DB;max-width:720px;margin:0 auto 26px;\">\n      Know what every dish costs, what your sales should have used, and where your kitchen stock is going.\n      Recipe costing, food cost %, consumption from sales and daily closing variance for restaurants.\n    <\/p>\n    <div style=\"margin:0 auto 24px;\">\n      <a href=\"#sk-features\" style=\"display:inline-block;background-color:#FFFFFF;color:#556B2E;padding:14px 28px;border-radius:12px;font-weight:800;font-size:15px;margin:5px;text-decoration:none;\">Explore Features<\/a>\n      <a href=\"mailto:info.cpabooks@gmail.com?subject=CPA%20Books%20ERP%20Recipe%20Library%20Management\" style=\"display:inline-block;background-color:#556B2E;color:#FFFFFF;padding:13px 27px;border-radius:12px;font-weight:800;font-size:15px;margin:5px;text-decoration:none;border:1px solid #DCF3B5;\">Ask a Question<\/a>\n    <\/div>\n    <div style=\"margin:0 auto 34px;\">\n      <span style=\"display:inline-block;background-color:#FFFFFF;color:#556B2E;padding:7px 16px;border-radius:20px;font-size:12px;font-weight:800;letter-spacing:0.08em;margin:4px;\">FREE<\/span>\n      <span style=\"display:inline-block;background-color:#556B2E;border:1px solid #556B2E;color:#EEF9DB;padding:7px 14px;border-radius:20px;font-size:12px;font-weight:700;margin:4px;\">Community<\/span>\n      <span style=\"display:inline-block;background-color:#556B2E;border:1px solid #556B2E;color:#EEF9DB;padding:7px 14px;border-radius:20px;font-size:12px;font-weight:700;margin:4px;\">Enterprise<\/span>\n      <span style=\"display:inline-block;background-color:#556B2E;border:1px solid #556B2E;color:#EEF9DB;padding:7px 14px;border-radius:20px;font-size:12px;font-weight:700;margin:4px;\">Restaurants<\/span>\n      <span style=\"display:inline-block;background-color:#556B2E;border:1px solid #556B2E;color:#EEF9DB;padding:7px 14px;border-radius:20px;font-size:12px;font-weight:700;margin:4px;\">Odoo 14.0<\/span>\n    <\/div>\n    <\/div><div class=\"col-lg-5\" style=\"padding:18px;\"><img src=\"../recipe_library_pro/static/description/banner.png\" alt=\"Recipe Library Management banner\" style=\"max-width:100%;border-radius:20px;display:block;margin:0 auto;border:4px solid #C6EB86;width:100%;height:auto;\">\n    <\/div><\/div><div class=\"row\" style=\"margin-top:30px;\">\n      <div class=\"col-6 col-md-3\" style=\"padding-top:12px;padding-bottom:12px;\">\n        <div style=\"font-size:34px;font-weight:800;color:#FFFFFF;\">Per dish<\/div>\n        <div style=\"font-size:13px;color:#EEF9DB;font-weight:600;\">standard cost &amp; food cost %<\/div>\n      <\/div>\n      <div class=\"col-6 col-md-3\" style=\"padding-top:12px;padding-bottom:12px;\">\n        <div style=\"font-size:34px;font-weight:800;color:#FFFFFF;\">Batch<\/div>\n        <div style=\"font-size:13px;color:#EEF9DB;font-weight:600;\">prep &amp; sub-recipe costing<\/div>\n      <\/div>\n      <div class=\"col-6 col-md-3\" style=\"padding-top:12px;padding-bottom:12px;\">\n        <div style=\"font-size:34px;font-weight:800;color:#FFFFFF;\">From sales<\/div>\n        <div style=\"font-size:13px;color:#EEF9DB;font-weight:600;\">theoretical ingredient usage<\/div>\n      <\/div>\n      <div class=\"col-6 col-md-3\" style=\"padding-top:12px;padding-bottom:12px;\">\n        <div style=\"font-size:34px;font-weight:800;color:#E8F7CE;\">Daily<\/div>\n        <div style=\"font-size:13px;color:#EEF9DB;font-weight:600;\">closing stock variance<\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- Before / After -->\n\n<section class=\"oe_container\" id=\"cpa-section-2\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:56px 0 16px;\">\n    <div style=\"text-align:center;margin-bottom:30px;\">\n      <div style=\"font-size:12px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:#556B2E;margin-bottom:10px;\">Why Recipe Library Management<\/div>\n      <h2 style=\"font-size:32px;font-weight:800;color:#222B12;margin:0 0 10px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#F0FADF;padding-bottom:14px;\">Stop guessing your food cost<\/h2>\n      <p style=\"font-size:16px;color:#505B3E;max-width:660px;margin:0 auto;line-height:1.7;\">\n        Most kitchens only find out about lost stock at month end. Recipe Library Management links your menu, your sales and your\n        chef's daily count, so the gap shows up the same day.\n      <\/p>\n    <\/div>\n    <div class=\"row\">\n      <div class=\"col-md-6\" style=\"margin-bottom:20px;\">\n        <div class=\"h-100\" style=\"background-color:#FFFFFF;border:1px solid #E7F3D3;border-radius:20px;padding:28px;\">\n          <div style=\"font-size:12px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:#505B3E;margin-bottom:16px;\">Without Recipe Library Management<\/div>\n          <p style=\"margin:0 0 10px;font-size:15px;color:#4D5B36;line-height:1.6;\">\u2717\u00a0 Dish costs live in old spreadsheets<\/p>\n          <p style=\"margin:0 0 10px;font-size:15px;color:#4D5B36;line-height:1.6;\">\u2717\u00a0 Nobody knows the real food cost % per item<\/p>\n          <p style=\"margin:0 0 10px;font-size:15px;color:#4D5B36;line-height:1.6;\">\u2717\u00a0 Sales and kitchen stock are never compared<\/p>\n          <p style=\"margin:0;font-size:15px;color:#4D5B36;line-height:1.6;\">\u2717\u00a0 Waste and over-portioning stay hidden<\/p>\n        <\/div>\n      <\/div>\n      <div class=\"col-md-6\" style=\"margin-bottom:20px;\">\n        <div class=\"h-100\" style=\"background-color:#F8FCF0;border:1px solid #DCF3B5;border-radius:20px;padding:28px;\">\n          <div style=\"font-size:12px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:#556B2E;margin-bottom:16px;\">With Recipe Library Management<\/div>\n          <p style=\"margin:0 0 10px;font-size:15px;color:#222B12;line-height:1.6;\"><span style=\"color:#556B2E;font-weight:800;\">\u2713<\/span>\u00a0 Every dish costed from its ingredients<\/p>\n          <p style=\"margin:0 0 10px;font-size:15px;color:#222B12;line-height:1.6;\"><span style=\"color:#556B2E;font-weight:800;\">\u2713<\/span>\u00a0 Food cost % and margin on every menu item<\/p>\n          <p style=\"margin:0 0 10px;font-size:15px;color:#222B12;line-height:1.6;\"><span style=\"color:#556B2E;font-weight:800;\">\u2713<\/span>\u00a0 Theoretical usage calculated from confirmed sales<\/p>\n          <p style=\"margin:0;font-size:15px;color:#222B12;line-height:1.6;\"><span style=\"color:#556B2E;font-weight:800;\">\u2713<\/span>\u00a0 Daily variance flagged as OK, Check or Variance<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- Feature grid -->\n\n<section class=\"oe_container\" id=\"sk-features\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:40px 0 20px;\">\n    <div style=\"text-align:center;margin-bottom:30px;\">\n      <div style=\"font-size:12px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:#556B2E;margin-bottom:10px;\">Key Features<\/div>\n      <h2 style=\"font-size:32px;font-weight:800;color:#222B12;margin:0;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#F0FADF;padding-bottom:14px;\">From recipe to closing stock<\/h2>\n    <\/div>\n    <div class=\"row\">\n      <div class=\"col-md-6 col-lg-4\" style=\"margin-bottom:20px;\"><div class=\"h-100\" style=\"background-color:#FFFFFF;border:1px solid #E7F3D3;border-radius:20px;padding:24px;\">\n        <div style=\"display:inline-block;font-family:'JetBrains Mono',Consolas,monospace;font-size:13px;font-weight:700;color:#FFFFFF;background-color:#556B2E;border-radius:10px;padding:8px 11px;margin-bottom:14px;\">01<\/div>\n        <h3 style=\"font-size:18px;font-weight:800;color:#222B12;margin:0 0 8px;\">Menu Book<\/h3>\n        <p style=\"font-size:14px;color:#505B3E;line-height:1.65;margin:0;\">One recipe per menu item with standard cost, selling price, food cost % and margin.<\/p>\n      <\/div><\/div>\n      <div class=\"col-md-6 col-lg-4\" style=\"margin-bottom:20px;\"><div class=\"h-100\" style=\"background-color:#FFFFFF;border:1px solid #E7F3D3;border-radius:20px;padding:24px;\">\n        <div style=\"display:inline-block;font-family:'JetBrains Mono',Consolas,monospace;font-size:13px;font-weight:700;color:#FFFFFF;background-color:#556B2E;border-radius:10px;padding:8px 11px;margin-bottom:14px;\">02<\/div>\n        <h3 style=\"font-size:18px;font-weight:800;color:#222B12;margin:0 0 8px;\">Recipe card<\/h3>\n        <p style=\"font-size:14px;color:#505B3E;line-height:1.65;margin:0;\">Ingredients per portion with quantity, unit and cost. Totals update as you type.<\/p>\n      <\/div><\/div>\n      <div class=\"col-md-6 col-lg-4\" style=\"margin-bottom:20px;\"><div class=\"h-100\" style=\"background-color:#FFFFFF;border:1px solid #E7F3D3;border-radius:20px;padding:24px;\">\n        <div style=\"display:inline-block;font-family:'JetBrains Mono',Consolas,monospace;font-size:13px;font-weight:700;color:#D9E5C2;background-color:#556B2E;border-radius:10px;padding:8px 11px;margin-bottom:14px;\">03<\/div>\n        <h3 style=\"font-size:18px;font-weight:800;color:#222B12;margin:0 0 8px;\">Visual dashboard<\/h3>\n        <p style=\"font-size:14px;color:#505B3E;line-height:1.65;margin:0;\">Menu cards with photo, selling price, standard cost and food cost %.<\/p>\n      <\/div><\/div>\n      <div class=\"col-md-6 col-lg-4\" style=\"margin-bottom:20px;\"><div class=\"h-100\" style=\"background-color:#FFFFFF;border:1px solid #E7F3D3;border-radius:20px;padding:24px;\">\n        <div style=\"display:inline-block;font-family:'JetBrains Mono',Consolas,monospace;font-size:13px;font-weight:700;color:#FFFFFF;background-color:#556B2E;border-radius:10px;padding:8px 11px;margin-bottom:14px;\">04<\/div>\n        <h3 style=\"font-size:18px;font-weight:800;color:#222B12;margin:0 0 8px;\">Prep &amp; sub-recipes<\/h3>\n        <p style=\"font-size:14px;color:#505B3E;line-height:1.65;margin:0;\">Batch recipes for rice, sauces and bases with batch cost and cost per unit of yield.<\/p>\n      <\/div><\/div>\n      <div class=\"col-md-6 col-lg-4\" style=\"margin-bottom:20px;\"><div class=\"h-100\" style=\"background-color:#FFFFFF;border:1px solid #E7F3D3;border-radius:20px;padding:24px;\">\n        <div style=\"display:inline-block;font-family:'JetBrains Mono',Consolas,monospace;font-size:13px;font-weight:700;color:#FFFFFF;background-color:#556B2E;border-radius:10px;padding:8px 11px;margin-bottom:14px;\">05<\/div>\n        <h3 style=\"font-size:18px;font-weight:800;color:#222B12;margin:0 0 8px;\">Consumption analysis<\/h3>\n        <p style=\"font-size:14px;color:#505B3E;line-height:1.65;margin:0;\">Theoretical ingredient usage and cost from confirmed sales, in list, pivot and graph.<\/p>\n      <\/div><\/div>\n      <div class=\"col-md-6 col-lg-4\" style=\"margin-bottom:20px;\"><div class=\"h-100\" style=\"background-color:#FFFFFF;border:1px solid #E7F3D3;border-radius:20px;padding:24px;\">\n        <div style=\"display:inline-block;font-family:'JetBrains Mono',Consolas,monospace;font-size:13px;font-weight:700;color:#D9E5C2;background-color:#556B2E;border-radius:10px;padding:8px 11px;margin-bottom:14px;\">06<\/div>\n        <h3 style=\"font-size:18px;font-weight:800;color:#222B12;margin:0 0 8px;\">Daily closing &amp; variance<\/h3>\n        <p style=\"font-size:14px;color:#505B3E;line-height:1.65;margin:0;\">Chef enters the closing count. Variance is calculated and colour-coded per ingredient.<\/p>\n      <\/div><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- 01 Menu Book -->\n\n<section class=\"oe_container\" id=\"cpa-section-4\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background-color:#F8FCF0;border:1px solid #DCF3B5;border-radius:20px;padding:34px;margin:20px 0;\">\n    <div style=\"font-size:12px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:#556B2E;margin-bottom:8px;\">01 \u00b7 Menu Book<\/div>\n    <h2 style=\"font-size:28px;font-weight:800;color:#222B12;margin:0 0 10px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#F0FADF;padding-bottom:14px;\">Every dish, costed<\/h2>\n    <p style=\"font-size:16px;color:#505B3E;line-height:1.7;margin:0 0 20px;max-width:820px;\">\n      Each recipe is linked to the sales product you sell. The list shows <b>standard cost, selling price,\n      food cost % and margin<\/b> for every dish, with branch and menu photo. Dishes up to 30% food cost show in green,\n      dishes above 30% in orange.\n    <\/p>\n    <img src=\"../recipe_library_pro/static/description/01_menu_book.png\" alt=\"Menu Book\" style=\"max-width:100%;border-radius:20px;display:block;border:1px solid #DCF3B5;height:auto;\">\n  <\/div>\n<\/section>\n\n\n<!-- 02 Recipe card -->\n\n<section class=\"oe_container\" id=\"cpa-section-5\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background-color:#F8FCF0;border:1px solid #DCF3B5;border-radius:20px;padding:34px;margin:20px 0;\">\n    <div style=\"font-size:12px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:#556B2E;margin-bottom:8px;\">02 \u00b7 Recipe card<\/div>\n    <h2 style=\"font-size:28px;font-weight:800;color:#222B12;margin:0 0 10px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#F0FADF;padding-bottom:14px;\">Ingredients in, food cost out<\/h2>\n    <p style=\"font-size:16px;color:#505B3E;line-height:1.7;margin:0 0 20px;max-width:820px;\">\n      Add each ingredient or prep item with its quantity per portion. The unit cost comes from the product cost,\n      so the <b>standard cost, food cost % and margin<\/b> are always current. Set the code, branch and category\n      (Sushi, Japanese, Arabic or Other), add a menu photo and notes, and press <b>Sales of this Menu<\/b> to see its\n      confirmed sales lines.\n    <\/p>\n    <img src=\"../recipe_library_pro/static/description/02_recipe_card.png\" alt=\"Recipe card\" style=\"max-width:100%;border-radius:20px;display:block;border:1px solid #DCF3B5;height:auto;\">\n  <\/div>\n<\/section>\n\n\n<!-- 03 Dashboard -->\n\n<section class=\"oe_container\" id=\"cpa-section-6\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background-color:#F8FCF0;border:1px solid #DCF3B5;border-radius:20px;padding:34px;margin:20px 0;\">\n    <div style=\"font-size:12px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:#556B2E;margin-bottom:8px;\">03 \u00b7 Dashboard<\/div>\n    <h2 style=\"font-size:28px;font-weight:800;color:#222B12;margin:0 0 10px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#F0FADF;padding-bottom:14px;\">Your menu at a glance<\/h2>\n    <p style=\"font-size:16px;color:#505B3E;line-height:1.7;margin:0 0 20px;max-width:820px;\">\n      The Recipe Library Management Dashboard shows every dish as a card with its photo, selling price, standard cost and food cost %.\n      Switch to the list or open a recipe in one click.\n    <\/p>\n    <img src=\"../recipe_library_pro/static/description/03_dashboard.png\" alt=\"Recipe Library Management dashboard\" style=\"max-width:100%;border-radius:20px;display:block;border:1px solid #DCF3B5;height:auto;\">\n  <\/div>\n<\/section>\n\n\n<!-- 04 Prep -->\n\n<section class=\"oe_container\" id=\"cpa-section-7\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background-color:#F8FCF0;border:1px solid #DCF3B5;border-radius:20px;padding:34px;margin:20px 0;\">\n    <div style=\"font-size:12px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:#556B2E;margin-bottom:8px;\">04 \u00b7 Prep &amp; sub-recipes<\/div>\n    <h2 style=\"font-size:28px;font-weight:800;color:#222B12;margin:0 0 10px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#F0FADF;padding-bottom:14px;\">Batch once, cost per kilo<\/h2>\n    <p style=\"font-size:16px;color:#505B3E;line-height:1.7;margin:0 0 20px;max-width:820px;\">\n      Sushi rice, sauces and bases are cooked in batches. Enter the raw ingredients and the batch yield:\n      Recipe Library Management calculates the <b>batch cost<\/b> and the <b>cost per unit<\/b>, for example\n      AED 39.00 \u00f7 5 kg = AED 7.80 per kg. Use the prep product inside your menu recipes.\n    <\/p>\n    <img src=\"../recipe_library_pro/static/description/04_prep_sub_recipes.png\" alt=\"Prep and sub-recipes\" style=\"max-width:100%;border-radius:20px;display:block;border:1px solid #DCF3B5;height:auto;\">\n  <\/div>\n<\/section>\n\n\n<!-- 05 Consumption -->\n\n<section class=\"oe_container\" id=\"cpa-section-8\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background-color:#222B12;border-radius:20px;padding:38px 34px;margin:20px 0;color:#FFFFFF;\">\n    <div style=\"font-size:12px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:#C6EB86;margin-bottom:8px;\">05 \u00b7 Consumption analysis<\/div>\n    <h2 style=\"font-size:28px;font-weight:800;color:#FFFFFF;margin:0 0 10px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#F0FADF;padding-bottom:14px;\">What your sales should have used<\/h2>\n    <p style=\"font-size:16px;color:#EAF5D8;line-height:1.7;margin:0 0 22px;max-width:820px;\">\n      For every confirmed sales order, Recipe Library Management multiplies the sold quantity by the recipe quantity to get the\n      <b style=\"color:#FFFFFF;\">theoretical ingredient usage<\/b> and its cost, next to the sales value and potential food cost %.\n    <\/p>\n    <div class=\"row\">\n      <div class=\"col-md-4\" style=\"margin-bottom:16px;\"><div class=\"h-100\" style=\"background-color:#2E3A19;border:1px solid #485A28;border-radius:20px;padding:18px;\">\n        <div style=\"font-size:12px;font-weight:700;color:#C6EB86;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.08em;\">Group by<\/div>\n        <div style=\"font-size:15px;color:#FFFFFF;line-height:1.6;\">Date, branch, menu item and ingredient<\/div>\n      <\/div><\/div>\n      <div class=\"col-md-4\" style=\"margin-bottom:16px;\"><div class=\"h-100\" style=\"background-color:#2E3A19;border:1px solid #485A28;border-radius:20px;padding:18px;\">\n        <div style=\"font-size:12px;font-weight:700;color:#C6EB86;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.08em;\">Measures<\/div>\n        <div style=\"font-size:15px;color:#FFFFFF;line-height:1.6;\">Sold qty, theoretical qty, theoretical cost, sales value<\/div>\n      <\/div><\/div>\n      <div class=\"col-md-4\" style=\"margin-bottom:16px;\"><div class=\"h-100\" style=\"background-color:#2E3A19;border:1px solid #485A28;border-radius:20px;padding:18px;\">\n        <div style=\"font-size:12px;font-weight:700;color:#C6EB86;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.08em;\">Views<\/div>\n        <div style=\"font-size:15px;color:#FFFFFF;line-height:1.6;\">List, pivot (by month, branch, ingredient) and graph<\/div>\n      <\/div><\/div>\n    <\/div>\n    <img src=\"../recipe_library_pro/static/description/05_consumption_analysis.png\" alt=\"Consumption analysis\" style=\"max-width:100%;border-radius:20px;display:block;margin-top:10px;border:1px solid #485A28;height:auto;\">\n  <\/div>\n<\/section>\n\n\n<!-- 06 Closing -->\n\n<section class=\"oe_container\" id=\"cpa-section-9\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background-color:#F8FCF0;border:1px solid #DCF3B5;border-radius:20px;padding:34px;margin:20px 0;\">\n    <div style=\"font-size:12px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:#556B2E;margin-bottom:8px;\">06 \u00b7 Daily closing &amp; variance<\/div>\n    <h2 style=\"font-size:28px;font-weight:800;color:#222B12;margin:0 0 10px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#F0FADF;padding-bottom:14px;\">Spot the gap every day<\/h2>\n    <p style=\"font-size:16px;color:#505B3E;line-height:1.7;margin:0 0 20px;max-width:820px;\">\n      <b>Start Daily Closing<\/b> asks for the date and branch and creates a closing line for every ingredient used in your recipes.\n      Fill in opening stock, purchases, transfers in and out, waste and the expected usage from sales, then the chef enters\n      the <b>closing count<\/b>. Actual consumption, expected closing and variance are calculated on each line.\n    <\/p>\n    <img src=\"../recipe_library_pro/static/description/06_closing_variance.png\" alt=\"Closing stock and variance\" style=\"max-width:100%;border-radius:20px;display:block;border:1px solid #DCF3B5;height:auto;\">\n  <\/div>\n<\/section>\n\n\n<!-- 07 Variance rules -->\n\n<section class=\"oe_container\" id=\"cpa-section-10\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:20px 0;\">\n    <div style=\"font-size:12px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:#556B2E;margin-bottom:8px;\">07 \u00b7 How variance works<\/div>\n    <h2 style=\"font-size:28px;font-weight:800;color:#222B12;margin:0 0 20px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#F0FADF;padding-bottom:14px;\">Simple maths, clear status<\/h2>\n    <div class=\"row\">\n      <div class=\"col-md-4\" style=\"margin-bottom:16px;\"><div class=\"h-100\" style=\"background-color:#556B2E;border-radius:20px;padding:22px;color:#FFFFFF;\">\n        <div style=\"font-size:22px;font-weight:800;margin-bottom:4px;\">OK<\/div>\n        <div style=\"font-size:14px;color:#F0FADE;\">Variance up to 3%<\/div>\n      <\/div><\/div>\n      <div class=\"col-md-4\" style=\"margin-bottom:16px;\"><div class=\"h-100\" style=\"background-color:#556B2E;border-radius:20px;padding:22px;color:#FFFFFF;\">\n        <div style=\"font-size:22px;font-weight:800;margin-bottom:4px;\">Check<\/div>\n        <div style=\"font-size:14px;color:#E8F7CE;\">Above 3%, up to 8%<\/div>\n      <\/div><\/div>\n      <div class=\"col-md-4\" style=\"margin-bottom:16px;\"><div class=\"h-100\" style=\"background-color:#556B2E;border-radius:20px;padding:22px;color:#FFFFFF;\">\n        <div style=\"font-size:22px;font-weight:800;margin-bottom:4px;\">Variance<\/div>\n        <div style=\"font-size:14px;color:#F3FBE5;\">Above 8%<\/div>\n      <\/div><\/div>\n    <\/div>\n    <img src=\"../recipe_library_pro/static/description/07_how_variance_works.png\" alt=\"How variance works\" style=\"max-width:100%;border-radius:20px;display:block;margin-top:8px;border:1px solid #DCF3B5;height:auto;\">\n  <\/div>\n<\/section>\n\n\n<!-- How it works -->\n\n<section class=\"oe_container\" id=\"cpa-section-11\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:30px 0 20px;\">\n    <div style=\"text-align:center;margin-bottom:28px;\">\n      <div style=\"font-size:12px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:#556B2E;margin-bottom:10px;\">How it works<\/div>\n      <h2 style=\"font-size:32px;font-weight:800;color:#222B12;margin:0;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#F0FADF;padding-bottom:14px;\">Up and running in four steps<\/h2>\n    <\/div>\n    <div class=\"row\">\n      <div class=\"col-md-6 col-lg-3\" style=\"margin-bottom:20px;\"><div class=\"h-100\" style=\"border-radius:20px;padding:24px;background-color:#FFFFFF;border:1px solid #E7F3D3;\">\n        <div style=\"display:inline-block;width:44px;height:44px;line-height:44px;text-align:center;border-radius:50%;background-color:#EEF9DB;color:#556B2E;font-weight:800;font-size:18px;margin-bottom:14px;\">1<\/div>\n        <h3 style=\"font-size:17px;font-weight:800;color:#222B12;margin:0 0 8px;\">Prep recipes<\/h3>\n        <p style=\"font-size:14px;color:#505B3E;line-height:1.65;margin:0;\">Create batch recipes for rice, sauces and bases.<\/p>\n      <\/div><\/div>\n      <div class=\"col-md-6 col-lg-3\" style=\"margin-bottom:20px;\"><div class=\"h-100\" style=\"border-radius:20px;padding:24px;background-color:#FFFFFF;border:1px solid #E7F3D3;\">\n        <div style=\"display:inline-block;width:44px;height:44px;line-height:44px;text-align:center;border-radius:50%;background-color:#EEF9DB;color:#556B2E;font-weight:800;font-size:18px;margin-bottom:14px;\">2<\/div>\n        <h3 style=\"font-size:17px;font-weight:800;color:#222B12;margin:0 0 8px;\">Menu recipes<\/h3>\n        <p style=\"font-size:14px;color:#505B3E;line-height:1.65;margin:0;\">Link each menu item to its sales product and add ingredients.<\/p>\n      <\/div><\/div>\n      <div class=\"col-md-6 col-lg-3\" style=\"margin-bottom:20px;\"><div class=\"h-100\" style=\"border-radius:20px;padding:24px;background-color:#FFFFFF;border:1px solid #E7F3D3;\">\n        <div style=\"display:inline-block;width:44px;height:44px;line-height:44px;text-align:center;border-radius:50%;background-color:#EEF9DB;color:#556B2E;font-weight:800;font-size:18px;margin-bottom:14px;\">3<\/div>\n        <h3 style=\"font-size:17px;font-weight:800;color:#222B12;margin:0 0 8px;\">Sell as usual<\/h3>\n        <p style=\"font-size:14px;color:#505B3E;line-height:1.65;margin:0;\">Confirmed sales feed the Consumption Analysis automatically.<\/p>\n      <\/div><\/div>\n      <div class=\"col-md-6 col-lg-3\" style=\"margin-bottom:20px;\"><div class=\"h-100\" style=\"border-radius:20px;padding:24px;background-color:#FFFFFF;border:1px solid #E7F3D3;\">\n        <div style=\"display:inline-block;width:44px;height:44px;line-height:44px;text-align:center;border-radius:50%;background-color:#EEF9DB;color:#556B2E;font-weight:800;font-size:18px;margin-bottom:14px;\">4<\/div>\n        <h3 style=\"font-size:17px;font-weight:800;color:#222B12;margin:0 0 8px;\">Close the day<\/h3>\n        <p style=\"font-size:14px;color:#505B3E;line-height:1.65;margin:0;\">Start Daily Closing, enter the chef's count and review the variance.<\/p>\n      <\/div><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- Access & FAQ -->\n\n<section class=\"oe_container\" id=\"cpa-section-12\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:20px 0;max-width:880px;margin:0 auto;\">\n    <h2 style=\"font-size:28px;font-weight:800;color:#222B12;margin:0 0 18px;text-align:center;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#F0FADF;padding-bottom:14px;\">Frequently asked questions<\/h2>\n    <div style=\"border:1px solid #E7F3D3;border-radius:20px;padding:18px 22px;margin-bottom:12px;background-color:#FFFFFF;\">\n      <div style=\"font-size:16px;font-weight:800;color:#222B12;margin-bottom:6px;\">Is it really free?<\/div>\n      <div style=\"font-size:14px;color:#505B3E;line-height:1.65;\">Yes. Recipe Library Management is free to download and use.<\/div>\n    <\/div>\n    <div style=\"border:1px solid #E7F3D3;border-radius:20px;padding:18px 22px;margin-bottom:12px;background-color:#FFFFFF;\">\n      <div style=\"font-size:16px;font-weight:800;color:#222B12;margin-bottom:6px;\">Who can do what?<\/div>\n      <div style=\"font-size:14px;color:#505B3E;line-height:1.65;\"><b>Recipe Library Management User / Chef<\/b> views recipes, enters daily closing counts and reads the consumption analysis. <b>Recipe Library Management Manager<\/b> also creates and edits menu and prep recipes.<\/div>\n    <\/div>\n    <div style=\"border:1px solid #E7F3D3;border-radius:20px;padding:18px 22px;margin-bottom:12px;background-color:#FFFFFF;\">\n      <div style=\"font-size:16px;font-weight:800;color:#222B12;margin-bottom:6px;\">Which apps does it need?<\/div>\n      <div style=\"font-size:14px;color:#505B3E;line-height:1.65;\">Sales, Inventory and Purchase. Ingredient costs come from the product cost in Odoo.<\/div>\n    <\/div>\n    <div style=\"border:1px solid #E7F3D3;border-radius:20px;padding:18px 22px;background-color:#FFFFFF;\">\n      <div style=\"font-size:16px;font-weight:800;color:#222B12;margin-bottom:6px;\">Does it work with several branches?<\/div>\n      <div style=\"font-size:14px;color:#505B3E;line-height:1.65;\">Yes. Recipes, consumption and daily closings all carry a branch, so each location is checked on its own.<\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- Upgrade to any Odoo version: a cream \"on the menu\" card -->\n\n<section class=\"oe_container\" id=\"cpa-section-13\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background-color:#F8FCF0;border:2px dashed #C6EB86;border-radius:20px;padding:34px 28px;margin:30px 0 0;\">\n    <div class=\"row align-items-center\" style=\"margin-left:0;margin-right:0;\">\n      <div class=\"col-md-7\" style=\"padding:6px 12px;\">\n        <div style=\"font-size:12px;font-weight:800;letter-spacing:0.18em;text-transform:uppercase;color:#556B2E;margin-bottom:8px;\">Cooked to order<\/div>\n        <h2 style=\"font-size:30px;font-weight:800;color:#222B12;margin:0 0 10px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#F0FADF;padding-bottom:14px;\">Upgradeable to any Odoo version<\/h2>\n        <p style=\"font-size:15px;color:#505B3E;line-height:1.7;margin:0 0 18px;\">Recipe Library Management is on the menu for Odoo 14 today. Running a different Odoo version? We prepare it for yours. Just message us on WhatsApp or email.<\/p>\n        <a href=\"https://wa.me/971562568128?text=Hello%20Saaskul%2C%20I%20need%20Recipe%20Library%20Management%20on%20another%20Odoo%20version.\" style=\"display:inline-block;background-color:#556B2E;color:#FFFFFF;padding:13px 24px;border-radius:12px;font-weight:800;font-size:14px;margin:4px 6px 4px 0;text-decoration:none;\">WhatsApp +971 56 256 8128<\/a>\n        <a href=\"mailto:info.cpabooks@gmail.com?subject=Recipe%20Library%20Management%20-%20Odoo%20version%20upgrade\" style=\"display:inline-block;background-color:#FFFFFF;color:#556B2E;padding:12px 23px;border-radius:12px;font-weight:800;font-size:14px;margin:4px 0;text-decoration:none;border:1px solid #C6EB86;\">info.cpabooks@gmail.com<\/a>\n      <\/div>\n      <div class=\"col-md-5\" style=\"padding:6px 12px;\">\n        <div style=\"background-color:#FFFFFF;border:1px solid #E7F3D3;border-radius:20px;padding:18px 20px;\">\n          <div style=\"font-size:13px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:#556B2E;text-align:center;margin-bottom:10px;\">Versions menu<\/div>\n          <div style=\"font-size:15px;color:#222B12;padding:7px 0;border-bottom:1px dotted #C6EB86;\"><b>Odoo 14<\/b><span style=\"float:right;color:#556B2E;font-weight:800;\">Served now<\/span><\/div>\n          <div style=\"font-size:15px;color:#222B12;padding:7px 0;border-bottom:1px dotted #C6EB86;\">Odoo 15 \u00b7 16<span style=\"float:right;color:#505B3E;\">On request<\/span><\/div>\n          <div style=\"font-size:15px;color:#222B12;padding:7px 0;border-bottom:1px dotted #C6EB86;\">Odoo 17 \u00b7 18<span style=\"float:right;color:#505B3E;\">On request<\/span><\/div>\n          <div style=\"font-size:15px;color:#222B12;padding:7px 0;\">Odoo 19<span style=\"float:right;color:#505B3E;\">On request<\/span><\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- CTA -->\n\n<section class=\"oe_container\" id=\"cpa-section-14\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;text-align:center;background-color:#556B2E;border-radius:20px;padding:48px 24px;margin:20px 0 40px;color:#FFFFFF;\">\n    <img src=\"../recipe_library_pro/static/description/icon.png\" alt=\"Recipe Library Management\" style=\"width:72px;height:auto;border-radius:20px;display:block;margin:0 auto 16px;border:3px solid #C6EB86;max-width:100%;\">\n    <h2 style=\"font-size:32px;font-weight:800;color:#FFFFFF;margin:0 0 10px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#F0FADF;padding-bottom:14px;\">Control your food cost, free<\/h2>\n    <p style=\"font-size:16px;color:#EEF9DB;line-height:1.7;max-width:620px;margin:0 auto 22px;\">\n      Need help setting up recipes or daily closings for your kitchen? The CPA Books ERP team is happy to help.\n    <\/p>\n    <a href=\"mailto:info.cpabooks@gmail.com?subject=CPA%20Books%20ERP%20Recipe%20Library%20Management%20Support\" style=\"display:inline-block;background-color:#FFFFFF;color:#556B2E;padding:14px 28px;border-radius:12px;font-weight:800;font-size:15px;margin:5px;text-decoration:none;\">info.cpabooks@gmail.com<\/a>\n    <div style=\"font-size:13px;color:#DCF3B5;margin-top:18px;\">Recipe Library Management \u00b7 Odoo 14 \u00b7 by CPA Books ERP<\/div>\n  <\/div>\n<\/section>\n"}, {"name": "Switchgear Management System", "theme": "Electric blue / Manufacturing", "path": "switchgear_manager_pro/static/description/index.html", "html": "<section class=\"oe_container\" style=\"padding:18px 8px;border-bottom:1px solid #E2E8F0;margin-bottom:24px;font-family:Arial,Helvetica,sans-serif;\"><strong style=\"color:#182B45;font-size:18px;\">CPA Books ERP<\/strong><a href=\"https://cpabookserp.com/contactus\" style=\"display:inline-block;margin:6px 0 6px 20px;color:#40536A;font-size:13px;text-decoration:none;\">Live Demo<\/a><a href=\"#cpa-section-1\" style=\"display:inline-block;margin:6px 0 6px 20px;color:#40536A;font-size:13px;text-decoration:none;\">Overview<\/a><a href=\"#sw-cycle\" style=\"display:inline-block;margin:6px 0 6px 20px;color:#40536A;font-size:13px;text-decoration:none;\">Features<\/a><a href=\"#cpa-section-14\" style=\"display:inline-block;margin:6px 0 6px 20px;color:#40536A;font-size:13px;text-decoration:none;\">Support<\/a><\/section>\n<!-- Switchgear. apps.odoo.com keeps only whitelisted inline styles (no background shorthand, gradients, flex,\n     box-shadow, overflow, border-left/right shorthand): use background-color, border-*-width/style/color and Bootstrap grid. -->\n\n\n<!-- Hero: graphite slab, yellow eyebrow, hazard rule -->\n\n<section class=\"oe_container\" id=\"cpa-section-1\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Barlow,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background-color:#161B1D;border-radius:3px;padding:36px 22px 0;color:#FFFFFF;border-top:6px solid #38BED9;\">\n    <div class=\"row align-items-center\" style=\"margin-left:0;margin-right:0;\">\n      <div class=\"col-md-7\" style=\"padding:0 10px 30px;\">\n        <div style=\"display:inline-block;background-color:#31B3DE;color:#161B1D;padding:6px 14px;border-radius:3px;font-size:12px;font-weight:800;letter-spacing:0.16em;text-transform:uppercase;margin-bottom:18px;\">\n          CPA Books ERP \u00b7 Odoo 14 \u00b7 Free\n        <\/div>\n        <h1 style=\"font-size:38px;line-height:1.15;font-weight:900;letter-spacing:-0.01em;margin:0 0 16px;color:#FFFFFF;overflow-wrap:break-word;\">Switchgear Management System<\/h1><p style=\"font-size:20px;font-weight:700;color:#F3F5F6;margin:0 0 10px;\">Switchgear Management System &amp; electrical panel jobs, from CRM enquiry to vendor payment<\/p>\n        <p style=\"font-size:16px;line-height:1.65;color:#C9D0D3;margin:0 0 24px;max-width:560px;\">\n          One 16-step processing cycle links enquiry, estimate, quotation, design documents, BOM, manufacturing order,\n          purchase, quality check, GRN, delivery, invoice and payment. Every screen is one click away from a dedicated\n          Switchgear Management System workspace.\n        <\/p>\n        <a href=\"#sw-cycle\" style=\"display:inline-block;background-color:#31B3DE;color:#161B1D;padding:14px 26px;border-radius:3px;font-weight:800;font-size:15px;margin:4px 6px 4px 0;text-decoration:none;\">See the 16 steps<\/a>\n        <a href=\"mailto:info.cpabooks@gmail.com?subject=CPA%20Books%20ERP%20Switchgear%20Management%20System\" style=\"display:inline-block;background-color:#161B1D;color:#31B3DE;padding:13px 25px;border-radius:3px;font-weight:800;font-size:15px;margin:4px 0;text-decoration:none;border:1px solid #31B3DE;\">Ask for a demo<\/a>\n      <\/div>\n      <div class=\"col-md-5\" style=\"padding:0 10px 30px;text-align:center;\">\n        <img src=\"../switchgear_manager_pro/static/description/icon.png\" alt=\"Switchgear Management System\" style=\"width:190px;height:auto;display:block;margin:0 auto 14px;max-width:100%;\">\n        <div style=\"font-family:'JetBrains Mono',Consolas,monospace;font-size:13px;color:#31B3DE;letter-spacing:0.14em;\">ENQUIRY \u2192 PANEL \u2192 PAYMENT<\/div>\n      <\/div>\n    <\/div>\n    <div style=\"height:14px;background-color:#31B3DE;border-radius:0 0 20px 20px;margin:0 -34px;color:#3B3B3B;\"><\/div>\n  <\/div>\n<\/section>\n\n\n<!-- Banner on a steel frame + stat strip -->\n\n<section class=\"oe_container\" id=\"cpa-section-2\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Barlow,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background-color:#2A3437;border-radius:3px;padding:16px;margin-top:22px;color:#789DD0;\">\n    <img src=\"../switchgear_manager_pro/static/description/banner.png\" alt=\"Switchgear Management System banner\" style=\"max-width:100%;border-radius:3px;display:block;margin:0 auto;height:auto;\">\n    <div class=\"row\" style=\"margin:14px 0 0;text-align:center;\">\n      <div class=\"col-6 col-md-3\" style=\"padding:10px 6px;\"><div style=\"font-size:30px;font-weight:900;color:#31B3DE;\">16<\/div><div style=\"font-size:13px;color:#D1D8DB;\">steps in one cycle<\/div><\/div>\n      <div class=\"col-6 col-md-3\" style=\"padding:10px 6px;\"><div style=\"font-size:30px;font-weight:900;color:#31B3DE;\">4<\/div><div style=\"font-size:13px;color:#D1D8DB;\">phases, colour coded<\/div><\/div>\n      <div class=\"col-6 col-md-3\" style=\"padding:10px 6px;\"><div style=\"font-size:30px;font-weight:900;color:#31B3DE;\">8<\/div><div style=\"font-size:13px;color:#D1D8DB;\">live KPI tiles<\/div><\/div>\n      <div class=\"col-6 col-md-3\" style=\"padding:10px 6px;\"><div style=\"font-size:30px;font-weight:900;color:#31B3DE;\">7<\/div><div style=\"font-size:13px;color:#D1D8DB;\">forms with Progress Status<\/div><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- Processing cycle: big screenshot + 4 phase cards -->\n\n<section class=\"oe_container\" id=\"sw-cycle\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Barlow,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:56px 0 8px;\">\n    <div style=\"text-align:center;margin-bottom:22px;\">\n      <div style=\"font-size:12px;font-weight:800;letter-spacing:0.16em;text-transform:uppercase;color:#197E9F;margin-bottom:8px;\">The processing cycle<\/div>\n      <h2 style=\"font-size:36px;font-weight:900;color:#161B1D;margin:0 0 10px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#DFF3FA;padding-bottom:14px;\">Sixteen steps, clockwise, one click each<\/h2>\n      <p style=\"font-size:16px;color:#4B5D63;max-width:720px;margin:0 auto;line-height:1.6;\">The cycle screen puts the whole job on one wheel. Click any step and Odoo opens that list: pipeline, estimates, BOMs, MOs, receipts, deliveries, invoices or payments.<\/p>\n    <\/div>\n    <img src=\"../switchgear_manager_pro/static/description/01_processing_cycle.png\" alt=\"Processing cycle\" style=\"max-width:100%;border-radius:3px;border:1px solid #E5E9EB;display:block;margin:0 auto 24px;height:auto;\">\n    <div class=\"row\" style=\"margin-left:0;margin-right:0;\">\n      <div class=\"col-md-3\" style=\"padding:6px;\">\n        <div style=\"background-color:#FFFFFF;border:1px solid #E5E9EB;border-top:6px solid #2F96B8;border-radius:3px;padding:16px 16px 12px;min-height:232px;\">\n          <div style=\"font-size:13px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:#287F9C;margin-bottom:10px;\">Customer<\/div>\n          <div style=\"font-size:15px;color:#161B1D;line-height:1.9;\">1 \u00b7 Enquiry (CRM)<br>2 \u00b7 Estimation<br>3 \u00b7 Quotation<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"col-md-3\" style=\"padding:6px;\">\n        <div style=\"background-color:#FFFFFF;border:1px solid #E5E9EB;border-top:6px solid #3A859E;border-radius:3px;padding:16px 16px 12px;min-height:232px;\">\n          <div style=\"font-size:13px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:#377F97;margin-bottom:10px;\">Engineering<\/div>\n          <div style=\"font-size:15px;color:#161B1D;line-height:1.9;\">4 \u00b7 Design Documents<br>5 \u00b7 Bill of Material<br>6 \u00b7 Manuf. Order (MO)<br>7 \u00b7 Purchase Requisition<br>8 \u00b7 Quality Control<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"col-md-3\" style=\"padding:6px;\">\n        <div style=\"background-color:#FFFFFF;border:1px solid #E5E9EB;border-top:6px solid #4AA6C4;border-rad
