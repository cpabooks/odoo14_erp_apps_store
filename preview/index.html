rthand, gradients, flex,\n     box-shadow, overflow, border-left/right shorthand): use background-color, border-*-width/style/color and Bootstrap grid. -->\n\n\n<!-- Hero: white ticket card with petrol side panel -->\n\n<section class=\"oe_container\" id=\"cpa-section-1\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Outfit,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background-color:#F0F7FD;border:1px solid #B9D7EC;border-radius:18px;padding:0;border-top:6px solid #2874A6;\">\n    <div class=\"row\" style=\"margin-left:0;margin-right:0;\">\n      <div class=\"col-md-7\" style=\"padding:44px 36px 36px;\">\n        <div style=\"font-size:13px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:#134972;margin-bottom:14px;\">\n          CPA Books ERP \u00b7 Odoo 14 \u00b7 Free\n        <\/div>\n        <h1 style=\"font-size:38px;line-height:1.15;font-weight:800;color:#081E2E;margin:0 0 16px;overflow-wrap:break-word;\">Field Service Management<\/h1><p style=\"font-size:20px;font-weight:700;line-height:1.5;margin:0 0 18px;\">Every complaint,tracked to done.<\/p><p style=\"font-size:19px;line-height:1.55;color:#13344E;margin:0 0 12px;\">\n          Field Service Management turns project tasks into <b>Complaint Registration Numbers (CRNs)<\/b>.\n          Register the call, visit the site, quote, issue material, finish the job, invoice it and close it,\n          all on one guided form.\n        <\/p>\n        <p style=\"font-size:15px;line-height:1.6;color:#3F586B;margin:0 0 24px;\">\n          Built for facility management, MEP, HVAC and maintenance companies that run AMC and call-out service jobs.\n        <\/p>\n        <a href=\"#fs-route\" style=\"display:inline-block;background-color:#134972;color:#FFFFFF;padding:14px 26px;border-radius:18px;font-weight:700;font-size:15px;margin:4px 8px 4px 0;text-decoration:none;\">Follow the 9 stages<\/a>\n        <a href=\"mailto:info.cpabooks@gmail.com?subject=CPA%20Books%20ERP%20Field%20Service%20Management%20Management\" style=\"display:inline-block;background-color:#FFFFFF;color:#207AC0;padding:13px 25px;border-radius:18px;font-weight:700;font-size:15px;margin:4px 0;text-decoration:none;border:2px solid #81BDEB;\">Ask for a demo<\/a>\n      <\/div>\n      <div class=\"col-md-5\" style=\"background-color:#081E2E;border-radius:0 22px 22px 0;padding:40px 28px;text-align:center;color:#5987C5;\">\n        <img src=\"../field_service_hub/static/description/icon.png\" alt=\"Field Service Management\" style=\"width:170px;height:auto;display:block;margin:0 auto 22px;max-width:100%;\">\n        <div style=\"background-color:#FFFFFF;border-radius:18px;padding:16px 18px;text-align:left;max-width:300px;margin:0 auto;color:#4277BD;\">\n          <div style=\"font-family:'JetBrains Mono',Consolas,monospace;font-size:14px;font-weight:700;color:#134972;\">CRN/CO1/2026/00148<\/div>\n          <div style=\"font-size:16px;font-weight:700;color:#081E2E;margin:6px 0 4px;\">AC not cooling, Level 14<\/div>\n          <div style=\"font-size:13px;color:#5B7080;\">Al Noor Facilities \u00b7 AMC<\/div>\n          <div style=\"height:10px;background-color:#D0E6F7;border-radius:18px;margin-top:12px;color:#3966A3;\">\n            <div style=\"height:10px;width:56%;background-color:#1D70AF;border-radius:18px;color:#E9EFF7;\"><\/div>\n          <\/div>\n          <div style=\"font-size:12px;color:#5B7080;margin-top:6px;\">5. Work in Progress \u00b7 56%<\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- Banner in a coral frame -->\n\n<section class=\"oe_container\" id=\"cpa-section-2\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Outfit,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;border:3px solid #81BDEB;border-radius:18px;padding:10px;margin-top:24px;\">\n    <img src=\"../field_service_hub/static/description/banner.png\" alt=\"Field Service Management banner\" style=\"max-width:100%;border-radius:18px;display:block;margin:0 auto;height:auto;\">\n  <\/div>\n  <div class=\"row\" style=\"margin:16px 0 0;text-align:center;font-family:Outfit,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;\">\n    <div class=\"col-6 col-md-3\" style=\"padding:8px;\"><div style=\"background-color:#F0F7FD;border-radius:18px;padding:14px 6px;\"><div style=\"font-size:30px;font-weight:800;color:#134972;\">9<\/div><div style=\"font-size:13px;color:#3F586B;\">CRN stages<\/div><\/div><\/div>\n    <div class=\"col-6 col-md-3\" style=\"padding:8px;\"><div style=\"background-color:#F3F9FD;border-radius:18px;padding:14px 6px;\"><div style=\"font-size:30px;font-weight:800;color:#1E75B7;\">37<\/div><div style=\"font-size:13px;color:#196198;\">numbered form fields<\/div><\/div><\/div>\n    <div class=\"col-6 col-md-3\" style=\"padding:8px;\"><div style=\"background-color:#F0F7FD;border-radius:18px;padding:14px 6px;\"><div style=\"font-size:30px;font-weight:800;color:#134972;\">4<\/div><div style=\"font-size:13px;color:#3F586B;\">cost heads per CRN<\/div><\/div><\/div>\n    <div class=\"col-6 col-md-3\" style=\"padding:8px;\"><div style=\"background-color:#F3F9FD;border-radius:18px;padding:14px 6px;\"><div style=\"font-size:30px;font-weight:800;color:#1E75B7;\">2<\/div><div style=\"font-size:13px;color:#196198;\">report copies (internal / customer)<\/div><\/div><\/div>\n  <\/div>\n<\/section>\n\n\n<!-- The route: 9 stops as a vertical itinerary grouped in 4 phases -->\n\n<section class=\"oe_container\" id=\"fs-route\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Outfit,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:34px 6px 6px;\">\n    <div style=\"text-align:center;margin-bottom:24px;\">\n      <div style=\"font-size:13px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:#207AC0;\">The CRN route<\/div>\n      <h2 style=\"font-size:36px;font-weight:800;color:#081E2E;margin:6px 0 8px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#DFEEFA;padding-bottom:14px;\">Nine stops from the first call to approval<\/h2>\n      <p style=\"font-size:16px;color:#3F586B;margin:0 auto;max-width:720px;\">The stage moves on by itself as the site visit is logged, the quotation is sent and confirmed, the work dates are filled and the invoice is posted.<\/p>\n    <\/div>\n    <div class=\"row\" style=\"margin-left:0;margin-right:0;\">\n      <div class=\"col-md-3\" style=\"padding:8px;\">\n        <div style=\"font-size:13px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:#1F7BC1;margin:0 0 8px 4px;\">Registration<\/div>\n        <div style=\"border-left-width:5px;border-left-style:solid;border-left-color:#56A6E4;background-color:#F1F8FD;border-radius:12px;padding:12px 14px;margin-bottom:10px;\"><b style=\"color:#1E5B8A;\">1. Registered<\/b><div style=\"font-size:13px;color:#475A69;margin-top:3px;\">CRN number, customer, site, contact, complaint type and title.<\/div><\/div>\n        <div style=\"border-left-width:5px;border-left-style:solid;border-left-color:#56A6E4;background-color:#F1F8FD;border-radius:12px;padding:12px 14px;\"><b style=\"color:#1E5B8A;\">2. Site Visited<\/b><div style=\"font-size:13px;color:#475A69;margin-top:3px;\">Visited by, date, remarks and the next action.<\/div><\/div>\n      <\/div>\n      <div class=\"col-md-3\" style=\"padding:8px;\">\n        <div style=\"font-size:13px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:#227BC0;margin:0 0 8px 4px;\">Quotation<\/div>\n        <div style=\"border-left-width:5px;border-left-style:solid;border-left-color:#6FB3E7;background-color:#F5FAFD;border-radius:12px;padding:12px 14px;margin-bottom:10px;\"><b style=\"color:#1D6195;\">3. Quotation Issued<\/b><div style=\"font-size:13px;color:#475A69;margin-top:3px;\">Create the quotation from the CRN; customer and site are filled in.<\/div><\/div>\n        <div style=\"border-left-width:5px;border-left-style:solid;border-left-color:#6FB3E7;background-color:#F5FAFD;border-radius:12px;padding:12px 14px;\"><b style=\"color:#1D6195;\">4. QTN Approved<\/b><div style=\"font-size:13px;color:#475A69;margin-top:3px;\">Confirmed sales order moves the CRN on.<\/div><\/div>\n      <\/div>\n      <div class=\"col-md-3\" style=\"padding:8px;\">\n        <div style=\"font-size:13px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:#134972;margin:0 0 8px 4px;\">Execution<\/div>\n        <div style=\"border-left-width:5px;border-left-style:solid;border-left-color:#2A6B9D;background-color:#F0F7FD;border-radius:12px;padding:12px 14px;margin-bottom:10px;\"><b style=\"color:#13344E;\">5. Work in Progress<\/b><div style=\"font-size:13px;color:#475A69;margin-top:3px;\">Assigned engineer, assign date and end date; material and timesheets are booked.<\/div><\/div>\n        <div style=\"border-left-width:5px;border-left-style:solid;border-left-color:#2A6B9D;background-color:#F0F7FD;border-radius:12px;padding:12px 14px;\"><b style=\"color:#13344E;\">6. Waiting Invoice<\/b><div style=\"font-size:13px;color:#475A69;margin-top:3px;\">Job finished and ready for billing.<\/div><\/div>\n      <\/div>\n      <div class=\"col-md-3\" style=\"padding:8px;\">\n        <div style=\"font-size:13px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:#1A68A3;margin:0 0 8px 4px;\">Billing &amp; close<\/div>\n        <div style=\"border-left-width:5px;border-left-style:solid;border-left-color:#258CDB;background-color:#EEF6FC;border-radius:12px;padding:10px 14px;margin-bottom:8px;\"><b style=\"color:#134A74;\">7. Job Complete FOC<\/b><div style=\"font-size:13px;color:#475A69;margin-top:3px;\">Free-of-charge jobs close without an invoice.<\/div><\/div>\n        <div style=\"border-left-width:5px;border-left-style:solid;border-left-color:#258CDB;background-color:#EEF6FC;border-radius:12px;padding:10px 14px;margin-bottom:8px;\"><b style=\"color:#134A74;\">8. Job Invoiced<\/b><div style=\"font-size:13px;color:#475A69;margin-top:3px;\">Posted invoice is linked to the CRN.<\/div><\/div>\n        <div style=\"border-left-width:5px;border-left-style:solid;border-left-color:#1C6EAD;background-color:#EDF6FC;border-radius:12px;padding:10px 14px;\"><b style=\"color:#0E3757;\">9. Approved<\/b><div style=\"font-size:13px;color:#475A69;margin-top:3px;\">Approved By is set and the CRN is closed.<\/div><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- Dashboard + cycle: two framed screenshots on petrol -->\n\n<section class=\"oe_container\" id=\"cpa-section-4\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Outfit,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background-color:#081E2E;border-radius:18px;padding:34px 22px 22px;margin-top:26px;color:#5987C5;\">\n    <h2 style=\"font-size:32px;font-weight:800;color:#FFFFFF;margin:0 0 6px;text-align:center;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#DFEEFA;padding-bottom:14px;\">One service desk, opened in one click<\/h2>\n    <p style=\"font-size:16px;color:#99B4C9;text-align:center;margin:0 0 22px;\">The Complaint Registration app opens on the Complaint Registration Management dashboard, with a sidebar for CRNs, reporting, store and timesheets.<\/p>\n    <div class=\"row\" style=\"margin-left:0;margin-right:0;\">\n      <div class=\"col-md-6\" style=\"padding:8px;\">\n        <img src=\"../field_service_hub/static/description/01_dashboard.png\" alt=\"CRN service dashboard\" style=\"max-width:100%;border-radius:12px;border:2px solid #1D70AF;display:block;height:auto;\">\n        <p style=\"font-size:14px;color:#D0E6F7;margin:10px 4px 0;\"><b style=\"color:#62ADE6;\">Dashboard.<\/b> A count for every stage, plus panels for intake, quotation, execution, billing, store and timesheets. Click any number to open that list.<\/p>\n      <\/div>\n      <div class=\"col-md-6\" style=\"padding:8px;\">\n        <img src=\"../field_service_hub/static/description/02_processing_cycle.png\" alt=\"CRN processing cycle\" style=\"max-width:100%;border-radius:12px;border:2px solid #81BDEB;display:block;height:auto;\">\n        <p style=\"font-size:14px;color:#D0E6F7;margin:10px 4px 0;\"><b style=\"color:#AFD5F2;\">CRN Processing Cycle.<\/b> The nine stages on a clockwise ring, coloured by phase. Click a stage to open its CRNs.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- Guided form: screenshot left, three numbered notes right -->\n\n<section class=\"oe_container\" id=\"cpa-section-5\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Outfit,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:36px 6px 6px;\">\n    <div class=\"row align-items-center\" style=\"margin-left:0;margin-right:0;\">\n      <div class=\"col-md-8\" style=\"padding:8px;\">\n        <img src=\"../field_service_hub/static/description/03_crn_registration.png\" alt=\"CRN registration form\" style=\"max-width:100%;border-radius:18px;border:1px solid #CBD7E1;display:block;height:auto;\">\n      <\/div>\n      <div class=\"col-md-4\" style=\"padding:8px 8px 8px 18px;\">\n        <div style=\"font-size:13px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:#134972;\">Complaint Registration Form<\/div>\n        <h2 style=\"font-size:30px;font-weight:800;color:#081E2E;margin:6px 0 16px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#DFEEFA;padding-bottom:14px;\">A form that tells you what comes next<\/h2>\n        <div style=\"margin-bottom:14px;\"><span style=\"display:inline-block;width:30px;height:30px;line-height:30px;text-align:center;border-radius:50%;background-color:#134972;color:#FFFFFF;font-weight:700;margin-right:8px;\">1<\/span><b style=\"color:#081E2E;\">37 numbered fields<\/b><div style=\"font-size:14px;color:#475A69;margin:4px 0 0 40px;\">Grouped in dark stage boxes: Registration, Site Visit, Quotation, Work in Progress, Invoice and Approval / Close.<\/div><\/div>\n        <div style=\"margin-bottom:14px;\"><span style=\"display:inline-block;width:30px;height:30px;line-height:30px;text-align:center;border-radius:50%;background-color:#248BDA;color:#1F1F1F;font-weight:700;margin-right:8px;\">2<\/span><b style=\"color:#081E2E;\">A NEXT pointer<\/b><div style=\"font-size:14px;color:#475A69;margin:4px 0 0 40px;\">Points at the next field to fill. Finished stages become read-only.<\/div><\/div>\n        <div><span style=\"display:inline-block;width:30px;height:30px;line-height:30px;text-align:center;border-radius:50%;background-color:#134972;color:#FFFFFF;font-weight:700;margin-right:8px;\">3<\/span><b style=\"color:#081E2E;\">Workflow checklist<\/b><div style=\"font-size:14px;color:#475A69;margin:4px 0 0 40px;\">The side panel shows each stage as Done or Pending, with a progress bar and the list of pending items.<\/div><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- Site visit decision: three choice chips over the screenshot -->\n\n<section class=\"oe_container\" id=\"cpa-section-6\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Outfit,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background-color:#F3F9FD;border-radius:18px;padding:34px 22px 22px;margin-top:26px;\">\n    <div style=\"text-align:center;\">\n      <h2 style=\"font-size:32px;font-weight:800;color:#165585;margin:0 0 8px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#DFEEFA;padding-bottom:14px;\">After the site visit, pick the next action<\/h2>\n      <p style=\"font-size:16px;color:#196198;margin:0 0 18px;\">Field 24 decides where the CRN goes.<\/p>\n      <span style=\"display:inline-block;background-color:#FFFFFF;border:2px solid #81BDEB;border-radius:18px;padding:9px 18px;margin:4px;font-weight:700;color:#165585;\">1. Closed<\/span>\n      <span style=\"display:inline-block;background-color:#248BDA;border:2px solid #248BDA;border-radius:18px;padding:9px 18px;margin:4px;font-weight:700;color:#1F1F1F;\">2. Issue QT<\/span>\n      <span style=\"display:inline-block;background-color:#FFFFFF;border:2px solid #81BDEB;border-radius:18px;padding:9px 18px;margin:4px;font-weight:700;color:#165585;\">3. FOC<\/span>\n    <\/div>\n    <img src=\"../field_service_hub/static/description/04_site_visit_to_wip.png\" alt=\"Site visit to work in progress\" style=\"max-width:100%;border-radius:18px;display:block;margin:22px auto 0;border:1px solid #D3E8F8;height:auto;\">\n    <p style=\"font-size:15px;color:#165585;text-align:center;margin:14px 0 0;\">The Quotation, Invoice and DO buttons on top of the form open the documents linked to the CRN.<\/p>\n  <\/div>\n<\/section>\n\n\n<!-- Job cost: formula strip + screenshot -->\n\n<section class=\"oe_container\" id=\"cpa-section-7\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Outfit,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:36px 6px 6px;\">\n    <div style=\"text-align:center;margin-bottom:18px;\">\n      <div style=\"font-size:13px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:#134972;\">Job costing<\/div>\n      <h2 style=\"font-size:32px;font-weight:800;color:#081E2E;margin:6px 0 16px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#DFEEFA;padding-bottom:14px;\">Know what each CRN really cost<\/h2>\n      <span style=\"display:inline-block;background-color:#F0F7FD;border:1px solid #A0CDEF;border-radius:12px;padding:10px 16px;margin:4px;font-weight:700;color:#134972;\">Material<\/span>\n      <span style=\"display:inline-block;font-size:22px;font-weight:800;color:#207AC0;margin:0 4px;\">+<\/span>\n      <span style=\"display:inline-block;background-color:#F0F7FD;border:1px solid #A0CDEF;border-radius:12px;padding:10px 16px;margin:4px;font-weight:700;color:#134972;\">Timesheet (In / Out \u00d7 rate)<\/span>\n      <span style=\"display:inline-block;font-size:22px;font-weight:800;color:#207AC0;margin:0 4px;\">+<\/span>\n      <span style=\"display:inline-block;background-color:#F0F7FD;border:1px solid #A0CDEF;border-radius:12px;padding:10px 16px;margin:4px;font-weight:700;color:#134972;\">Transport<\/span>\n      <span style=\"display:inline-block;font-size:22px;font-weight:800;color:#207AC0;margin:0 4px;\">+<\/span>\n      <span style=\"display:inline-block;background-color:#F0F7FD;border:1px solid #A0CDEF;border-radius:12px;padding:10px 16px;margin:4px;font-weight:700;color:#134972;\">Other<\/span>\n      <span style=\"display:inline-block;font-size:22px;font-weight:800;color:#207AC0;margin:0 4px;\">=<\/span>\n      <span style=\"display:inline-block;background-color:#081E2E;border-radius:12px;padding:10px 16px;margin:4px;font-weight:700;color:#62ADE6;\">Total Actual + Estimated Cost<\/span>\n    <\/div>\n    <img src=\"../field_service_hub/static/description/05_tmc_internal_costs.png\" alt=\"TMC Internal tab with cost summary\" style=\"max-width:100%;border-radius:18px;border:1px solid #CBD7E1;display:block;margin:0 auto;height:auto;\">\n    <div class=\"row\" style=\"margin:14px 0 0;\">\n      <div class=\"col-md-6\" style=\"padding:8px;\"><div style=\"border:1px solid #E2EAF0;border-radius:18px;padding:14px 16px;\"><b style=\"color:#081E2E;\">TMC Internal<\/b><div style=\"font-size:14px;color:#475A69;margin-top:4px;\">Timesheet lines with In / Out times and cost, plus the material request lines with issued quantity and value.<\/div><\/div><\/div>\n      <div class=\"col-md-6\" style=\"padding:8px;\"><div style=\"border:1px solid #E2EAF0;border-radius:18px;padding:14px 16px;\"><b style=\"color:#081E2E;\">TMC Customer<\/b><div style=\"font-size:14px;color:#475A69;margin-top:4px;\">An editable customer copy of the materials and labour, reloaded from TMC Internal in one click.<\/div><\/div><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- Store: dark petrol split with MIN / MRN tiles -->\n\n<section class=\"oe_container\" id=\"cpa-section-8\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Outfit,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background-color:#0B2940;border-radius:18px;padding:30px 22px;margin-top:26px;color:#658FC9;\">\n    <div class=\"row align-items-center\" style=\"margin-left:0;margin-right:0;\">\n      <div class=\"col-md-5\" style=\"padding:8px 14px;\">\n        <div style=\"font-size:13px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:#AFD5F2;\">Store<\/div>\n        <h2 style=\"font-size:30px;font-weight:800;color:#FFFFFF;margin:6px 0 14px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#DFEEFA;padding-bottom:14px;\">Material issued and returned against the CRN<\/h2>\n        <div style=\"background-color:#081E2E;border:1px solid #1D70AF;border-radius:18px;padding:12px 14px;margin-bottom:10px;\"><b style=\"color:#62ADE6;\">Material Issue Note (MIN)<\/b><div style=\"font-size:14px;color:#D0E6F7;margin-top:3px;\">Pick the CRN and the pending material request lines become the stock moves.<\/div><\/div>\n        <div style=\"background-color:#081E2E;border:1px solid #81BDEB;border-radius:18px;padding:12px 14px;margin-bottom:10px;\"><b style=\"color:#AFD5F2;\">Material Return Note (MRN)<\/b><div style=\"font-size:14px;color:#E8F3FB;margin-top:3px;\">Pick a done MIN; only the quantity not yet returned is loaded, with the locations reversed.<\/div><\/div>\n        <div style=\"font-size:14px;color:#99B4C9;\">Store lists: Material Request Pending, Material Issued, DO Pending and DO Issued, also under Inventory \u203a CRN.<\/div>\n      <\/div>\n      <div class=\"col-md-7\" style=\"padding:8px;\">\n        <img src=\"../field_service_hub/static/description/06_store_material_requests.png\" alt=\"Material request pending list\" style=\"max-width:100%;border-radius:12px;display:block;height:auto;\">\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- Report: paper-like section -->\n\n<section class=\"oe_container\" id=\"cpa-section-9\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Outfit,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:36px 6px 6px;\">\n    <div class=\"row align-items-center\" style=\"margin-left:0;margin-right:0;\">\n      <div class=\"col-md-5\" style=\"padding:8px 14px;\">\n        <div style=\"font-size:13px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:#207AC0;\">Print<\/div>\n        <h2 style=\"font-size:30px;font-weight:800;color:#081E2E;margin:6px 0 14px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#DFEEFA;padding-bottom:14px;\">Job Completion Report, in two copies<\/h2>\n        <table style=\"width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed;overflow-wrap:break-word;\">\n          <tr><td style=\"padding:10px;border:1px solid #E2EAF0;background-color:#F0F7FD;font-weight:700;color:#134972;width:38%;\">TMC Internal<\/td><td style=\"padding:10px;border:1px solid #E2EAF0;color:#475A69;\">Your own record of parts and engineer hours.<\/td><\/tr>\n          <tr><td style=\"padding:10px;border:1px solid #E2EAF0;background-color:#F3F9FD;font-weight:700;color:#1D72B3;\">TMC Customer<\/td><td style=\"padding:10px;border:1px solid #E2EAF0;color:#475A69;\">The copy the customer signs at handover.<\/td><\/tr>\n        <\/table>\n        <p style=\"font-size:14px;color:#475A69;margin:14px 0 0;line-height:1.6;\">Customer details, complaint and job details, parts used with serial numbers, the time sheet, and a handover block with signatures for the customer and your company. The number of table rows is set per CRN.<\/p>\n      <\/div>\n      <div class=\"col-md-7\" style=\"padding:8px;\">\n        <img src=\"../field_service_hub/static/description/07_job_completion_report.png\" alt=\"Job completion report\" style=\"max-width:100%;border-radius:12px;border:1px solid #CBD7E1;display:block;height:auto;\">\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- Charts dashboard: cream band -->\n\n<section class=\"oe_container\" id=\"cpa-section-10\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Outfit,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background-color:#EBF2F8;border-radius:18px;padding:30px 22px;margin-top:26px;\">\n    <h2 style=\"font-size:30px;font-weight:800;color:#243847;margin:0 0 6px;text-align:center;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#DFEEFA;padding-bottom:14px;\">Service Monitoring Dashboard<\/h2>\n    <p style=\"font-size:16px;color:#5C6D7A;text-align:center;margin:0 0 18px;\">Stage pipeline, complaint mix, created vs closed trend, engineer cost load and the oldest open CRNs, filtered by period and company.<\/p>\n    <img src=\"../field_service_hub/static/description/08_service_charts.png\" alt=\"Service monitoring dashboard\" style=\"max-width:100%;border-radius:18px;display:block;margin:0 auto;height:auto;\">\n  <\/div>\n<\/section>\n\n\n<!-- CRN list with colour key -->\n\n<section class=\"oe_container\" id=\"cpa-section-11\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Outfit,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:36px 6px 6px;\">\n    <h2 style=\"font-size:30px;font-weight:800;color:#081E2E;margin:0 0 6px;text-align:center;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#DFEEFA;padding-bottom:14px;\">A CRN list you can read by colour<\/h2>\n    <p style=\"font-size:16px;color:#3F586B;text-align:center;margin:0 0 18px;\">Progress %, age in days, material and timesheet cost on every row.<\/p>\n    <img src=\"../field_service_hub/static/description/09_crn_list.png\" alt=\"CRN list\" style=\"max-width:100%;border-radius:18px;border:1px solid #CBD7E1;display:block;margin:0 auto;height:auto;\">\n    <div style=\"text-align:center;margin-top:14px;font-size:14px;\">\n      <span style=\"display:inline-block;margin:4px 10px;color:#217ABD;font-weight:700;\">Red: older than 7 days, still registered or quotation issued<\/span>\n      <span style=\"display:inline-block;margin:4px 10px;color:#1B6BA8;font-weight:700;\">Amber: urgent or waiting for invoice<\/span>\n      <span style=\"display:inline-block;margin:4px 10px;color:#1F79BD;font-weight:700;\">Blue: site visited or in progress<\/span>\n      <span style=\"display:inline-block;margin:4px 10px;color:#195787;font-weight:700;\">Green: completed or approved<\/span>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- Requirements + good to know -->\n\n<section class=\"oe_container\" id=\"cpa-section-12\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Outfit,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:36px 6px 6px;\">\n    <div class=\"row\" style=\"margin-left:0;margin-right:0;\">\n      <div class=\"col-md-6\" style=\"padding:8px;\">\n        <h3 style=\"font-size:24px;font-weight:800;color:#081E2E;margin:0 0 12px;\">Requirements<\/h3>\n        <table style=\"width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed;overflow-wrap:break-word;\">\n          <tr><td style=\"padding:9px 10px;border:1px solid #E2EAF0;background-color:#F8FAFC;font-weight:700;width:40%;\">Odoo<\/td><td style=\"padding:9px 10px;border:1px solid #E2EAF0;\">14.0 Community and Enterprise<\/td><\/tr>\n          <tr><td style=\"padding:9px 10px;border:1px solid #E2EAF0;background-color:#F8FAFC;font-weight:700;\">Required apps<\/td><td style=\"padding:9px 10px;border:1px solid #E2EAF0;\">Project, Timesheets, Sales Timesheet, Sales Stock, Inventory, Purchase<\/td><\/tr>\n          <tr><td style=\"padding:9px 10px;border:1px solid #E2EAF0;background-color:#F8FAFC;font-weight:700;\">Other modules<\/td><td style=\"padding:9px 10px;border:1px solid #E2EAF0;\">None. No third-party apps needed.<\/td><\/tr>\n        <\/table>\n      <\/div>\n      <div class=\"col-md-6\" style=\"padding:8px;\">\n        <h3 style=\"font-size:24px;font-weight:800;color:#081E2E;margin:0 0 12px;\">Good to know<\/h3>\n        <div style=\"border-left-width:5px;border-left-style:solid;border-left-color:#81BDEB;background-color:#F3F9FD;border-radius:12px;padding:14px 16px;font-size:14px;color:#0B2C46;line-height:1.6;\">\n          <div style=\"margin-bottom:8px;\">\u2022 On install, all existing projects are marked for complaint registration (with quotations and timesheets allowed), so they can hold CRNs.<\/div>\n          <div style=\"margin-bottom:8px;\">\u2022 The Complaint Registration app opens on the CRN dashboard and uses its own sidebar menu.<\/div>\n          <div style=\"margin-bottom:8px;\">\u2022 CRN numbers follow <span style=\"font-family:'JetBrains Mono',Consolas,monospace;\">CRN/CO&lt;company&gt;/&lt;year&gt;/00001<\/span> and restart every year.<\/div>\n          <div>\u2022 Admins can load sample CRNs from <b>Settings \u203a FSM Test Data<\/b> and remove them again.<\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- FAQ -->\n\n<section class=\"oe_container\" id=\"cpa-section-13\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Outfit,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:30px 6px 6px;\">\n    <h3 style=\"font-size:24px;font-weight:800;color:#081E2E;margin:0 0 12px;text-align:center;\">FAQ<\/h3>\n    <div class=\"row\" style=\"margin-left:0;margin-right:0;\">\n      <div class=\"col-md-6\" style=\"padding:8px;\"><div style=\"border:1px solid #D0E6F7;border-radius:18px;padding:14px 16px;\"><b style=\"color:#134972;\">Does it work on Odoo Community?<\/b><div style=\"font-size:14px;color:#475A69;margin-top:4px;\">Yes. It runs on Odoo 14 Community and on Enterprise. No Enterprise app is required.<\/div><\/div><\/div>\n      <div class=\"col-md-6\" style=\"padding:8px;\"><div style=\"border:1px solid #D0E6F7;border-radius:18px;padding:14px 16px;\"><b style=\"color:#134972;\">Can a CRN be closed without a quotation?<\/b><div style=\"font-size:14px;color:#475A69;margin-top:4px;\">Yes. Choose \"1. Closed\" or \"3. FOC\" as the next action after the site visit.<\/div><\/div><\/div>\n      <div class=\"col-md-6\" style=\"padding:8px;\"><div style=\"border:1px solid #D0E6F7;border-radius:18px;padding:14px 16px;\"><b style=\"color:#134972;\">Where do material costs come from?<\/b><div style=\"font-size:14px;color:#475A69;margin-top:4px;\">From the CRN's material request lines: the quantity issued on done Material Issue Notes \u00d7 the product cost.<\/div><\/div><\/div>\n      <div class=\"col-md-6\" style=\"padding:8px;\"><div style=\"border:1px solid #D0E6F7;border-radius:18px;padding:14px 16px;\"><b style=\"color:#134972;\">Can I still create normal project tasks?<\/b><div style=\"font-size:14px;color:#475A69;margin-top:4px;\">Yes. Normal tasks stay as they are; a \"Create CRN\" button on a task or activity opens a new CRN from it.<\/div><\/div><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- Upgrade to any Odoo version: version stops on a dashed route, coral frame -->\n\n<section class=\"oe_container\" id=\"cpa-section-14\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Outfit,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;border:3px solid #81BDEB;border-radius:18px;padding:32px 26px;margin:28px 0 0;background-color:#FFFFFF;\">\n    <div class=\"row\" style=\"margin-left:0;margin-right:0;\">\n      <div class=\"col-md-5\" style=\"padding:6px 10px;\">\n        <div style=\"font-size:13px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:#207AC0;margin-bottom:8px;\">Your Odoo, your version<\/div>\n        <h2 style=\"font-size:30px;font-weight:800;color:#081E2E;margin:0 0 10px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#DFEEFA;padding-bottom:14px;\">Upgradeable to any Odoo version<\/h2>\n        <p style=\"font-size:15px;line-height:1.6;color:#3F586B;margin:0;\">Available for Odoo 14 right now. On a newer Odoo? We move Field Service Management to your version. Contact us on WhatsApp or email.<\/p>\n      <\/div>\n      <div class=\"col-md-7\" style=\"padding:6px 10px;\">\n        <div style=\"border-top-width:2px;border-top-style:dashed;border-top-color:#A0CDEF;margin:30px 0 0;\"><\/div>\n        <div class=\"row\" style=\"margin:-20px 0 0;text-align:center;\">\n          <div class=\"col-2\" style=\"padding:2px;\"><div style=\"width:38px;height:38px;line-height:38px;border-radius:50%;background-color:#134972;color:#FFFFFF;font-weight:800;font-size:14px;margin:0 auto;\">14<\/div><div style=\"font-size:11px;color:#134972;font-weight:700;margin-top:6px;\">now<\/div><\/div>\n          <div class=\"col-2\" style=\"padding:2px;\"><div style=\"width:38px;height:38px;line-height:34px;border-radius:50%;background-color:#FFFFFF;border:2px solid #1D70AF;color:#081E2E;font-weight:800;font-size:14px;margin:0 auto;\">15<\/div><div style=\"font-size:11px;color:#5B7080;margin-top:6px;\">request<\/div><\/div>\n          <div class=\"col-2\" style=\"padding:2px;\"><div style=\"width:38px;height:38px;line-height:34px;border-radius:50%;background-color:#FFFFFF;border:2px solid #1D70AF;color:#081E2E;font-weight:800;font-size:14px;margin:0 auto;\">16<\/div><div style=\"font-size:11px;color:#5B7080;margin-top:6px;\">request<\/div><\/div>\n          <div class=\"col-2\" style=\"padding:2px;\"><div style=\"width:38px;height:38px;line-height:34px;border-radius:50%;background-color:#FFFFFF;border:2px solid #1D70AF;color:#081E2E;font-weight:800;font-size:14px;margin:0 auto;\">17<\/div><div style=\"font-size:11px;color:#5B7080;margin-top:6px;\">request<\/div><\/div>\n          <div class=\"col-2\" style=\"padding:2px;\"><div style=\"width:38px;height:38px;line-height:34px;border-radius:50%;background-color:#FFFFFF;border:2px solid #1D70AF;color:#081E2E;font-weight:800;font-size:14px;margin:0 auto;\">18<\/div><div style=\"font-size:11px;color:#5B7080;margin-top:6px;\">request<\/div><\/div>\n          <div class=\"col-2\" style=\"padding:2px;\"><div style=\"width:38px;height:38px;line-height:34px;border-radius:50%;background-color:#FFFFFF;border:2px solid #81BDEB;color:#207AC0;font-weight:800;font-size:14px;margin:0 auto;\">19<\/div><div style=\"font-size:11px;color:#5B7080;margin-top:6px;\">request<\/div><\/div>\n        <\/div>\n        <div style=\"text-align:center;ma pacing:0.14em;text-transform:uppercase;color:#D42240;margin-bottom:8px;\">The wizard<\/div>\n      <h2 style=\"font-size:32px;font-weight:900;color:#8A1E30;margin:0 0 10px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#FADFE4;padding-bottom:14px;\">Always know where a job is, and what comes next<\/h2>\n      <p style=\"font-size:16px;color:#69474D;max-width:680px;margin:0 auto;line-height:1.7;\">The progress rail shows every step. Save and close at any time, then press <b>Continue FAFF Process<\/b> on the job to pick up exactly where you left off.<\/p>\n    <\/div>\n    <img src=\"../fire_alarm_manager/static/description/03_one_job_wizard.png\" alt=\"One job, one wizard\" style=\"max-width:100%;border-radius:6px;border:1px solid #F6C7CF;display:block;margin:0 auto 24px;height:auto;\">\n    <div class=\"row\">\n      <div class=\"col-md-4\" style=\"margin-bottom:14px;\">\n        <div class=\"h-100\" style=\"background-color:#FFFFFF;border-radius:6px;padding:18px 20px;\">\n          <div style=\"font-size:28px;font-weight:900;color:#DE2D4C;line-height:1;\">01<\/div>\n          <div style=\"font-size:16px;font-weight:800;color:#8A1E30;margin:8px 0 4px;\">Start from anywhere<\/div>\n          <div style=\"font-size:14px;color:#8B646A;line-height:1.6;\">New FAFF Job menu, or Start FAFF Process on a CRM opportunity.<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"col-md-4\" style=\"margin-bottom:14px;\">\n        <div class=\"h-100\" style=\"background-color:#FFFFFF;border-radius:6px;padding:18px 20px;\">\n          <div style=\"font-size:28px;font-weight:900;color:#DD304E;line-height:1;\">02<\/div>\n          <div style=\"font-size:16px;font-weight:800;color:#8A1E30;margin:8px 0 4px;\">Previous, Save, Next<\/div>\n          <div style=\"font-size:14px;color:#8B646A;line-height:1.6;\">Each step has the buttons it needs, like Create Quotation or Issue from Store.<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"col-md-4\" style=\"margin-bottom:14px;\">\n        <div class=\"h-100\" style=\"background-color:#FFFFFF;border-radius:6px;padding:18px 20px;\">\n          <div style=\"font-size:28px;font-weight:900;color:#DD2E4B;line-height:1;\">03<\/div>\n          <div style=\"font-size:16px;font-weight:800;color:#8A1E30;margin:8px 0 4px;\">Full history<\/div>\n          <div style=\"font-size:14px;color:#8B646A;line-height:1.6;\">Every stage change is logged with who changed it and when.<\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- Gallery: dashboard + process flow side by side -->\n\n<section class=\"oe_container\" id=\"cpa-section-5\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:56px 0 10px;\">\n    <h2 style=\"font-size:30px;font-weight:900;color:#8A1E30;margin:0 0 22px;text-align:center;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#FADFE4;padding-bottom:14px;\">Your whole fire safety operation on two screens<\/h2>\n    <div class=\"row\">\n      <div class=\"col-md-6\" style=\"margin-bottom:22px;\">\n        <img src=\"../fire_alarm_manager/static/description/01_operations_dashboard.png\" alt=\"Operations Dashboard\" style=\"max-width:100%;border-radius:6px;border:1px solid #FADFE4;display:block;height:auto;\">\n        <div style=\"border-top-width:4px;border-top-style:solid;border-top-color:#DE324F;margin-top:14px;padding-top:12px;\">\n          <div style=\"font-size:17px;font-weight:800;color:#2A0F13;\">Operations Dashboard<\/div>\n          <div style=\"font-size:14px;color:#8B646A;line-height:1.6;\">9 live cards (open jobs, inspections, estimations, quotations, testing, unpaid invoices, handovers\u2026) and 6 workflow sections. Click a card to open the list.<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"col-md-6\" style=\"margin-bottom:22px;\">\n        <img src=\"../fire_alarm_manager/static/description/02_process_flow.png\" alt=\"Process Flow\" style=\"max-width:100%;border-radius:6px;border:1px solid #FADFE4;display:block;height:auto;\">\n        <div style=\"border-top-width:4px;border-top-style:solid;border-top-color:#F0A0AE;margin-top:14px;padding-top:12px;\">\n          <div style=\"font-size:17px;font-weight:800;color:#2A0F13;\">Process Flow<\/div>\n          <div style=\"font-size:14px;color:#8B646A;line-height:1.6;\">All 13 steps as clickable cards, each showing which Odoo app it uses. New staff learn the process in minutes.<\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- Job form: image left, smart button cloud right -->\n\n<section class=\"oe_container\" id=\"cpa-section-6\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:20px 0 10px;\">\n    <div class=\"row align-items-center\">\n      <div class=\"col-lg-7\" style=\"margin-bottom:24px;\">\n        <img src=\"../fire_alarm_manager/static/description/04_faff_job.png\" alt=\"FAFF job form\" style=\"max-width:100%;border-radius:6px;border:1px solid #FADFE4;display:block;height:auto;\">\n      <\/div>\n      <div class=\"col-lg-5\" style=\"margin-bottom:24px;\">\n        <div style=\"font-size:12px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:#DD2E4B;margin-bottom:8px;\">The FAFF job<\/div>\n        <h2 style=\"font-size:28px;font-weight:900;color:#8A1E30;margin:0 0 12px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#FADFE4;padding-bottom:14px;\">One record that links everything<\/h2>\n        <p style=\"font-size:15px;color:#69474D;line-height:1.7;margin:0 0 16px;\">Numbered <b>FAFF/00012<\/b>, with a 13-stage status bar, a progress % that follows the task progress during execution, and payment status worked out from the invoices.<\/p>\n        <div>\n          <span style=\"display:inline-block;border:1px solid #F6C7CF;color:#D32240;padding:6px 12px;border-radius:6px;font-size:13px;font-weight:700;margin:3px;\">CRM<\/span>\n          <span style=\"display:inline-block;border:1px solid #F6C7CF;color:#D32240;padding:6px 12px;border-radius:6px;font-size:13px;font-weight:700;margin:3px;\">Inspection<\/span>\n          <span style=\"display:inline-block;border:1px solid #F6C7CF;color:#D32240;padding:6px 12px;border-radius:6px;font-size:13px;font-weight:700;margin:3px;\">Estimation<\/span>\n          <span style=\"display:inline-block;border:1px solid #F6C7CF;color:#D32240;padding:6px 12px;border-radius:6px;font-size:13px;font-weight:700;margin:3px;\">Quotation<\/span>\n          <span style=\"display:inline-block;border:1px solid #F6C7CF;color:#D32240;padding:6px 12px;border-radius:6px;font-size:13px;font-weight:700;margin:3px;\">Project<\/span>\n          <span style=\"display:inline-block;border:1px solid #F6C7CF;color:#D32240;padding:6px 12px;border-radius:6px;font-size:13px;font-weight:700;margin:3px;\">Tasks<\/span>\n          <span style=\"display:inline-block;border:1px solid #F6C7CF;color:#D32240;padding:6px 12px;border-radius:6px;font-size:13px;font-weight:700;margin:3px;\">Purchase<\/span>\n          <span style=\"display:inline-block;border:1px solid #F6C7CF;color:#D32240;padding:6px 12px;border-radius:6px;font-size:13px;font-weight:700;margin:3px;\">Material Issues<\/span>\n          <span style=\"display:inline-block;border:1px solid #F6C7CF;color:#D32240;padding:6px 12px;border-radius:6px;font-size:13px;font-weight:700;margin:3px;\">Delivery<\/span>\n          <span style=\"display:inline-block;border:1px solid #F6C7CF;color:#D32240;padding:6px 12px;border-radius:6px;font-size:13px;font-weight:700;margin:3px;\">Invoice<\/span>\n          <span style=\"display:inline-block;border:1px solid #F6C7CF;color:#D32240;padding:6px 12px;border-radius:6px;font-size:13px;font-weight:700;margin:3px;\">Payment<\/span>\n          <span style=\"display:inline-block;border:1px solid #F6C7CF;color:#D32240;padding:6px 12px;border-radius:6px;font-size:13px;font-weight:700;margin:3px;\">Attachments<\/span>\n        <\/div>\n        <div style=\"font-size:13px;color:#8B646A;margin-top:10px;\">12 smart buttons, plus a kanban board grouped by stage.<\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- BOQ: real table + pricing formula -->\n\n<section class=\"oe_container\" id=\"cpa-section-7\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background-color:#FFFFFF;border:1px solid #FADFE4;border-radius:6px;padding:40px 30px 30px;margin-top:30px;\">\n    <div class=\"row\">\n      <div class=\"col-lg-4\" style=\"margin-bottom:22px;\">\n        <div style=\"font-size:12px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:#DD2E4B;margin-bottom:8px;\">Estimation &amp; BOQ<\/div>\n        <h2 style=\"font-size:28px;font-weight:900;color:#8A1E30;margin:0 0 12px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#FADFE4;padding-bottom:14px;\">Price the job before you quote it<\/h2>\n        <p style=\"font-size:15px;color:#69474D;line-height:1.7;margin:0 0 16px;\">Each BOQ line holds material, labour, equipment, subcontract and other cost. Pick a product and its cost fills in. Set the margin and the selling price follows.<\/p>\n        <div style=\"background-color:#8A1E30;border-radius:6px;padding:16px 18px;color:#FFFFFF;\">\n          <div style=\"font-size:12px;font-weight:800;letter-spacing:0.1em;color:#F1A4B2;\">PRICING RULE<\/div>\n          <div style=\"font-size:16px;font-weight:800;margin-top:6px;\">Selling = Unit cost \u00d7 (1 + Margin %)<\/div>\n          <div style=\"font-size:13px;color:#F6C7CF;margin-top:6px;\">Default margin 30%. Approved BOQ lines become the quotation.<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"col-lg-8\">\n        <table style=\"width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed;overflow-wrap:break-word;\">\n          <tr>\n            <td style=\"padding:10px 12px;border-bottom:2px solid #F6C7CF;color:#8B646A;font-weight:800;font-size:12px;text-transform:uppercase;\">BOQ line<\/td>\n            <td style=\"padding:10px 12px;border-bottom:2px solid #F6C7CF;color:#8B646A;font-weight:800;font-size:12px;text-transform:uppercase;text-align:right;\">Qty<\/td>\n            <td style=\"padding:10px 12px;border-bottom:2px solid #F6C7CF;color:#8B646A;font-weight:800;font-size:12px;text-transform:uppercase;text-align:right;\">Total cost<\/td>\n            <td style=\"padding:10px 12px;border-bottom:2px solid #F6C7CF;color:#8B646A;font-weight:800;font-size:12px;text-transform:uppercase;text-align:right;\">Total selling<\/td>\n          <\/tr>\n          <tr><td style=\"padding:10px 12px;border-bottom:1px solid #F7EEEF;font-weight:700;color:#2A0F13;\">Fire Alarm Panel<\/td><td style=\"padding:10px 12px;border-bottom:1px solid #F7EEEF;text-align:right;\">1<\/td><td style=\"padding:10px 12px;border-bottom:1px solid #F7EEEF;text-align:right;\">2,500.00<\/td><td style=\"padding:10px 12px;border-bottom:1px solid #F7EEEF;text-align:right;font-weight:700;\">4,000.00<\/td><\/tr>\n          <tr><td style=\"padding:10px 12px;border-bottom:1px solid #F7EEEF;font-weight:700;color:#2A0F13;\">Smoke Detectors<\/td><td style=\"padding:10px 12px;border-bottom:1px solid #F7EEEF;text-align:right;\">40<\/td><td style=\"padding:10px 12px;border-bottom:1px solid #F7EEEF;text-align:right;\">2,000.00<\/td><td style=\"padding:10px 12px;border-bottom:1px solid #F7EEEF;text-align:right;font-weight:700;\">3,200.00<\/td><\/tr>\n          <tr><td style=\"padding:10px 12px;border-bottom:1px solid #F7EEEF;font-weight:700;color:#2A0F13;\">Cabling &amp; Accessories<\/td><td style=\"padding:10px 12px;border-bottom:1px solid #F7EEEF;text-align:right;\">1<\/td><td style=\"padding:10px 12px;border-bottom:1px solid #F7EEEF;text-align:right;\">1,500.00<\/td><td style=\"padding:10px 12px;border-bottom:1px solid #F7EEEF;text-align:right;font-weight:700;\">2,300.00<\/td><\/tr>\n          <tr><td style=\"padding:10px 12px;border-bottom:1px solid #F7EEEF;font-weight:700;color:#2A0F13;\">Labour Installation<\/td><td style=\"padding:10px 12px;border-bottom:1px solid #F7EEEF;text-align:right;\">1<\/td><td style=\"padding:10px 12px;border-bottom:1px solid #F7EEEF;text-align:right;\">2,000.00<\/td><td style=\"padding:10px 12px;border-bottom:1px solid #F7EEEF;text-align:right;font-weight:700;\">2,800.00<\/td><\/tr>\n          <tr><td style=\"padding:10px 12px;border-bottom:1px solid #F7EEEF;font-weight:700;color:#2A0F13;\">Programming &amp; Testing<\/td><td style=\"padding:10px 12px;border-bottom:1px solid #F7EEEF;text-align:right;\">1<\/td><td style=\"padding:10px 12px;border-bottom:1px solid #F7EEEF;text-align:right;\">500.00<\/td><td style=\"padding:10px 12px;border-bottom:1px solid #F7EEEF;text-align:right;font-weight:700;\">700.00<\/td><\/tr>\n          <tr><td style=\"padding:12px;background-color:#FDF1F3;font-weight:900;color:#8A1E30;\">Total<\/td><td style=\"padding:12px;background-color:#FDF1F3;\"><\/td><td style=\"padding:12px;background-color:#FDF1F3;text-align:right;font-weight:900;color:#8A1E30;\">8,500.00<\/td><td style=\"padding:12px;background-color:#FDF1F3;text-align:right;font-weight:900;color:#8A1E30;\">13,000.00<\/td><\/tr>\n        <\/table>\n        <div class=\"row\" style=\"margin-top:14px;\">\n          <div class=\"col-6\"><div style=\"background-color:#FCF8F9;border-radius:6px;padding:12px 14px;\"><div style=\"font-size:12px;color:#8B646A;font-weight:700;\">Expected profit<\/div><div style=\"font-size:22px;font-weight:900;color:#D32240;\">4,500.00<\/div><\/div><\/div>\n          <div class=\"col-6\"><div style=\"background-color:#FCF8F9;border-radius:6px;padding:12px 14px;\"><div style=\"font-size:12px;color:#8B646A;font-weight:700;\">Margin %<\/div><div style=\"font-size:22px;font-weight:900;color:#D32240;\">34.6%<\/div><\/div><\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- Materials: three-step strip, then image -->\n\n<section class=\"oe_container\" id=\"cpa-section-8\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:56px 0 10px;\">\n    <div style=\"text-align:center;margin-bottom:22px;\">\n      <div style=\"font-size:12px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:#DD2E4B;margin-bottom:8px;\">Material arrangement<\/div>\n      <h2 style=\"font-size:30px;font-weight:900;color:#8A1E30;margin:0;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#FADFE4;padding-bottom:14px;\">Use what is in the store, buy only the rest<\/h2>\n    <\/div>\n    <div class=\"row\" style=\"margin-bottom:22px;\">\n      <div class=\"col-md-4\" style=\"margin-bottom:10px;\">\n        <div class=\"h-100\" style=\"background-color:#FDF1F3;border-radius:6px;padding:18px 20px;\">\n          <div style=\"font-size:13px;font-weight:900;color:#D42240;\">A \u00b7 Suggest Split<\/div>\n          <div style=\"font-size:14px;color:#69474D;line-height:1.6;margin-top:6px;\">Issue = what is available, up to the required qty. The rest becomes purchase qty.<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"col-md-4\" style=\"margin-bottom:10px;\">\n        <div class=\"h-100\" style=\"background-color:#FADFE4;border-radius:6px;padding:18px 20px;\">\n          <div style=\"font-size:13px;font-weight:900;color:#C6203C;\">B \u00b7 Issue from Store<\/div>\n          <div style=\"font-size:14px;color:#69474D;line-height:1.6;margin-top:6px;\">Creates a stock transfer for the job and records the issued cost.<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"col-md-4\" style=\"margin-bottom:10px;\">\n        <div class=\"h-100\" style=\"background-color:#D32240;border-radius:6px;padding:18px 20px;color:#EDF2F9;\">\n          <div style=\"font-size:13px;font-weight:900;color:#FFFFFF;\">C \u00b7 Create Purchase RFQ<\/div>\n          <div style=\"font-size:14px;color:#FCECEF;line-height:1.6;margin-top:6px;\">Purchase request for the missing quantity, linked to the job.<\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n    <img src=\"../fire_alarm_manager/static/description/05_material_arrangement.png\" alt=\"Material arrangement\" style=\"max-width:100%;border-radius:6px;border:1px solid #FADFE4;display:block;margin:0 auto;height:auto;\">\n  <\/div>\n<\/section>\n\n\n<!-- Testing + Handover duo -->\n\n<section class=\"oe_container\" id=\"cpa-section-9\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:40px 0 10px;\">\n    <div class=\"row\">\n      <div class=\"col-lg-6\" style=\"margin-bottom:22px;\">\n        <div class=\"h-100\" style=\"background-color:#FCF8F9;border:1px solid #F0E2E4;border-radius:6px;padding:22px;\">\n          <img src=\"../fire_alarm_manager/static/description/06_testing_commissioning.png\" alt=\"Testing and commissioning\" style=\"max-width:100%;border-radius:6px;display:block;margin-bottom:18px;height:auto;\">\n          <div style=\"font-size:12px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:#DC2544;margin-bottom:6px;\">Step 9 \u00b7 Testing &amp; Commissioning<\/div>\n          <h3 style=\"font-size:22px;font-weight:900;color:#8A1E30;margin:0 0 10px;\">Test, record, rectify<\/h3>\n          <p style=\"font-size:14.5px;color:#69474D;line-height:1.7;margin:0 0 12px;\">Checklist for panel, devices, pump, alarm, cause &amp; effect and emergency light. Attach test reports and before / after photos.<\/p>\n          <div>\n            <span style=\"display:inline-block;background-color:#FADEE3;color:#801527;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:700;margin:2px;\">Passed<\/span>\n            <span style=\"display:inline-block;background-color:#FADFE4;color:#C6203C;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:700;margin:2px;\">Passed with Remarks<\/span>\n            <span style=\"display:inline-block;background-color:#FBE5E9;color:#B71E37;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:700;margin:2px;\">Failed<\/span>\n            <span style=\"display:inline-block;background-color:#F7CED5;color:#A31A31;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:700;margin:2px;\">Rectification Required<\/span>\n          <\/div>\n        <\/div>\n      <\/div>\n      <div class=\"col-lg-6\" style=\"margin-bottom:22px;\">\n        <div class=\"h-100\" style=\"background-color:#8A1E30;border-radius:6px;padding:22px;color:#A1BBDE;\">\n          <img src=\"../fire_alarm_manager/static/description/07_handover_note.png\" alt=\"Completion and handover note\" style=\"max-width:100%;border-radius:6px;display:block;margin-bottom:18px;height:auto;\">\n          <div style=\"font-size:12px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:#F1A4B2;margin-bottom:6px;\">Step 10 \u00b7 Delivery Note / Completion<\/div>\n          <h3 style=\"font-size:22px;font-weight:900;color:#FFFFFF;margin:0 0 10px;\">Signed handover, printed as PDF<\/h3>\n          <p style=\"font-size:14.5px;color:#F6C7CF;line-height:1.7;margin:0;\">Work completed, materials delivered, testing result, outstanding items and warranty. The client signs on screen. Completion is blocked while testing has failed or rectification is open (a manager can override).<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- Invoice & payment: status bar -->\n\n<section class=\"oe_container\" id=\"cpa-section-10\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background-color:#FDF1F3;border-radius:6px;padding:40px 30px;margin-top:20px;\">\n    <div class=\"row align-items-center\">\n      <div class=\"col-lg-5\" style=\"margin-bottom:20px;\">\n        <div style=\"font-size:12px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:#D42240;margin-bottom:8px;\">Invoice &amp; payment<\/div>\n        <h2 style=\"font-size:28px;font-weight:900;color:#8A1E30;margin:0 0 12px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#FADFE4;padding-bottom:14px;\">Get paid, then close the job<\/h2>\n        <p style=\"font-size:15px;color:#69474D;line-height:1.7;margin:0;\">Create the invoice from the sales order, register full or partial payment, and the job shows its payment status. A job closes only when its invoice is fully paid, unless a FAFF Manager closes it.<\/p>\n      <\/div>\n      <div class=\"col-lg-7\">\n        <table style=\"width:100%;border-collapse:separate;border-spacing:6px;text-align:center;font-size:14px;table-layout:fixed;overflow-wrap:break-word;\">\n          <tr>\n            <td style=\"background-color:#FFFFFF;border:1px solid #F6C7CF;border-radius:6px;padding:16px 8px;color:#8B646A;font-weight:800;\">Not Invoiced<\/td>\n            <td style=\"background-color:#F6C7CF;border-radius:6px;padding:16px 8px;color:#8A1E30;font-weight:800;\">Invoiced<\/td>\n            <td style=\"background-color:#E87286;border-radius:6px;padding:16px 8px;color:#303030;font-weight:800;\">Partially Paid<\/td>\n            <td style=\"background-color:#D32240;border-radius:6px;padding:16px 8px;color:#FFFFFF;font-weight:800;\">Paid<\/td>\n          <\/tr>\n        <\/table>\n        <div style=\"text-align:right;font-size:13px;color:#8B646A;margin-top:6px;\">Payment status, worked out from the job's invoices<\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- Profitability: image + variance tiles -->\n\n<section class=\"oe_container\" id=\"cpa-section-11\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:56px 0 10px;\">\n    <div class=\"row align-items-center\">\n      <div class=\"col-lg-5\" style=\"margin-bottom:22px;\">\n        <div style=\"font-size:12px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:#DD2E4B;margin-bottom:8px;\">Job profitability<\/div>\n        <h2 style=\"font-size:28px;font-weight:900;color:#8A1E30;margin:0 0 12px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#FADFE4;padding-bottom:14px;\">Estimated vs actual, for every job<\/h2>\n        <p style=\"font-size:15px;color:#69474D;line-height:1.7;margin:0 0 16px;\">Estimated cost and selling price come from the approved BOQ. Actual figures come from material issued, purchase orders and invoices.<\/p>\n        <div class=\"row\">\n          <div class=\"col-4\" style=\"padding-right:6px;\"><div style=\"background-color:#FDF1F3;border-radius:6px;padding:12px;text-align:center;\"><div style=\"font-size:12px;font-weight:800;color:#D32240;\">Cost<\/div><div style=\"font-size:12px;color:#8B646A;\">variance<\/div><\/div><\/div>\n          <div class=\"col-4\" style=\"padding-left:6px;padding-right:6px;\"><div style=\"background-color:#FADFE4;border-radius:6px;padding:12px;text-align:center;\"><div style=\"font-size:12px;font-weight:800;color:#C6203C;\">Revenue<\/div><div style=\"font-size:12px;color:#7F5B61;\">variance<\/div><\/div><\/div>\n          <div class=\"col-4\" style=\"padding-left:6px;\"><div style=\"background-color:#D32240;border-radius:6px;padding:12px;text-align:center;color:#EDF2F9;\"><div style=\"font-size:12px;font-weight:800;color:#FFFFFF;\">Profit<\/div><div style=\"font-size:12px;color:#FCECEF;\">variance<\/div><\/div><\/div>\n        <\/div>\n      <\/div>\n      <div class=\"col-lg-7\" style=\"margin-bottom:22px;\">\n        <img src=\"../fire_alarm_manager/static/description/08_comparison_summary.png\" alt=\"Comparison summary\" style=\"max-width:100%;border-radius:6px;border:1px solid #FADFE4;display:block;height:auto;\">\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- Reports: three columns with coloured heads -->\n\n<section class=\"oe_container\" id=\"cpa-section-12\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:30px 0 10px;\">\n    <h2 style=\"font-size:28px;font-weight:900;color:#8A1E30;margin:0 0 20px;text-align:center;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#FADFE4;padding-bottom:14px;\">Reports built in<\/h2>\n    <div class=\"row\">\n      <div class=\"col-md-4\" style=\"margin-bottom:16px;\">\n        <div class=\"h-100\" style=\"border:1px solid #FADFE4;border-radius:6px;\">\n          <div style=\"background-color:#8A1E30;color:#FFFFFF;font-weight:800;font-size:15px;padding:12px 18px;border-radius:6px 15px 0 0;\">PDF reports<\/div>\n          <div style=\"padding:14px 18px;font-size:14px;color:#553339;line-height:2;\">Completion / Handover Note<br>Comparison Summary<br>Comparison Detail<br>Daily Activity<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"col-md-4\" style=\"margin-bottom:16px;\">\n        <div class=\"h-100\" style=\"border:1px solid #FADFE4;border-radius:6px;\">\n          <div style=\"background-color:#DE324F;color:#050505;font-weight:800;font-size:15px;padding:12px 18px;border-radius:6px 15px 0 0;\">FAFF analysis<\/div>\n          <div style=\"padding:14px 18px;font-size:14px;color:#553339;line-height:2;\">Jobs Analysis (pivot &amp; graph)<br>Profitability Summary &amp; Detail<br>Daily Job Activity<br>Print MIS Report by date, customer, job type<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"col-md-4\" style=\"margin-bottom:16px;\">\n        <div class=\"h-100\" style=\"border:1px solid #FADFE4;border-radius:6px;\">\n          <div style=\"background-color:#E87286;color:#303030;font-weight:800;font-size:15px;padding:12px 18px;border-radius:6px 15px 0 0;\">Operations &amp; finance<\/div>\n          <div style=\"padding:14px 18px;font-size:14px;color:#553339;line-height:2;\">Inspections, estimations, testing, handovers<br>Material requirements &amp; issues<br>FAFF invoices &amp; purchase orders<br>Outstanding receivable<\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- Job types badge grid + default tasks -->\n\n<section class=\"oe_container\" id=\"cpa-section-13\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background-color:#8A1E30;border-radius:6px;padding:40px 30px 30px;margin-top:24px;color:#A1BBDE;\">\n    <div class=\"row\">\n      <div class=\"col-lg-7\" style=\"margin-bottom:20px;\">\n        <div style=\"font-size:12px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:#F1A4B2;margin-bottom:8px;\">Ready to use<\/div>\n        <h2 style=\"font-size:26px;font-weight:900;color:#FFFFFF;margin:0 0 16px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#FADFE4;padding-bottom:14px;\">13 job types<\/h2>\n        <div class=\"row\">\n          <div class=\"col-6 col-md-4\" style=\"margin-bottom:8px;\"><div style=\"background-color:#DE324F;border-radius:6px;padding:9px 12px;color:#030508;\"><b style=\"color:#050505;font-size:12px;\">FA<\/b> <span style=\"color:#0C0204;font-size:13px;\">Fire Alarm<\/span><\/div><\/div>\n          <div class=\"col-6 col-md-4\" style=\"margin-bottom:8px;\"><div style=\"background-color:#DE324F;border-radius:6px;padding:9px 12px;color:#030508;\"><b style=\"color:#050505;font-size:12px;\">FF<\/b> <span style=\"color:#0C0204;font-size:13px;\">Fire Fighting<\/span><\/div><\/div>\n          <div class=\"col-6 col-md-4\" style=\"margin-bottom:8px;\"><div style=\"background-color:#DE324F;border-radius:6px;padding:9px 12px;color:#030508;\"><b style=\"color:#050505;font-size:12px;\">PUMP<\/b> <span style=\"color:#0C0204;font-size:13px;\">Fire Pump<\/span><\/div><\/div>\n          <div class=\"col-6 col-md-4\" style=\"margin-bottom:8px;\"><div style=\"background-color:#DE324F;border-radius:6px;padding:9px 12px;color:#030508;\"><b style=\"color:#050505;font-size:12px;\">SPR<\/b> <span style=\"color:#0C0204;font-size:13px;\">Sprinkler<\/span><\/div><\/div>\n          <div class=\"col-6 col-md-4\" style=\"margin-bottom:8px;\"><div style=\"background-color:#DE324F;border-radius:6px;padding:9px 12px;color:#030508;\"><b style=\"color:#050505;font-size:12px;\">HYD<\/b> <span style=\"color:#0C0204;font-size:13px;\">Hydrant<\/span><\/div><\/div>\n          <div class=\"col-6 col-md-4\" style=\"margin-bottom:8px;\"><div style=\"background-color:#DE324F;border-radius:6px;padding:9px 12px;color:#030508;\"><b style=\"color:#050505;font-size:12px;\">GAS<\/b> <span style=\"color:#0C0204;font-size:13px;\">Gas Suppression<\/span><\/div><\/div>\n          <div class=\"col-6 col-md-4\" style=\"margin-bottom:8px;\"><div style=\"background-color:#DE324F;border-radius:6px;padding:9px 12px;color:#030508;\"><b style=\"color:#050505;font-size:12px;\">EL<\/b> <span style=\"color:#0C0204;font-size:13px;\">Emergency / Exit Light<\/span><\/div><\/div>\n          <div class=\"col-6 col-md-4\" style=\"margin-bottom:8px;\"><div style=\"background-color:#DE324F;border-radius:6px;padding:9px 12px;color:#030508;\"><b style=\"color:#050505;font-size:12px;\">EXT<\/b> <span style=\"color:#0C0204;font-size:13px;\">Extinguisher<\/span><\/div><\/div>\n          <div class=\"col-6 col-md-4\" style=\"margin-bottom:8px;\"><div style=\"background-color:#DE324F;border-radius:6px;padding:9px 12px;color:#030508;\"><b style=\"color:#050505;font-size:12px;\">RECT<\/b> <span style=\"color:#0C0204;font-size:13px;\">Rectification<\/span><\/div><\/div>\n          <div class=\"col-6 col-md-4\" style=\"margin-bottom:8px;\"><div style=\"background-color:#DE324F;border-radius:6px;padding:9px 12px;color:#030508;\"><b style=\"color:#050505;font-size:12px;\">TEST<\/b> <span style=\"color:#0C0204;font-size:13px;\">Testing &amp; Inspection<\/span><\/div><\/div>\n          <div class=\"col-6 col-md-4\" style=\"margin-bottom:8px;\"><div style=\"background-color:#DE324F;border-radius:6px;padding:9px 12px;color:#030508;\"><b style=\"color:#050505;font-size:12px;\">AMC<\/b> <span style=\"color:#0C0204;font-size:13px;\">Annual Maintenance<\/span><\/div><\/div>\n          <div class=\"col-6 col-md-4\" style=\"margin-bottom:8px;\"><div style=\"background-color:#DE324F;border-radius:6px;padding:9px 12px;color:#030508;\"><b style=\"color:#050505;font-size:12px;\">MOD<\/b> <span style=\"color:#0C0204;font-size:13px;\">Modification / Upgrade<\/span><\/div><\/div>\n          <div class=\"col-6 col-md-4\" style=\"margin-bottom:8px;\"><div style=\"background-color:#DE324F;border-radius:6px;padding:9px 12px;color:#030508;\"><b style=\"color:#050505;font-size:12px;\">INST<\/b> <span style=\"color:#0C0204;font-size:13px;\">Installation<\/span><\/div><\/div>\n        <\/div>\n      <\/div>\n      <div class=\"col-lg-5\" style=\"margin-bottom:20px;\">\n        <div style=\"background-color:#FFFFFF;border-radius:6px;padding:20px 22px;color:#4377BD;\">\n          <div style=\"font-size:16px;font-weight:900;color:#8A1E30;margin-bottom:10px;\">10 default project tasks<\/div>\n          <div style=\"font-size:14px;color:#553339;line-height:2.1;\">\n            <span style=\"color:#DD2E4B;font-weight:900;\">\u2713<\/span> Mobilization<br>\n            <span style=\"color:#DD2E4B;font-weight:900;\">\u2713<\/span> Material Arrangement<br>\n            <span style=\"color:#DD2E4B;font-weight:900;\">\u2713<\/span> Installation \u00b7 Cable / Pipe Work<br>\n            <span style=\"color:#DD2E4B;font-weight:900;\">\u2713<\/span> Device Installation \u00b7 Programming<br>\n            <span style=\"color:#DD2E4B;font-weight:900;\">\u2713<\/span> Testing \u00b7 Commissioning<br>\n            <span style=\"color:#DD2E4B;font-weight:900;\">\u2713<\/span> Rectification \u00b7 Client Handover\n          <\/div>\n          <div style=\"font-size:13px;color:#8B646A;margin-top:8px;\">Add or edit job types and tasks under Configuration.<\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- FAQ: numbered single column -->\n\n<section class=\"oe_container\" id=\"cpa-section-14\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:50px 0 10px;max-width:860px;margin:0 auto;\">\n    <h2 style=\"font-size:28px;font-weight:900;color:#8A1E30;margin:0 0 20px;text-align:center;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#FADFE4;padding-bottom:14px;\">Questions<\/h2>\n    <div style=\"border-bottom:1px solid #FADFE4;padding:16px 0;\">\n      <div style=\"font-size:16px;font-weight:800;color:#2A0F13;\"><span style=\"color:#DD2E4B;\">01.<\/span> Is it really free?<\/div>\n      <div style=\"font-size:14.5px;color:#8B646A;line-height:1.6;margin-top:4px;\">Yes. Fire Alarm Management System is free to download and use.<\/div>\n    <\/div>\n    <div style=\"border-bottom:1px solid #FADFE4;padding:16px 0;\">\n      <div style=\"font-size:16px;font-weight:800;color:#2A0F13;\"><span style=\"color:#DD2E4B;\">02.<\/span> Which apps does it need?<\/div>\n      <div style=\"font-size:14.5px;color:#8B646A;line-height:1.6;margin-top:4px;\">CRM, Sales, Project, Purchase, Inventory, Invoicing, Employees and Re-Sequences (free). Odoo installs them with FAFF.<\/div>\n    <\/div>\n    <div style=\"border-bottom:1px solid #FADFE4;padding:16px 0;\">\n      <div style=\"font-size:16px;font-weight:800;color:#2A0F13;\"><span style=\"color:#DD2E4B;\">03.<\/span> Can I try it before using real data?<\/div>\n      <div style=\"font-size:14.5px;color:#8B646A;line-height:1.6;margin-top:4px;\">Yes. Configuration \u2192 Load Demo Data creates 9 sample jobs, one at each stage from CRM to paid. Clean Demo Data removes them.<\/div>\n    <\/div>\n    <div style=\"border-bottom:1px solid #FADFE4;padding:16px 0;\">\n      <div style=\"font-size:16px;font-weight:800;color:#2A0F13;\"><span style=\"color:#DD2E4B;\">04.<\/span> Who can override the rules?<\/div>\n      <div style=\"font-size:14.5px;color:#8B646A;line-height:1.6;margin-top:4px;\">A FAFF Manager can confirm completion with open rectification and close a job before full payment. FAFF Users follow the normal flow.<\/div>\n    <\/div>\n    <div style=\"padding:16px 0;\">\n      <div style=\"font-size:16px;font-weight:800;color:#2A0F13;\"><span style=\"color:#DD2E4B;\">05.<\/span> Can I start from an existing CRM opportunity?<\/div>\n      <div style=\"font-size:14.5px;color:#8B646A;line-height:1.6;margin-top:4px;\">Yes. Press Start FAFF Process on the opportunity and the wizard opens for it.<\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- Upgrade to any Odoo version: light blue card with three numbered steps -->\n\n<section class=\"oe_container\" id=\"cpa-section-15\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background-color:#FDF1F3;border-top:6px solid #DE324F;border-radius:6px;padding:34px 30px 26px;margin:36px 0 0;\">\n    <div style=\"text-align:center;margin-bottom:22px;\">\n      <span style=\"display:inline-block;background-color:#DE324F;color:#050505;font-size:12px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;border-radius:6px;padding:6px 14px;\">Available now on Odoo 14<\/span>\n      <h2 style=\"font-size:28px;font-weight:900;color:#8A1E30;margin:14px 0 8px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#FADFE4;padding-bottom:14px;\">Need it on another Odoo version?<\/h2>\n      <p style=\"font-size:15px;color:#69474D;margin:0 auto;max-width:620px;line-height:1.6;\">FAFF is upgradeable to any Odoo version, from 15 up to the latest. Three steps and it runs on yours.<\/p>\n    <\/div>\n    <div class=\"row\" style=\"margin-left:0;margin-right:0;\">\n      <div class=\"col-md-4\" style=\"padding:6px;\"><div style=\"background-color:#FFFFFF;border:1px solid #F6C7CF;border-radius:6px;padding:16px 18px;\"><div style=\"font-size:22px;font-weight:900;color:#DD2E4B;\">01<\/div><div style=\"font-size:15px;font-weight:800;color:#2A0F13;margin:4px 0;\">Tell us your version<\/div><div style=\"font-size:14px;color:#8B646A;line-height:1.55;\">WhatsApp or email us your Odoo version and edition.<\/div><\/div><\/div>\n      <div class=\"col-md-4\" style=\"padding:6px;\"><div style=\"background-color:#FFFFFF;border:1px solid #F6C7CF;border-radius:6px;padding:16px 18px;\"><div style=\"font-size:22px;font-weight:900;color:#DD2E4B;\">02<\/div><div style=\"font-size:15px;font-weight:800;color:#2A0F13;margin:4px 0;\">We upgrade the app<\/div><div style=\"font-size:14px;color:#8B646A;line-height:1.55;\">The CPA Books ERP team ports and tests FAFF on that version.<\/div><\/div><\/div>\n      <div class=\"col-md-4\" style=\"padding:6px;\"><div style=\"background-color:#FFFFFF;border:1px solid #F6C7CF;border-radius:6px;padding:16px 18px;\"><div style=\"font-size:22px;font-weight:900;color:#DD2E4B;\">03<\/div><div style=\"font-size:15px;font-weight:800;color:#2A0F13;margin:4px 0;\">Install and go<\/div><div style=\"font-size:14px;color:#8B646A;line-height:1.55;\">You get the upgraded module, ready to install.<\/div><\/div><\/div>\n    <\/div>\n    <div style=\"text-align:center;margin-top:18px;\">\n      <a href=\"https://wa.me/971562568128?text=Hello%20Saaskul%2C%20I%20need%20FAFF%20on%20another%20Odoo%20version.\" style=\"display:inline-block;background-color:#DE324F;color:#050505;padding:14px 24px;border-radius:6px;font-weight:800;font-size:15px;margin:4px 6px;text-decoration:none;\">WhatsApp +971 56 256 8128<\/a>\n      <a href=\"mailto:info.cpabooks@gmail.com?subject=FAFF%20-%20Odoo%20version%20upgrade\" style=\"display:inline-block;background-color:#FFFFFF;color:#8A1E30;padding:13px 23px;border-radius:6px;font-weight:800;font-size:15px;margin:4px 6px;text-decoration:none;border:1px solid #F0A0AE;\">info.cpabooks@gmail.com<\/a>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- CTA: split card -->\n\n<section class=\"oe_container\" id=\"cpa-section-16\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background-color:#FFFFFF;border:2px solid #DE324F;border-radius:6px;padding:34px 32px;margin:36px 0 10px;\">\n    <div class=\"row align-items-center\">\n      <div class=\"col-md-8\" style=\"margin-bottom:14px;\">\n        <h2 style=\"font-size:28px;font-weight:900;color:#8A1E30;margin:0 0 8px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#FADFE4;padding-bottom:14px;\">Run every fire safety job on one flow<\/h2>\n        <p style=\"font-size:15px;color:#69474D;margin:0;line-height:1.6;\">Questions, setup help or a custom report? Write to us and we will get back to you.<\/p>\n      <\/div>\n      <div class=\"col-md-4\" style=\"text-align:center;margin-bottom:14px;\">\n        <a href=\"mailto:info.cpabooks@gmail.com?subject=CPA%20Books%20ERP%20FAFF\" style=\"display:inline-block;background-color:#DE324F;color:#050505;padding:15px 26px;border-radius:6px;font-weight:800;font-size:15px;text-decoration:none;\">info.cpabooks@gmail.com<\/a>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n"}, {"name": "Advanced Sequence Manager", "theme": "Copper / Document control", "path": "smart_sequence_engine/static/description/index.html", "html": "<section class=\"oe_container\" style=\"padding:18px 8px;border-bottom:1px solid #E2E8F0;margin-bottom:24px;font-family:Arial,Helvetica,sans-serif;\"><strong style=\"color:#182B45;font-size:18px;\">CPA Books ERP<\/strong><a href=\"https://cpabookserp.com/contactus\" style=\"display:inline-block;margin:6px 0 6px 20px;color:#40536A;font-size:13px;text-decoration:none;\">Live Demo<\/a><a href=\"#cpa-section-1\" style=\"display:inline-block;margin:6px 0 6px 20px;color:#40536A;font-size:13px;text-decoration:none;\">Overview<\/a><a href=\"#cpa-section-2\" style=\"display:inline-block;margin:6px 0 6px 20px;color:#40536A;font-size:13px;text-decoration:none;\">Features<\/a><a href=\"#cpa-section-16\" style=\"display:inline-block;margin:6px 0 6px 20px;color:#40536A;font-size:13px;text-decoration:none;\">Support<\/a><\/section>\n<!-- Re-Sequences. apps.odoo.com keeps only whitelisted inline styles (no background shorthand, gradients, flex,\n     box-shadow): use background-color and Bootstrap grid classes for layout. -->\n\n\n<!-- Hero -->\n\n<section class=\"oe_container\" id=\"cpa-section-1\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background-color:#26160B;border-radius:4px;padding:28px 18px;text-align:left;color:#FFFFFF;\">\n    <div class=\"row align-items-center\"><div class=\"col-lg-7\" style=\"padding:18px;text-align:left;\"><img src=\"../smart_sequence_engine/static/description/icon.png\" alt=\"Advanced Sequence Manager\" style=\"width:96px;height:auto;border-radius:4px;display:block;margin:0 auto 20px;max-width:100%;\">\n    <div style=\"display:inline-block;background-color:#50301A;border:1px solid #7A5134;color:#F2CBAF;padding:6px 16px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;margin-bottom:18px;\">\n      CPA Books ERP \u00b7 Odoo 14 \u00b7 Free\n    <\/div>\n    <h1 style=\"font-size:38px;line-height:1.15;font-weight:800;letter-spacing:-0.02em;margin:0 auto 16px;max-width:820px;color:#FFFFFF;overflow-wrap:break-word;\">Advanced Sequence Manager<\/h1><p style=\"font-size:19px;line-height:1.6;color:#F7DFCE;max-width:720px;margin:0 auto 26px;\">\n      Every document number in your Odoo, clean, company-wise and locked.\n      Set one company prefix and get consistent numbering for 40+ document types:\n      quotations, invoices, vouchers, deliveries, projects and more.\n    <\/p>\n    <div style=\"margin:0 auto 24px;\">\n      <a href=\"#sk-features\" style=\"display:inline-block;background-color:#E1894A;color:#363636;padding:14px 28px;border-radius:4px;font-weight:800;font-size:15px;margin:5px;text-decoration:none;\">Explore Features<\/a>\n      <a href=\"mailto:info.cpabooks@gmail.com?subject=CPA%20Books%20ERP%20Advanced%20Advanced%20Sequence%20Manager\" style=\"display:inline-block;background-color:#26160B;color:#FFFFFF;padding:13px 27px;border-radius:4px;font-weight:800;font-size:15px;margin:5px;text-decoration:none;border:1px solid #A0785B;\">Ask a Question<\/a>\n    <\/div>\n    <div style=\"margin:0 auto 34px;\">\n      <span style=\"display:inline-block;background-color:#DB7125;color:#26160B;padding:7px 16px;border-radius:4px;font-size:12px;font-weight:800;letter-spacing:0.08em;margin:4px;\">FREE<\/span>\n      <span style=\"display:inline-block;background-color:#50301A;border:1px solid #7A5134;color:#FBEEE4;padding:7px 14px;border-radius:4px;font-size:12px;font-weight:700;margin:4px;\">Community<\/span>\n      <span style=\"display:inline-block;background-color:#50301A;border:1px solid #7A5134;color:#FBEEE4;padding:7px 14px;border-radius:4px;font-size:12px;font-weight:700;margin:4px;\">Enterprise<\/span>\n      <span style=\"display:inline-block;background-color:#50301A;border:1px solid #7A5134;color:#FBEEE4;padding:7px 14px;border-radius:4px;font-size:12px;font-weight:700;margin:4px;\">Multi-Company<\/span>\n      <span style=\"display:inline-block;background-color:#50301A;border:1px solid #7A5134;color:#FBEEE4;padding:7px 14px;border-radius:4px;font-size:12px;font-weight:700;margin:4px;\">Odoo 14.0<\/span>\n    <\/div>\n    <\/div><div class=\"col-lg-5\" style=\"padding:18px;\"><img src=\"../smart_sequence_engine/static/description/banner.png\" alt=\"Advanced Sequence Manager banner\" style=\"max-width:100%;border-radius:4px;display:block;margin:0 auto;border:1px solid #66432A;width:100%;height:auto;\">\n    <\/div><\/div><div class=\"row\" style=\"margin-top:30px;\">\n      <div class=\"col-6 col-md-3\" style=\"padding-top:12px;padding-bottom:12px;\">\n        <div style=\"font-size:34px;font-weight:800;color:#E9A777;\">40+<\/div>\n        <div style=\"font-size:13px;color:#F2CBAF;font-weight:600;\">document types numbered<\/div>\n      <\/div>\n      <div class=\"col-6 col-md-3\" style=\"padding-top:12px;padding-bottom:12px;\">\n        <div style=\"font-size:34px;font-weight:800;color:#E9A777;\">1 click<\/div>\n        <div style=\"font-size:13px;color:#F2CBAF;font-weight:600;\">to apply a company prefix<\/div>\n      <\/div>\n      <div class=\"col-6 col-md-3\" style=\"padding-top:12px;padding-bottom:12px;\">\n        <div style=\"font-size:34px;font-weight:800;color:#E9A777;\">3 formats<\/div>\n        <div style=\"font-size:13px;color:#F2CBAF;font-weight:600;\">yearly, short-year or monthly<\/div>\n      <\/div>\n      <div class=\"col-6 col-md-3\" style=\"padding-top:12px;padding-bottom:12px;\">\n        <div style=\"font-size:34px;font-weight:800;color:#E0823F;\">0<\/div>\n        <div style=\"font-size:13px;color:#F2CBAF;font-weight:600;\">duplicate posted numbers<\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- Before / After -->\n\n<section class=\"oe_container\" id=\"cpa-section-2\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:56px 0 16px;\">\n    <div style=\"text-align:center;margin-bottom:30px;\">\n      <div style=\"font-size:12px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:#B65E1E;margin-bottom:10px;\">Why Advanced Sequence Manager<\/div>\n      <h2 style=\"font-size:32px;font-weight:800;color:#26160B;margin:0 0 10px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#FAEADF;padding-bottom:14px;\">Stop fixing numbers by hand<\/h2>\n      <p style=\"font-size:16px;color:#826B5B;max-width:660px;margin:0 auto;line-height:1.7;\">\n        Standard Odoo keeps sequences in many places, with different formats per app.\n        Advanced Sequence Manager gives you one screen and one rule for all of them.\n      <\/p>\n    <\/div>\n    <div class=\"row\">\n      <div class=\"col-md-6\" style=\"margin-bottom:20px;\">\n        <div class=\"h-100\" style=\"
