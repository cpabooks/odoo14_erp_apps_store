ius:3px;padding:16px 16px 12px;min-height:232px;\">\n          <div style=\"font-size:13px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:#317D96;margin-bottom:10px;\">Purchase / Store<\/div>\n          <div style=\"font-size:15px;color:#161B1D;line-height:1.9;\">9 \u00b7 Stock Check<br>10 \u00b7 LPO (Purchase)<br>11 \u00b7 GRN<br>12 \u00b7 Delivery<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"col-md-3\" style=\"padding:6px;\">\n        <div style=\"background-color:#FFFFFF;border:1px solid #E5E9EB;border-top:6px solid #21A0CA;border-radius:3px;padding:16px 16px 12px;min-height:232px;\">\n          <div style=\"font-size:13px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:#187290;margin-bottom:10px;\">Accounting<\/div>\n          <div style=\"font-size:15px;color:#161B1D;line-height:1.9;\">13 \u00b7 Tax Invoice<br>14 \u00b7 Customer Payment<br>15 \u00b7 Bills Entry<br>16 \u00b7 Vendor Payment<\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- Progress Status: text left with status chips, screenshot right -->\n\n<section class=\"oe_container\" id=\"cpa-section-4\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Barlow,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background-color:#EAF7FC;border:1px solid #99D9EE;border-radius:3px;padding:40px 30px;margin-top:40px;\">\n    <div class=\"row align-items-center\" style=\"margin-left:0;margin-right:0;\">\n      <div class=\"col-md-5\" style=\"padding:0 12px 18px;\">\n        <div style=\"font-size:12px;font-weight:800;letter-spacing:0.16em;text-transform:uppercase;color:#187796;margin-bottom:8px;\">Progress Status<\/div>\n        <h2 style=\"font-size:32px;font-weight:900;color:#161B1D;margin:0 0 12px;line-height:1.1;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#DFF3FA;padding-bottom:14px;\">Where is this job? One button tells you.<\/h2>\n        <p style=\"font-size:15.5px;color:#4B5D63;line-height:1.65;margin:0 0 16px;\">\n          Press <b>Progress Status<\/b> on an opportunity, estimate, sales order, MO, purchase order, transfer or quality check.\n          A popup shows the overall completion and all 16 steps. The current step and the next one open with their checklist;\n          the rest stay folded.\n        <\/p>\n        <div style=\"margin-bottom:6px;\">\n          <span style=\"display:inline-block;background-color:#DEF3FA;color:#165165;padding:4px 12px;border-radius:3px;font-size:13px;font-weight:800;margin:3px;\">Done<\/span>\n          <span style=\"display:inline-block;background-color:#CEEDF7;color:#166D8A;padding:4px 12px;border-radius:3px;font-size:13px;font-weight:800;margin:3px;\">In Progress<\/span>\n          <span style=\"display:inline-block;background-color:#DFF3FA;color:#1A7695;padding:4px 12px;border-radius:3px;font-size:13px;font-weight:800;margin:3px;\">Next<\/span>\n          <span style=\"display:inline-block;background-color:#F3F5F6;color:#4B5D63;padding:4px 12px;border-radius:3px;font-size:13px;font-weight:800;margin:3px;\">Pending<\/span>\n        <\/div>\n        <p style=\"font-size:14px;color:#647378;line-height:1.6;margin:10px 0 0;\">Checklist items include: estimate approved, quotation sent, sales order confirmed, documents sent and received, MO released, quality passed, GRN received, delivery completed, invoice posted and payment voucher.<\/p>\n      <\/div>\n      <div class=\"col-md-7\" style=\"padding:0 12px 18px;\">\n        <img src=\"../switchgear_manager_pro/static/description/03_progress_status.png\" alt=\"Progress Status popup\" style=\"max-width:100%;border-radius:3px;border:1px solid #99D9EE;display:block;height:auto;\">\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- Estimate to MO: numbered wire of buttons, then two screenshots -->\n\n<section class=\"oe_container\" id=\"cpa-section-5\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Barlow,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:56px 0 8px;\">\n    <div style=\"font-size:12px;font-weight:800;letter-spacing:0.16em;text-transform:uppercase;color:#197E9F;margin-bottom:8px;\">Estimate \u2192 BOM \u2192 MO \u2192 PR \u2192 QC<\/div>\n    <h2 style=\"font-size:34px;font-weight:900;color:#161B1D;margin:0 0 18px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#DFF3FA;padding-bottom:14px;\">Buttons carry the job forward<\/h2>\n    <div class=\"row\" style=\"margin-left:0;margin-right:0;\">\n      <div class=\"col-6 col-md\" style=\"padding:5px;\">\n        <div style=\"background-color:#161B1D;color:#FFFFFF;border-radius:3px;padding:14px;min-height:150px;\">\n          <div style=\"font-family:'JetBrains Mono',Consolas,monospace;color:#31B3DE;font-size:13px;font-weight:700;\">01 \u00b7 OPPORTUNITY<\/div>\n          <div style=\"font-size:17px;font-weight:800;margin:6px 0;\">New Estimation<\/div>\n          <div style=\"font-size:13.5px;color:#C9D0D3;line-height:1.5;\">Opens a job estimate linked to the enquiry. Or tick quick quotation to skip it.<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"col-6 col-md\" style=\"padding:5px;\">\n        <div style=\"background-color:#161B1D;color:#FFFFFF;border-radius:3px;padding:14px;min-height:150px;\">\n          <div style=\"font-family:'JetBrains Mono',Consolas,monospace;color:#31B3DE;font-size:13px;font-weight:700;\">02 \u00b7 ESTIMATE<\/div>\n          <div style=\"font-size:17px;font-weight:800;margin:6px 0;\">Create BOM<\/div>\n          <div style=\"font-size:13.5px;color:#C9D0D3;line-height:1.5;\">After approval. Material, labour hours and overhead lines become BOM lines.<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"col-6 col-md\" style=\"padding:5px;\">\n        <div style=\"background-color:#161B1D;color:#FFFFFF;border-radius:3px;padding:14px;min-height:150px;\">\n          <div style=\"font-family:'JetBrains Mono',Consolas,monospace;color:#31B3DE;font-size:13px;font-weight:700;\">03 \u00b7 BOM<\/div>\n          <div style=\"font-size:17px;font-weight:800;margin:6px 0;\">Create MO<\/div>\n          <div style=\"font-size:13.5px;color:#C9D0D3;line-height:1.5;\">Manufacturing order carries the customer, job order and BOM reference.<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"col-6 col-md\" style=\"padding:5px;\">\n        <div style=\"background-color:#161B1D;color:#FFFFFF;border-radius:3px;padding:14px;min-height:150px;\">\n          <div style=\"font-family:'JetBrains Mono',Consolas,monospace;color:#31B3DE;font-size:13px;font-weight:700;\">04 \u00b7 MO<\/div>\n          <div style=\"font-size:17px;font-weight:800;margin:6px 0;\">Create PR<\/div>\n          <div style=\"font-size:13.5px;color:#C9D0D3;line-height:1.5;\">Pick a vendor; raw materials load with on-hand qty and become a purchase RFQ.<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"col-12 col-md\" style=\"padding:5px;\">\n        <div style=\"background-color:#31B3DE;color:#161B1D;border-radius:3px;padding:14px;min-height:150px;\">\n          <div style=\"font-family:'JetBrains Mono',Consolas,monospace;font-size:13px;font-weight:700;\">05 \u00b7 QC<\/div>\n          <div style=\"font-size:17px;font-weight:800;margin:6px 0;\">Deliver Product<\/div>\n          <div style=\"font-size:13.5px;line-height:1.5;\">When the check passes, closes the MO and validates the customer delivery.<\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n    <div class=\"row\" style=\"margin:18px 0 0;\">\n      <div class=\"col-md-6\" style=\"padding:6px;\">\n        <img src=\"../switchgear_manager_pro/static/description/04_estimate_to_bom.png\" alt=\"Estimate to BOM\" style=\"max-width:100%;border-radius:3px;border:1px solid #E5E9EB;display:block;height:auto;\">\n        <div style=\"font-size:14px;color:#69787D;margin-top:8px;\">Estimate with BoM Item Template, CRM Reference and Job Order. Create BOM copies every line.<\/div>\n      <\/div>\n      <div class=\"col-md-6\" style=\"padding:6px;\">\n        <img src=\"../switchgear_manager_pro/static/description/05_mo_pr_qc.png\" alt=\"MO with Create PR\" style=\"max-width:100%;border-radius:3px;border:1px solid #E5E9EB;display:block;height:auto;\">\n        <div style=\"font-size:14px;color:#69787D;margin-top:8px;\">MO with Create PR and Create Quality Check. Items already on an open PO for this MO are skipped.<\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- Design documents: dark band, screenshot left -->\n\n<section class=\"oe_container\" id=\"cpa-section-6\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Barlow,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background-color:#1E2527;border-radius:3px;padding:40px 30px;margin-top:40px;color:#FFFFFF;\">\n    <div class=\"row align-items-center\" style=\"margin-left:0;margin-right:0;\">\n      <div class=\"col-md-7\" style=\"padding:0 12px 18px;\">\n        <img src=\"../switchgear_manager_pro/static/description/06_design_documents.png\" alt=\"Design Document Register\" style=\"max-width:100%;border-radius:3px;border:1px solid #3B484D;display:block;height:auto;\">\n      <\/div>\n      <div class=\"col-md-5\" style=\"padding:0 12px 18px;\">\n        <div style=\"font-size:12px;font-weight:800;letter-spacing:0.16em;text-transform:uppercase;color:#31B3DE;margin-bottom:8px;\">Design Document Register<\/div>\n        <h2 style=\"font-size:30px;font-weight:900;margin:0 0 12px;line-height:1.15;color:#FFFFFF;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#DFF3FA;padding-bottom:14px;\">Drawings out, approvals back, all on the job<\/h2>\n        <p style=\"font-size:15.5px;color:#C9D0D3;line-height:1.65;margin:0 0 14px;\">Each register gets a number like <span style=\"font-family:'JetBrains Mono',Consolas,monospace;color:#31B3DE;\">SG/DES/2026/00007<\/span> and links the customer, quotation, estimate and job order.<\/p>\n        <table style=\"width:100%;border-collapse:collapse;font-size:14.5px;table-layout:fixed;overflow-wrap:break-word;\">\n          <tr><td style=\"padding:9px 0;border-bottom:1px solid #3B484D;color:#31B3DE;font-weight:800;width:42%;\">Document Sent<\/td><td style=\"padding:9px 0;border-bottom:1px solid #3B484D;color:#E5E9EB;\">SR, name, date, file, remarks<\/td><\/tr>\n          <tr><td style=\"padding:9px 0;border-bottom:1px solid #3B484D;color:#31B3DE;font-weight:800;\">Document Received<\/td><td style=\"padding:9px 0;border-bottom:1px solid #3B484D;color:#E5E9EB;\">SR, name, date, file, remarks<\/td><\/tr>\n          <tr><td style=\"padding:9px 0;border-bottom:1px solid #3B484D;color:#31B3DE;font-weight:800;\">Kanban cards<\/td><td style=\"padding:9px 0;border-bottom:1px solid #3B484D;color:#E5E9EB;\">Sent, Received and Files counts<\/td><\/tr>\n          <tr><td style=\"padding:9px 0;color:#31B3DE;font-weight:800;\">Chatter<\/td><td style=\"padding:9px 0;color:#E5E9EB;\">Messages and scheduled activities<\/td><\/tr>\n        <\/table>\n        <p style=\"font-size:14px;color:#9CAAAF;line-height:1.6;margin:14px 0 0;\">Sales orders also get Document and Document Received tabs.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- QC + label: screenshot right, inspection tag table left -->\n\n<section class=\"oe_container\" id=\"cpa-section-7\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Barlow,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:56px 0 8px;\">\n    <div class=\"row align-items-center\" style=\"margin-left:0;margin-right:0;\">\n      <div class=\"col-md-5\" style=\"padding:0 12px 18px;\">\n        <div style=\"font-size:12px;font-weight:800;letter-spacing:0.16em;text-transform:uppercase;color:#197E9F;margin-bottom:8px;\">Quality &amp; handover<\/div>\n        <h2 style=\"font-size:32px;font-weight:900;color:#161B1D;margin:0 0 12px;line-height:1.1;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#DFF3FA;padding-bottom:14px;\">Pass the check, ship the panel<\/h2>\n        <p style=\"font-size:15.5px;color:#4B5D63;line-height:1.65;margin:0 0 16px;\">A passed quality check shows <b>Deliver Product<\/b> and <b>Open Delivery<\/b>. The app finds the right customer delivery from the check, the sales order, the MO origin or the procurement group. Until the check passes, delivery is blocked.<\/p>\n        <div style=\"border:2px solid #161B1D;border-radius:3px;padding:14px 16px;background-color:#FFFFFF;\">\n          <div style=\"color:#1A7FA1;font-weight:900;font-size:18px;text-align:center;letter-spacing:0.06em;margin-bottom:8px;\">FINAL INSPECTION TAG<\/div>\n          <div style=\"font-family:'JetBrains Mono',Consolas,monospace;font-size:12.5px;color:#161B1D;line-height:1.9;text-align:center;\">CUSTOMER \u00b7 DATE \u00b7 PROJECT \u00b7 JOB NO<br>FINAL INSPECTION \u00b7 DWG NO \u00b7 REF. NO. \u00b7 PANEL REF.<br>Q.C. ENGINEER SIGNATURE<\/div>\n          <div style=\"font-size:13px;color:#69787D;text-align:center;margin-top:8px;\">QC Label report, Dymo 90 \u00d7 60 mm<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"col-md-7\" style=\"padding:0 12px 18px;\">\n        <img src=\"../switchgear_manager_pro/static/description/07_qc_label.png\" alt=\"Quality check and QC label\" style=\"max-width:100%;border-radius:3px;border:1px solid #E5E9EB;display:block;height:auto;\">\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- Dashboard: full-width screenshot then KPI table -->\n\n<section class=\"oe_container\" id=\"cpa-section-8\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Barlow,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background-color:#F3F5F6;border:1px solid #E5E9EB;border-radius:3px;padding:40px 30px;margin-top:40px;\">\n    <div style=\"text-align:center;margin-bottom:20px;\">\n      <div style=\"font-size:12px;font-weight:800;letter-spacing:0.16em;text-transform:uppercase;color:#187796;margin-bottom:8px;\">Switchgear Management System Dashboard<\/div>\n      <h2 style=\"font-size:34px;font-weight:900;color:#161B1D;margin:0;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#DFF3FA;padding-bottom:14px;\">The whole factory floor, in counts you can click<\/h2>\n    <\/div>\n    <img src=\"../switchgear_manager_pro/static/description/02_dashboard.png\" alt=\"Switchgear Management System Dashboard\" style=\"max-width:100%;border-radius:3px;border:1px solid #E5E9EB;display:block;margin:0 auto 22px;height:auto;\">\n    <table style=\"width:100%;border-collapse:collapse;font-size:15px;background-color:#FFFFFF;border-radius:3px;table-layout:fixed;overflow-wrap:break-word;\">\n      <tr>\n        <td style=\"padding:12px 16px;border-bottom:1px solid #E5E9EB;font-weight:800;color:#161B1D;width:34%;\">Open Enquiries<\/td>\n        <td style=\"padding:12px 16px;border-bottom:1px solid #E5E9EB;color:#4B5D63;\">Active CRM leads<\/td>\n      <\/tr>\n      <tr>\n        <td style=\"padding:12px 16px;border-bottom:1px solid #E5E9EB;font-weight:800;color:#161B1D;\">Estimations \u00b7 Quotations \u00b7 Sales Orders<\/td>\n        <td style=\"padding:12px 16px;border-bottom:1px solid #E5E9EB;color:#4B5D63;\">Open estimates, quotations to confirm, confirmed orders<\/td>\n      <\/tr>\n      <tr>\n        <td style=\"padding:12px 16px;border-bottom:1px solid #E5E9EB;font-weight:800;color:#161B1D;\">Design Documents \u00b7 MOs In Progress<\/td>\n        <td style=\"padding:12px 16px;border-bottom:1px solid #E5E9EB;color:#4B5D63;\">Registers, and manufacturing orders confirmed or in progress<\/td>\n      <\/tr>\n      <tr>\n        <td style=\"padding:12px 16px;font-weight:800;color:#161B1D;\">GRN Pending \u00b7 Delivery Pending<\/td>\n        <td style=\"padding:12px 16px;color:#4B5D63;\">Receipts and deliveries not yet done<\/td>\n      <\/tr>\n    <\/table>\n    <p style=\"font-size:14px;color:#647378;text-align:center;margin:14px 0 0;\">Below the tiles, six workflow panels (Customer, Estimation &amp; Sales, Design, Engineering &amp; Production, Purchase / Store, Accounting) list what is waiting and what is moving.<\/p>\n  <\/div>\n<\/section>\n\n\n<!-- Tutorial + demo data: two cards side by side -->\n\n<section class=\"oe_container\" id=\"cpa-section-9\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Barlow,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:56px 0 8px;\">\n    <h2 style=\"font-size:34px;font-weight:900;color:#161B1D;margin:0 0 18px;text-align:center;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#DFF3FA;padding-bottom:14px;\">Learn it in one sitting<\/h2>\n    <div class=\"row\" style=\"margin-left:0;margin-right:0;\">\n      <div class=\"col-md-7\" style=\"padding:8px;\">\n        <div style=\"background-color:#FFFFFF;border:1px solid #E5E9EB;border-radius:3px;padding:20px;\">\n          <div style=\"font-family:'JetBrains Mono',Consolas,monospace;color:#197E9F;font-size:13px;font-weight:700;margin-bottom:6px;\">TUTORIAL WIZARD<\/div>\n          <div style=\"font-size:20px;font-weight:800;color:#161B1D;margin-bottom:8px;\">Walk all 16 steps with real records<\/div>\n          <p style=\"font-size:15px;color:#4B5D63;line-height:1.6;margin:0 0 14px;\">Each step shows a hint and a short form. Press <b>Fill sample values<\/b>, then <b>Next<\/b>: the wizard creates the opportunity, estimate, sales order, design document, BOM, MO, PR, quality check, PO, GRN, delivery, invoice and payments, and lists everything created so far.<\/p>\n          <img src=\"../switchgear_manager_pro/static/description/08_tutorial_wizard.png\" alt=\"Tutorial wizard\" style=\"max-width:100%;border-radius:3px;border:1px solid #E5E9EB;display:block;height:auto;\">\n        <\/div>\n      <\/div>\n      <div class=\"col-md-5\" style=\"padding:8px;\">\n        <div style=\"background-color:#161B1D;border-radius:3px;padding:20px;color:#FFFFFF;\">\n          <div style=\"font-family:'JetBrains Mono',Consolas,monospace;color:#31B3DE;font-size:13px;font-weight:700;margin-bottom:6px;\">DEMO DATA<\/div>\n          <div style=\"font-size:20px;font-weight:800;margin-bottom:8px;\">Fill a test database in seconds<\/div>\n          <p style=\"font-size:15px;color:#C9D0D3;line-height:1.6;margin:0 0 12px;\">Administrators open <b>Switchgear Management System demo data<\/b>, choose the Switchgear Management System or Furniture profile and how many stacks to load (1 to 100, default 25).<\/p>\n          <table style=\"width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed;overflow-wrap:break-word;\">\n            <tr><td style=\"padding:8px 0;border-bottom:1px solid #3B484D;color:#E5E9EB;\">Customers, leads and opportunities<\/td><\/tr>\n            <tr><td style=\"padding:8px 0;border-bottom:1px solid #3B484D;color:#E5E9EB;\">Estimates in draft, awaiting approval and approved<\/td><\/tr>\n            <tr><td style=\"padding:8px 0;border-bottom:1px solid #3B484D;color:#E5E9EB;\">Design registers, BOMs, MOs at every stage<\/td><\/tr>\n            <tr><td style=\"padding:8px 0;border-bottom:1px solid #3B484D;color:#E5E9EB;\">Purchase requisitions, quality alerts, timesheets<\/td><\/tr>\n            <tr><td style=\"padding:8px 0;border-bottom:1px solid #3B484D;color:#E5E9EB;\">Invoices, vendor bills and payments<\/td><\/tr>\n            <tr><td style=\"padding:8px 0;color:#E5E9EB;\">13 follow-up activities per stack<\/td><\/tr>\n          <\/table>\n          <p style=\"font-size:14px;color:#9CAAAF;line-height:1.6;margin:12px 0 0;\"><b style=\"color:#31B3DE;\">Clean Demo Data<\/b> removes the demo customers, stacks and DEMO-SG / DEMO-FN products.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- Workspace: flowchart screenshot + sidebar sections -->\n\n<section class=\"oe_container\" id=\"cpa-section-10\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Barlow,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;border:2px solid #161B1D;border-radius:3px;padding:36px 28px;margin-top:40px;\">\n    <div class=\"row align-items-center\" style=\"margin-left:0;margin-right:0;\">\n      <div class=\"col-md-5\" style=\"padding:0 12px 18px;\">\n        <div style=\"font-size:12px;font-weight:800;letter-spacing:0.16em;text-transform:uppercase;color:#197E9F;margin-bottom:8px;\">Switchgear Management System workspace<\/div>\n        <h2 style=\"font-size:30px;font-weight:900;color:#161B1D;margin:0 0 12px;line-height:1.15;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#DFF3FA;padding-bottom:14px;\">One app, one sidebar, every screen<\/h2>\n        <p style=\"font-size:15.5px;color:#4B5D63;line-height:1.65;margin:0 0 12px;\">The Switchgear Management System app opens with a left sidebar called <b>Switchgear Management System Work<\/b>. The Process Flowchart gives the same flow as four columns of buttons.<\/p>\n        <div style=\"font-size:14.5px;color:#161B1D;line-height:2;\">\n          <span style=\"display:inline-block;border:1px solid #D1D8DB;border-radius:3px;padding:2px 10px;margin:2px;\">Home<\/span>\n          <span style=\"display:inline-block;border:1px solid #D1D8DB;border-radius:3px;padding:2px 10px;margin:2px;\">CRM<\/span>\n          <span style=\"display:inline-block;border:1px solid #D1D8DB;border-radius:3px;padding:2px 10px;margin:2px;\">Manufacturing<\/span>\n          <span style=\"display:inline-block;border:1px solid #D1D8DB;border-radius:3px;padding:2px 10px;margin:2px;\">Inventory<\/span>\n          <span style=\"display:inline-block;border:1px solid #D1D8DB;border-radius:3px;padding:2px 10px;margin:2px;\">Quality<\/span>\n          <span style=\"display:inline-block;border:1px solid #D1D8DB;border-radius:3px;padding:2px 10px;margin:2px;\">Timesheet<\/span>\n          <span style=\"display:inline-block;border:1px solid #D1D8DB;border-radius:3px;padding:2px 10px;margin:2px;\">Employees<\/span>\n          <span style=\"display:inline-block;border:1px solid #D1D8DB;border-radius:3px;padding:2px 10px;margin:2px;\">Projects<\/span>\n          <span style=\"display:inline-block;border:1px solid #D1D8DB;border-radius:3px;padding:2px 10px;margin:2px;\">Activities<\/span>\n          <span style=\"display:inline-block;border:1px solid #D1D8DB;border-radius:3px;padding:2px 10px;margin:2px;\">Accounting<\/span>\n        <\/div>\n        <p style=\"font-size:14px;color:#69787D;line-height:1.6;margin:12px 0 0;\">Projects get smart buttons for Estimations, BoMs, Manufacturing Orders and Quality Checks, plus a Tasks by Customer view.<\/p>\n      <\/div>\n      <div class=\"col-md-7\" style=\"padding:0 12px 18px;\">\n        <img src=\"../switchgear_manager_pro/static/description/09_flowchart.png\" alt=\"Process Flowchart\" style=\"max-width:100%;border-radius:3px;border:1px solid #E5E9EB;display:block;height:auto;\">\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- Requirements + good to know -->\n\n<section class=\"oe_container\" id=\"cpa-section-11\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Barlow,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:56px 0 8px;\">\n    <div class=\"row\" style=\"margin-left:0;margin-right:0;\">\n      <div class=\"col-md-7\" style=\"padding:8px;\">\n        <h3 style=\"font-size:24px;font-weight:900;color:#161B1D;margin:0 0 12px;\">Requirements<\/h3>\n        <table style=\"width:100%;border-collapse:collapse;font-size:14.5px;table-layout:fixed;overflow-wrap:break-word;\">\n          <tr><td style=\"padding:10px 12px;background-color:#161B1D;color:#31B3DE;font-weight:800;width:38%;\">Odoo<\/td><td style=\"padding:10px 12px;background-color:#161B1D;color:#FFFFFF;\">14.0 Community or Enterprise<\/td><\/tr>\n          <tr><td style=\"padding:10px 12px;border-bottom:1px solid #E5E9EB;font-weight:800;\">Odoo apps<\/td><td style=\"padding:10px 12px;border-bottom:1px solid #E5E9EB;color:#4B5D63;\">CRM, Sales, Manufacturing, Inventory, Purchase, Invoicing, Project, Employees, Timesheets<\/td><\/tr>\n          <tr><td style=\"padding:10px 12px;border-bottom:1px solid #E5E9EB;font-weight:800;\">Third-party apps<\/td><td style=\"padding:10px 12px;border-bottom:1px solid #E5E9EB;color:#4B5D63;\">None. Only standard Odoo modules are needed.<\/td><\/tr>\n          <tr><td style=\"padding:10px 12px;border-bottom:1px solid #E5E9EB;font-weight:800;\">Built in<\/td><td style=\"padding:10px 12px;border-bottom:1px solid #E5E9EB;color:#4B5D63;\">Job estimates, quality checks and alerts, purchase requisitions, activity lists<\/td><\/tr>\n          <tr><td style=\"padding:10px 12px;font-weight:800;\">Works with<\/td><td style=\"padding:10px 12px;color:#4B5D63;\">Enterprise Quality and Purchase Agreements can stay installed; Switchgear Management System uses its own records<\/td><\/tr>\n        <\/table>\n      <\/div>\n      <div class=\"col-md-5\" style=\"padding:8px;\">\n        <div style=\"background-color:#EAF7FC;border:1px solid #99D9EE;border-top:8px solid #31B3DE;border-radius:3px;padding:20px;\">\n          <h3 style=\"font-size:22px;font-weight:900;color:#161B1D;margin:0 0 10px;\">Good to know<\/h3>\n          <p style=\"font-size:14.5px;color:#4B5D63;line-height:1.6;margin:0 0 10px;\">Installing switches the web UI to Switchgear Management System mode: the Switchgear Management System sidebar replaces the top submenus on its screens.<\/p>\n          <p style=\"font-size:14.5px;color:#4B5D63;line-height:1.6;margin:0 0 10px;\">The CRM pipeline opens in list view, and Mark Won is hidden on opportunities so jobs move through the cycle.<\/p>\n          <p style=\"font-size:14.5px;color:#4B5D63;line-height:1.6;margin:0;\">Configuration and the demo data loader are for administrators only. All internal users get the Switchgear Management System app.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- FAQ -->\n\n<section class=\"oe_container\" id=\"cpa-section-12\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Barlow,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:40px 0 8px;\">\n    <h2 style=\"font-size:30px;font-weight:900;color:#161B1D;margin:0 0 10px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#DFF3FA;padding-bottom:14px;\">Questions<\/h2>\n    <div style=\"border-bottom:1px solid #E5E9EB;padding:16px 0;\">\n      <div style=\"font-size:16px;font-weight:800;color:#161B1D;\"><span style=\"color:#197E9F;font-family:'JetBrains Mono',Consolas,monospace;\">Q1<\/span> Is it only for switchgear?<\/div>\n      <div style=\"font-size:14.5px;color:#4B5D63;line-height:1.6;margin-top:4px;\">It is built for switchgear and electrical panel makers, but any make-to-order workshop with estimate, BOM, MO and QC can use it. The demo loader also has a Furniture profile.<\/div>\n    <\/div>\n    <div style=\"border-bottom:1px solid #E5E9EB;padding:16px 0;\">\n      <div style=\"font-size:16px;font-weight:800;color:#161B1D;\"><span style=\"color:#197E9F;font-family:'JetBrains Mono',Consolas,monospace;\">Q2<\/span> Can I skip the estimate?<\/div>\n      <div style=\"font-size:14.5px;color:#4B5D63;line-height:1.6;margin-top:4px;\">Yes. Tick \"Use quick quotation (bypass job estimate)\" on the opportunity and go straight to the quotation.<\/div>\n    <\/div>\n    <div style=\"border-bottom:1px solid #E5E9EB;padding:16px 0;\">\n      <div style=\"font-size:16px;font-weight:800;color:#161B1D;\"><span style=\"color:#197E9F;font-family:'JetBrains Mono',Consolas,monospace;\">Q3<\/span> Does Create PR raise a requisition or an RFQ?<\/div>\n      <div style=\"font-size:14.5px;color:#4B5D63;line-height:1.6;margin-top:4px;\">It creates a purchase RFQ linked to the MO, with the vendor and lines you confirm in the popup. For an approval step, raise a Purchase Requisition from the sidebar; once approved it creates one RFQ per vendor.<\/div>\n    <\/div>\n    <div style=\"padding:16px 0;\">\n      <div style=\"font-size:16px;font-weight:800;color:#161B1D;\"><span style=\"color:#197E9F;font-family:'JetBrains Mono',Consolas,monospace;\">Q4<\/span> Where do I start?<\/div>\n      <div style=\"font-size:14.5px;color:#4B5D63;line-height:1.6;margin-top:4px;\">Open the Switchgear Management System app, run the Tutorial Wizard once, then follow the processing cycle for real jobs.<\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- Upgrade to any Odoo version: yellow hazard plate with version tags -->\n\n<section class=\"oe_container\" id=\"cpa-section-13\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Barlow,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background-color:#31B3DE;border-radius:3px;padding:30px 28px;margin:36px 0 0;border-top:10px solid #161B1D;\">\n    <div class=\"row align-items-center\" style=\"margin-left:0;margin-right:0;\">\n      <div class=\"col-md-7\" style=\"padding:6px 10px;\">\n        <div style=\"font-family:'JetBrains Mono',Consolas,monospace;font-size:12px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:#161B1D;margin-bottom:6px;\">Rated for: any Odoo version<\/div>\n        <h2 style=\"font-size:30px;font-weight:900;color:#161B1D;margin:0 0 8px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#DFF3FA;padding-bottom:14px;\">Upgradeable to any Odoo version<\/h2>\n        <p style=\"font-size:15px;color:#12343F;line-height:1.6;margin:0 0 14px;\">Switchgear Management System ships for Odoo 14 today. We upgrade it to whichever Odoo version your panel shop runs. WhatsApp or email us your version.<\/p>\n        <div>\n          <span style=\"display:inline-block;background-color:#161B1D;color:#31B3DE;border-radius:3px;padding:6px 10px;margin:3px;font-weight:800;font-size:14px;\">v14 in stock<\/span>\n          <span style=\"display:inline-block;border:2px solid #161B1D;color:#161B1D;border-radius:3px;padding:4px 9px;margin:3px;font-weight:800;font-size:14px;\">v15<\/span>\n          <span style=\"display:inline-block;border:2px solid #161B1D;color:#161B1D;border-radius:3px;padding:4px 9px;margin:3px;font-weight:800;font-size:14px;\">v16<\/span>\n          <span s lor:#DFF3FA;padding-bottom:14px;\">Power up your panel shop<\/h2>\n        <p style=\"font-size:15px;color:#C9D0D3;margin:0;line-height:1.6;\">Setup help, a demo or a custom report? Email or WhatsApp us on +971 56 256 8128.<\/p>\n      <\/div>\n      <div class=\"col-md-5\" style=\"padding:0 10px 14px;text-align:center;\">\n        <a href=\"mailto:info.cpabooks@gmail.com?subject=CPA%20Books%20ERP%20Switchgear%20Management%20System\" style=\"display:inline-block;background-color:#31B3DE;color:#161B1D;padding:15px 24px;border-radius:3px;font-weight:800;font-size:15px;text-decoration:none;\">info.cpabooks@gmail.com<\/a>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n"}];const css="*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif}.oe_container{max-width:1140px;margin:auto;padding:0 12px}.row{display:flex;flex-wrap:wrap;margin:0 -12px}.row>[class*=col-]{padding:0 12px}[class*=col-]{width:100%}.align-items-center{align-items:center}.h-100{height:100%}.col-2{width:16.666%}.col-4{width:33.333%}.col-6{width:50%}@media(min-width:768px){.col-md-2{width:16.666%}.col-md-3{width:25%}.col-md-4{width:33.333%}.col-md-5{width:41.666%}.col-md-6{width:50%}.col-md-7{width:58.333%}.col-md-8{width:66.666%}}@media(min-width:992px){.col-lg-3{width:25%}.col-lg-4{width:33.333%}.col-lg-5{width:41.666%}.col-lg-6{width:50%}.col-lg-7{width:58.333%}.col-lg-8{width:66.666%}}img{max-width:100%;height:auto}a{color:inherit}";const app=document.getElementById('app'),frame=document.getElementById('page');pages.forEach((p,i)=>app.add(new Option(p.name,i)));function show(){const p=pages[app.value];frame.srcdoc='<html><meta name="viewport" content="width=device-width,initial-scale=1"><style>'+css+'</style><body>'+p.html+'</body></html>';document.getElementById('source').href='../'+p.path;document.getElementById('note').textContent=p.theme+' · Local preview; final store rendering may differ.'}app.onchange=show;document.getElementById('mobile').onclick=()=>frame.className='mobile';do
