tyle=\"font-size:13px;line-height:1.5;color:#475569;\">Show companies side by side as statement columns.<\/div>\n      <\/div>\n      <div class=\"col-6 col-lg-3\" style=\"padding:10px;\">\n        <span style=\"display:inline-block;width:30px;height:30px;line-height:30px;border-radius:50%;background-color:#164485;color:#FFFFFF;font-size:13px;font-weight:800;text-align:center;\">4<\/span>\n        <div style=\"font-size:15px;font-weight:800;color:#0C2548;margin:8px 0 4px;\">Live from journals<\/div>\n        <div style=\"font-size:13px;line-height:1.5;color:#475569;\">Figures load from posted entries, not from a spreadsheet.<\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- Report levels as a ladder -->\n\n<section class=\"oe_container\" id=\"cpa-section-6\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:60px 0 10px;\">\n    <div class=\"row\">\n      <div class=\"col-lg-4\" style=\"padding:10px 18px;\">\n        <div style=\"font-size:12px;font-weight:800;letter-spacing:0.16em;text-transform:uppercase;color:#164485;margin-bottom:8px;\">Report levels<\/div>\n        <h2 style=\"font-family:Georgia,'Times New Roman',serif;font-size:34px;font-weight:700;color:#0C2548;margin:0 0 14px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#DFEAFA;padding-bottom:14px;\">Same books, five levels of detail<\/h2>\n        <p style=\"font-size:16px;line-height:1.7;color:#475569;margin:0;\">Give the bank a clean official pack, give management the type breakdown, and keep the full working papers for the accountant. Switch the level, print again.<\/p>\n      <\/div>\n      <div class=\"col-lg-8\" style=\"padding:10px 18px;\">\n        <div style=\"background-color:#0C2548;color:#FFFFFF;border-radius:8px;padding:16px 20px;margin-bottom:10px;\">\n          <span style=\"display:inline-block;background-color:#FFFFFF;color:#0C2548;border-radius:6px;padding:3px 10px;font-size:12px;font-weight:900;margin-right:12px;\">L1<\/span>\n          <span style=\"font-size:16px;font-weight:800;\">Official<\/span><span style=\"font-size:14px;color:#A9C7F1;\"> \u00b7 for FTA and banks<\/span>\n        <\/div>\n        <div style=\"background-color:#11376B;color:#FFFFFF;border-radius:8px;padding:16px 20px;margin-bottom:10px;margin-left:24px;\">\n          <span style=\"display:inline-block;background-color:#FFFFFF;color:#11376B;border-radius:6px;padding:3px 10px;font-size:12px;font-weight:900;margin-right:12px;\">L1 AR<\/span>\n          <span style=\"font-size:16px;font-weight:800;\">Official, Arabic version<\/span><span style=\"font-size:14px;color:#D3E2F8;\"> \u00b7 FTA / bank, in Arabic<\/span>\n        <\/div>\n        <div style=\"background-color:#164485;color:#FFFFFF;border-radius:8px;padding:16px 20px;margin-bottom:10px;margin-left:48px;\">\n          <span style=\"display:inline-block;background-color:#FFFFFF;color:#164485;border-radius:6px;padding:3px 10px;font-size:12px;font-weight:900;margin-right:12px;\">L2<\/span>\n          <span style=\"font-size:16px;font-weight:800;\">Management<\/span><span style=\"font-size:14px;color:#EDF3FC;\"> \u00b7 with account type<\/span>\n        <\/div>\n        <div style=\"background-color:#D3E2F8;color:#0C2548;border-radius:8px;padding:16px 20px;margin-bottom:10px;margin-left:72px;\">\n          <span style=\"display:inline-block;background-color:#0C2548;color:#FFFFFF;border-radius:6px;padding:3px 10px;font-size:12px;font-weight:900;margin-right:12px;\">L3<\/span>\n          <span style=\"font-size:16px;font-weight:800;\">Detailed<\/span><span style=\"font-size:14px;color:#11376B;\"> \u00b7 with group (default)<\/span>\n        <\/div>\n        <div style=\"background-color:#EDF3FC;color:#0C2548;border:1px dashed #6EA0E7;border-radius:8px;padding:16px 20px;margin-left:96px;\">\n          <span style=\"display:inline-block;background-color:#0C2548;color:#FFFFFF;border-radius:6px;padding:3px 10px;font-size:12px;font-weight:900;margin-right:12px;\">L4<\/span>\n          <span style=\"font-size:16px;font-weight:800;\">Accountant working papers<\/span><span style=\"font-size:14px;color:#11376B;\"> \u00b7 trial balance and validation<\/span>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- Comparative periods: dark cards like the real buttons, then the screenshot -->\n\n<section class=\"oe_container\" id=\"cpa-section-7\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background-color:#0F1A2A;border-radius:8px;padding:48px 28px 32px;margin-top:40px;color:#5684C4;\">\n    <div style=\"text-align:center;margin-bottom:26px;\">\n      <div style=\"font-size:12px;font-weight:800;letter-spacing:0.16em;text-transform:uppercase;color:#6EA0E7;margin-bottom:8px;\">Comparative periods<\/div>\n      <h2 style=\"font-family:Georgia,'Times New Roman',serif;font-size:34px;font-weight:700;color:#FFFFFF;margin:0 0 10px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#DFEAFA;padding-bottom:14px;\">Compare any two periods with one click<\/h2>\n      <p style=\"font-size:16px;line-height:1.6;color:#CBD4E1;max-width:640px;margin:0 auto;\">Show 1 to 5 years or 1 to 4 months, and choose the column order.<\/p>\n    <\/div>\n    <div class=\"row\" style=\"margin:0 0 22px;\">\n      <div class=\"col-6 col-lg\" style=\"padding:6px;\">\n        <div class=\"h-100\" style=\"background-color:#0C2548;border:2px solid #1C58AD;border-radius:8px;padding:14px;color:#658FC9;\">\n          <div style=\"font-size:10px;font-weight:900;color:#0C2548;background-color:#6EA0E7;display:inline-block;padding:2px 7px;border-radius:4px;margin-bottom:6px;\">DEFAULT<\/div>\n          <div style=\"font-size:14px;font-weight:800;color:#FFFFFF;\">Last 2 years<\/div>\n          <div style=\"font-size:13px;font-weight:700;color:#6EA0E7;margin-top:4px;\">2024 \u2192 2025<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"col-6 col-lg\" style=\"padding:6px;\">\n        <div class=\"h-100\" style=\"background-color:#1E2A3B;border:1px solid #334155;border-radius:8px;padding:14px;color:#6992CB;\">\n          <div style=\"font-size:14px;font-weight:800;color:#FFFFFF;\">Last 2 months<\/div>\n          <div style=\"font-size:13px;font-weight:700;color:#6EA0E7;margin-top:4px;\">Jul \u2192 Aug<\/div>\n          <div style=\"font-size:12px;color:#94A3B8;margin-top:4px;\">month vs month before<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"col-6 col-lg\" style=\"padding:6px;\">\n        <div class=\"h-100\" style=\"background-color:#1E2A3B;border:1px solid #334155;border-radius:8px;padding:14px;color:#6992CB;\">\n          <div style=\"font-size:14px;font-weight:800;color:#FFFFFF;\">Same month YoY<\/div>\n          <div style=\"font-size:13px;font-weight:700;color:#6EA0E7;margin-top:4px;\">Aug 2025 \u2192 Aug 2026<\/div>\n          <div style=\"font-size:12px;color:#94A3B8;margin-top:4px;\">month vs last year<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"col-6 col-lg\" style=\"padding:6px;\">\n        <div class=\"h-100\" style=\"background-color:#1E2A3B;border:1px solid #334155;border-radius:8px;padding:14px;color:#6992CB;\">\n          <div style=\"font-size:14px;font-weight:800;color:#FFFFFF;\">Custom period<\/div>\n          <div style=\"font-size:13px;font-weight:700;color:#6EA0E7;margin-top:4px;\">Pick dates<\/div>\n          <div style=\"font-size:12px;color:#94A3B8;margin-top:4px;\">prior and current ranges<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"col-12 col-lg\" style=\"padding:6px;\">\n        <div class=\"h-100\" style=\"background-color:#1E2A3B;border:1px solid #334155;border-radius:8px;padding:14px;color:#6992CB;\">\n          <div style=\"font-size:14px;font-weight:800;color:#FFFFFF;\">Column order<\/div>\n          <div style=\"font-size:13px;font-weight:700;color:#6EA0E7;margin-top:4px;\">Ascending / descending<\/div>\n          <div style=\"font-size:12px;color:#94A3B8;margin-top:4px;\">oldest or newest first<\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n    <img src=\"../financial_audit_suite/static/description/feature_03_structure.jpg\" alt=\"AFG comparative periods and statement\" style=\"max-width:100%;border-radius:8px;display:block;margin:0 auto;border:1px solid #334155;height:auto;\">\n  <\/div>\n<\/section>\n\n\n<!-- Validation: a PASS / FAIL check sheet next to the review screenshot -->\n\n<section class=\"oe_container\" id=\"cpa-section-8\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:60px 0 10px;\">\n    <div class=\"row align-items-center\">\n      <div class=\"col-lg-5\" style=\"padding:10px 18px;\">\n        <div style=\"font-size:12px;font-weight:800;letter-spacing:0.16em;text-transform:uppercase;color:#164485;margin-bottom:8px;\">Validation &amp; review<\/div>\n        <h2 style=\"font-family:Georgia,'Times New Roman',serif;font-size:34px;font-weight:700;color:#0C2548;margin:0 0 14px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#DFEAFA;padding-bottom:14px;\">Checked before anyone sees it<\/h2>\n        <p style=\"font-size:16px;line-height:1.7;color:#475569;margin:0 0 18px;\">More than 25 checks run on the pack. A critical FAIL stops the L1 official print and shows you where to fix it.<\/p>\n        <table style=\"width:100%;border-collapse:collapse;font-size:14px;border:1px solid #D3E2F8;table-layout:fixed;overflow-wrap:break-word;\">\n          <tr><td style=\"padding:10px 12px;border-bottom:1px solid #D3E2F8;color:#0F1A2A;\">Revenue \u2212 Expenses = Profit<\/td><td style=\"padding:10px 12px;border-bottom:1px solid #D3E2F8;text-align:right;\"><span style=\"background-color:#164485;color:#FFFFFF;border-radius:4px;padding:2px 8px;font-size:11px;font-weight:800;\">PASS<\/span><\/td><\/tr>\n          <tr><td style=\"padding:10px 12px;border-bottom:1px solid #D3E2F8;color:#0F1A2A;background-color:#F9FBFE;\">Assets = Equity + Liabilities<\/td><td style=\"padding:10px 12px;border-bottom:1px solid #D3E2F8;text-align:right;background-color:#F9FBFE;\"><span style=\"background-color:#164485;color:#FFFFFF;border-radius:4px;padding:2px 8px;font-size:11px;font-weight:800;\">PASS<\/span><\/td><\/tr>\n          <tr><td style=\"padding:10px 12px;border-bottom:1px solid #D3E2F8;color:#0F1A2A;\">Changes in Equity agree to SOFP and P&amp;L<\/td><td style=\"padding:10px 12px;border-bottom:1px solid #D3E2F8;text-align:right;\"><span style=\"background-color:#164485;color:#FFFFFF;border-radius:4px;padding:2px 8px;font-size:11px;font-weight:800;\">PASS<\/span><\/td><\/tr>\n          <tr><td style=\"padding:10px 12px;border-bottom:1px solid #D3E2F8;color:#0F1A2A;background-color:#F9FBFE;\">Closing cash agrees to Cash Flow<\/td><td style=\"padding:10px 12px;border-bottom:1px solid #D3E2F8;text-align:right;background-color:#F9FBFE;\"><span style=\"background-color:#164485;color:#FFFFFF;border-radius:4px;padding:2px 8px;font-size:11px;font-weight:800;\">PASS<\/span><\/td><\/tr>\n          <tr><td style=\"padding:10px 12px;border-bottom:1px solid #D3E2F8;color:#0F1A2A;\">Opening balance = prior closing<\/td><td style=\"padding:10px 12px;border-bottom:1px solid #D3E2F8;text-align:right;\"><span style=\"background-color:#164485;color:#FFFFFF;border-radius:4px;padding:2px 8px;font-size:11px;font-weight:800;\">PASS<\/span><\/td><\/tr>\n          <tr><td style=\"padding:10px 12px;border-bottom:1px solid #D3E2F8;color:#0F1A2A;background-color:#F9FBFE;\">Cash not overdrawn<\/td><td style=\"padding:10px 12px;border-bottom:1px solid #D3E2F8;text-align:right;background-color:#F9FBFE;\"><span style=\"background-color:#2571DB;color:#FFFFFF;border-radius:4px;padding:2px 8px;font-size:11px;font-weight:800;\">WARN<\/span><\/td><\/tr>\n          <tr><td style=\"padding:10px 12px;color:#0F1A2A;\">Financial statements reconcile to TB<\/td><td style=\"padding:10px 12px;text-align:right;\"><span style=\"background-color:#2672DC;color:#FFFFFF;border-radius:4px;padding:2px 8px;font-size:11px;font-weight:800;\">FAIL<\/span><\/td><\/tr>\n        <\/table>\n      <\/div>\n      <div class=\"col-lg-7\" style=\"padding:10px 18px;\">\n        <div style=\"background-color:#EDF3FC;border-radius:8px;padding:14px;\">\n          <img src=\"../financial_audit_suite/static/description/feature_02_reporting.jpg\" alt=\"AFG statement with review alerts\" style=\"max-width:100%;border-radius:8px;display:block;margin:0 auto;height:auto;\">\n        <\/div>\n        <div style=\"font-size:13px;color:#64748B;margin-top:10px;text-align:center;\">Review alerts sit next to the statement, with internal notes for the team.<\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- Control tools: three different tiles -->\n\n<section class=\"oe_container\" id=\"cpa-section-9\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:52px 0 10px;\">\n    <div style=\"font-size:12px;font-weight:800;letter-spacing:0.16em;text-transform:uppercase;color:#164485;margin-bottom:8px;\">Stay in control<\/div>\n    <h2 style=\"font-family:Georgia,'Times New Roman',serif;font-size:34px;font-weight:700;color:#0C2548;margin:0 0 24px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#DFEAFA;padding-bottom:14px;\">Mapping, adjustments and clean ledgers<\/h2>\n    <div class=\"row\" style=\"margin-left:0;margin-right:0;\">\n      <div class=\"col-lg-4\" style=\"padding:10px;\">\n        <div class=\"h-100\" style=\"background-color:#FFFFFF;border:1px solid #D3E2F8;border-radius:8px;padding:24px;\">\n          <div style=\"font-family:Georgia,'Times New Roman',serif;font-size:44px;font-weight:700;color:#164485;line-height:1;\">22<\/div>\n          <div style=\"font-size:13px;font-weight:700;color:#64748B;margin-bottom:14px;\">preset groups<\/div>\n          <div style=\"font-size:17px;font-weight:800;color:#0F1A2A;margin-bottom:8px;\">Trial balance mapping<\/div>\n          <div style=\"font-size:14px;line-height:1.6;color:#475569;\">Keyword rules auto-map your chart of accounts. Anything unmapped lands in an \u201cUngrouped / needs review\u201d group, and a popup lets you reassign it.<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"col-lg-4\" style=\"padding:10px;\">\n        <div class=\"h-100\" style=\"background-color:#0C2548;border-radius:8px;padding:24px;color:#658FC9;\">\n          <div style=\"display:inline-block;background-color:#1C58AD;color:#FFFFFF;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:900;letter-spacing:0.08em;margin-bottom:16px;\">AUDIT TRAIL<\/div>\n          <div style=\"font-size:17px;font-weight:800;color:#FFFFFF;margin-bottom:8px;\">Sensitive adjustments<\/div>\n          <div style=\"font-size:14px;line-height:1.6;color:#D3E2F8;\">Lines in sensitive categories can\u2019t be edited directly. Changes go through a wizard that asks for a justification, and every amount change is written to the edit log.<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"col-lg-4\" style=\"padding:10px;\">\n        <div class=\"h-100\" style=\"background-color:#EDF3FC;border:1px dashed #6EA0E7;border-radius:8px;padding:24px;\">\n          <div style=\"margin-bottom:16px;\">\n            <span style=\"display:inline-block;background-color:#FFFFFF;color:#11376B;border:1px solid #A9C7F1;border-radius:6px;padding:4px 9px;font-size:12px;font-weight:800;margin:2px;\">Rename<\/span>\n            <span style=\"display:inline-block;background-color:#FFFFFF;color:#11376B;border:1px solid #A9C7F1;border-radius:6px;padding:4px 9px;font-size:12px;font-weight:800;margin:2px;\">Merge<\/span>\n            <span style=\"display:inline-block;background-color:#FFFFFF;color:#11376B;border:1px solid #A9C7F1;border-radius:6px;padding:4px 9px;font-size:12px;font-weight:800;margin:2px;\">Archive<\/span>\n            <span style=\"display:inline-block;background-color:#FFFFFF;color:#11376B;border:1px solid #A9C7F1;border-radius:6px;padding:4px 9px;font-size:12px;font-weight:800;margin:2px;\">Delete<\/span>\n          <\/div>\n          <div style=\"font-size:17px;font-weight:800;color:#0F1A2A;margin-bottom:8px;\">Merge Ledger<\/div>\n          <div style=\"font-size:14px;line-height:1.6;color:#475569;\">Tidy duplicate ledgers by AFG group, account group or a single ledger, inside the same company, before you print.<\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- UAE Corporate Tax band -->\n\n<section class=\"oe_container\" id=\"cpa-section-10\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background-color:#11376B;border-radius:8px;padding:44px 32px;margin-top:40px;color:#83A5D4;\">\n    <div class=\"row align-items-center\">\n      <div class=\"col-lg-5\" style=\"padding:10px 16px;\">\n        <div style=\"font-size:12px;font-weight:800;letter-spacing:0.16em;text-transform:uppercase;color:#A9C7F1;margin-bottom:8px;\">UAE Corporate Tax<\/div>\n        <h2 style=\"font-family:Georgia,'Times New Roman',serif;font-size:32px;font-weight:700;color:#FFFFFF;margin:0 0 12px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#DFEAFA;padding-bottom:14px;\">A filing layout next to your statements<\/h2>\n        <p style=\"font-size:15px;line-height:1.7;color:#D3E2F8;margin:0;\">Tag each account with one of 30 CT filing categories. AFG builds the Corporate Tax view of P&amp;L and Financial Position and prints a CT-only PDF.<\/p>\n      <\/div>\n      <div class=\"col-lg-7\" style=\"padding:10px 16px;\">\n        <div style=\"background-color:#FFFFFF;border-radius:8px;padding:22px 24px;color:#4376BE;\">\n          <div style=\"font-size:14px;font-weight:800;color:#0C2548;margin-bottom:12px;\">CT Master workbook (Excel)<\/div>\n          <div class=\"row\">\n            <div class=\"col-6\" style=\"font-size:13px;line-height:2;color:#334155;\">\n              <span style=\"color:#164485;font-weight:800;\">01<\/span> L1 Official<br>\n              <span style=\"color:#164485;font-weight:800;\">02<\/span> Salaries / EOSB<br>\n              <span style=\"color:#164485;font-weight:800;\">03<\/span> Rent prepaid<br>\n              <span style=\"color:#164485;font-weight:800;\">04<\/span> FAR auto\n            <\/div>\n            <div class=\"col-6\" style=\"font-size:13px;line-height:2;color:#334155;\">\n              <span style=\"color:#164485;font-weight:800;\">05<\/span> FAR manual<br>\n              <span style=\"color:#164485;font-weight:800;\">06<\/span> Profit and Loss<br>\n              <span style=\"color:#164485;font-weight:800;\">07<\/span> Balance Sheet<br>\n              <span style=\"color:#164485;font-weight:800;\">08<\/span> Trial Balance\n            <\/div>\n          <\/div>\n          <div style=\"font-size:12px;color:#64748B;margin-top:10px;border-top:1px solid #EDF3FC;padding-top:10px;\">Sheets that need a module you don\u2019t have installed are skipped automatically.<\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- Exports as document cards -->\n\n<section class=\"oe_container\" id=\"cpa-section-11\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:60px 0 10px;text-align:center;\">\n    <div style=\"font-size:12px;font-weight:800;letter-spacing:0.16em;text-transform:uppercase;color:#164485;margin-bottom:8px;\">Output<\/div>\n    <h2 style=\"font-family:Georgia,'Times New Roman',serif;font-size:34px;font-weight:700;color:#0C2548;margin:0 0 26px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#DFEAFA;padding-bottom:14px;\">One pack, four formats<\/h2>\n    <div class=\"row\" style=\"margin-left:0;margin-right:0;\">\n      <div class=\"col-6 col-lg-3\" style=\"padding:10px;\">\n        <div class=\"h-100\" style=\"background-color:#FFFFFF;border:1px solid #D3E2F8;border-radius:8px;padding:26px 16px 20px;border-top-width:8px;border-top-style:solid;border-top-color:#0C2548;\">\n          <div style=\"font-family:Georgia,'Times New Roman',serif;font-size:30px;font-weight:700;color:#0C2548;\">PDF<\/div>\n          <div style=\"font-size:13px;line-height:1.6;color:#475569;margin-top:8px;\">Full audit pack, CT-only pack and a simple FS print.<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"col-6 col-lg-3\" style=\"padding:10px;\">\n        <div class=\"h-100\" style=\"background-color:#FFFFFF;border:1px solid #D3E2F8;border-radius:8px;padding:26px 16px 20px;border-top-width:8px;border-top-style:solid;border-top-color:#11376B;\">\n          <div style=\"font-family:Georgia,'Times New Roman',serif;font-size:30px;font-weight:700;color:#11376B;\">Excel<\/div>\n          <div style=\"font-size:13px;line-height:1.6;color:#475569;margin-top:8px;\">The pack as an .xlsx workbook for working files.<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"col-6 col-lg-3\" style=\"padding:10px;\">\n        <div class=\"h-100\" style=\"background-color:#FFFFFF;border:1px solid #D3E2F8;border-radius:8px;padding:26px 16px 20px;border-top-width:8px;border-top-style:solid;border-top-color:#164485;\">\n          <div style=\"font-family:Georgia,'Times New Roman',serif;font-size:30px;font-weight:700;color:#164485;\">Word<\/div>\n          <div style=\"font-size:13px;line-height:1.6;color:#475569;margin-top:8px;\">An editable .doc file you can open in Word.<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"col-6 col-lg-3\" style=\"padding:10px;\">\n        <div class=\"h-100\" style=\"background-color:#FFFFFF;border:1px solid #D3E2F8;border-radius:8px;padding:26px 16px 20px;border-top-width:8px;border-top-style:solid;border-top-color:#1C58AD;\">\n          <div style=\"font-family:Georgia,'Times New Roman',serif;font-size:30px;font-weight:700;color:#1C58AD;\">CSV<\/div>\n          <div style=\"font-size:13px;line-height:1.6;color:#475569;margin-top:8px;\">Report lines with prior, current and TB amounts.<\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- Disclaimer as a signed note -->\n\n<section class=\"oe_container\" id=\"cpa-section-12\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:36px 0 10px;\">\n    <div style=\"background-color:#F9FBFE;border:1px solid #D3E2F8;border-left-width:6px;border-left-style:solid;border-left-color:#0C2548;border-radius:8px;padding:24px 28px;\">\n      <div style=\"font-family:Georgia,'Times New Roman',serif;font-size:19px;font-weight:700;color:#0C2548;margin-bottom:8px;\">Management-prepared, not an audit<\/div>\n      <div style=\"font-size:14px;line-height:1.7;color:#475569;\">AFG prepares financial statements from the accounting records in Odoo. They are management-prepared statements and are not an independent audit or an auditor\u2019s opinion. Where a statutory audit is required, the audit report must come from your appointed external auditor.<\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- Facts and FAQ side by side -->\n\n<section class=\"oe_container\" id=\"cpa-section-13\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:48px 0 10px;\">\n    <div class=\"row\">\n      <div class=\"col-lg-5\" style=\"padding:10px 18px;\">\n        <h2 style=\"font-family:Georgia,'Times New Roman',serif;font-size:28px;font-weight:700;color:#0C2548;margin:0 0 18px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#DFEAFA;padding-bottom:14px;\">At a glance<\/h2>\n        <table style=\"width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed;overflow-wrap:break-word;\">\n          <tr><td style=\"padding:12px 0;border-bottom:1px solid #D3E2F8;color:#64748B;font-weight:700;width:40%;\">Publisher<\/td><td style=\"padding:12px 0;border-bottom:1px solid #D3E2F8;color:#0F1A2A;font-weight:700;\">CPA Books ERP<\/td><\/tr>\n          <tr><td style=\"padding:12px 0;border-bottom:1px solid #D3E2F8;color:#64748B;font-weight:700;\">Version<\/td><td style=\"padding:12px 0;border-bottom:1px solid #D3E2F8;color:#0F1A2A;\">Odoo 14<\/td><\/tr>\n          <tr><td style=\"padding:12px 0;border-bottom:1px solid #D3E2F8;color:#64748B;font-weight:700;\">Price<\/td><td style=\"padding:12px 0;border-bottom:1px solid #D3E2F8;color:#164485;font-weight:800;\">Free<\/td><\/tr>\n          <tr><td style=\"padding:12px 0;border-bottom:1px solid #D3E2F8;color:#64748B;font-weight:700;\">Needs<\/td><td style=\"padding:12px 0;border-bottom:1px solid #D3E2F8;color:#0F1A2A;\">Accounting, CPA Books ERP dashboard module<\/td><\/tr>\n          <tr><td style=\"padding:12px 0;border-bottom:1px solid #D3E2F8;color:#64748B;font-weight:700;\">Exports<\/td><td style=\"padding:12px 0;border-bottom:1px solid #D3E2F8;color:#0F1A2A;\">PDF, Excel, Word (.doc), CSV<\/td><\/tr>\n          <tr><td style=\"padding:12px 0;color:#64748B;font-weight:700;\">Statements<\/td><td style=\"padding:12px 0;color:#0F1A2A;\">P&amp;L, SOFP, SOCE, Cash Flows, PPE, Notes, CT layout<\/td><\/tr>\n        <\/table>\n      <\/div>\n      <div class=\"col-lg-7\" style=\"padding:10px 18px;\">\n        <h2 style=\"font-family:Georgia,'Times New Roman',serif;font-size:28px;font-weight:700;color:#0C2548;margin:0 0 18px;\">Questions<\/h2>\n        <div style=\"padding:14px 0;border-bottom:1px solid #D3E2F8;\">\n          <div style=\"font-size:15px;font-weight:800;color:#0F1A2A;margin-bottom:4px;\">Does AFG replace my accounting?<\/div>\n          <div style=\"font-size:14px;line-height:1.6;color:#475569;\">No. It reads the accounting you already keep in Odoo.<\/div>\n        <\/div>\n        <div style=\"padding:14px 0;border-bottom:1px solid #D3E2F8;\">\n          <div style=\"font-size:15px;font-weight:800;color:#0F1A2A;margin-bottom:4px;\">Do I re-enter balances?<\/div>\n          <div style=\"font-size:14px;line-height:1.6;color:#475569;\">No. Figures come from your posted journals and trial balance.<\/div>\n        <\/div>\n        <div style=\"padding:14px 0;border-bottom:1px solid #D3E2F8;\">\n          <div style=\"font-size:15px;font-weight:800;color:#0F1A2A;margin-bottom:4px;\">Can I try it before using my own figures?<\/div>\n          <div style=\"font-size:14px;line-height:1.6;color:#475569;\">Yes. Load sample data fills in demo figures. Clear adjustments resets everything back to the trial balance.<\/div>\n        <\/div>\n        <div style=\"padding:14px 0;border-bottom:1px solid #D3E2F8;\">\n          <div style=\"font-size:15px;font-weight:800;color:#0F1A2A;margin-bottom:4px;\">Can it report a group of companies?<\/div>\n          <div style=\"font-size:14px;line-height:1.6;color:#475569;\">Yes. Consolidate companies into one pack or show them side by side as columns.<\/div>\n        <\/div>\n        <div style=\"padding:14px 0;\">\n          <div style=\"font-size:15px;font-weight:800;color:#0F1A2A;margin-bottom:4px;\">Is this an external audit opinion?<\/div>\n          <div style=\"font-size:14px;line-height:1.6;color:#475569;\">No. AFG produces management-prepared statements. Any statutory audit opinion must come from an independent auditor.<\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- Upgrade to any Odoo version: a version ledger with ruled rows -->\n\n<section class=\"oe_container\" id=\"cpa-section-14\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;margin:44px 0 0;padding:6px;\">\n    <div class=\"row\" style=\"margin-left:0;margin-right:0;\">\n      <div class=\"col-md-6\" style=\"padding:10px 18px 10px 6px;\">\n        <div style=\"font-size:12px;font-weight:800;letter-spacing:0.2em;text-transform:uppercase;color:#164485;margin-bottom:8px;\">Version ledger<\/div>\n        <h2 style=\"font-family:Georgia,'Times New Roman',serif;font-size:30px;font-weight:700;color:#0C2548;margin:0 0 10px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#DFEAFA;padding-bottom:14px;\">Upgradeable to any Odoo version<\/h2>\n        <p style=\"font-size:15px;line-height:1.7;color:#475569;margin:0 0 20px;\">AFG is published for Odoo 14 today. Running Odoo 15, 16, 17, 18 or 19? We upgrade the app to your version. Message us on WhatsApp or email with your Odoo version.<\/p>\n        <a href=\"https://wa.me/971562568128?text=Hello%20Saaskul%2C%20I%20need%20AFG%20on%20another%20Odoo%20version.\" style=\"display:inline-block;background-color:#0C2548;color:#FFFFFF;padding:13px 22px;border-radius:8px;font-weight:800;font-size:14px;margin:4px 6px 4px 0;text-decoration:none;\">WhatsApp +971 56 256 8128<\/a>\n        <a href=\"mailto:info.cpabooks@gmail.com?subject=AFG%20-%20Odoo%20version%20upgrade\" style=\"display:inline-block;background-color:#FFFFFF;color:#11376B;padding:12px 21px;border-radius:8px;font-weight:800;font-size:14px;margin:4px 0;text-decoration:none;border:1px solid #6EA0E7;\">info.cpabooks@gmail.com<\/a>\n      <\/div>\n      <div class=\"col-md-6\" style=\"padding:10px 6px;\">\n        <table style=\"width:100%;border-collapse:collapse;font-size:15px;border-top:3px double #0C2548;border-bottom:3px double #0C2548;table-layout:fixed;overflow-wrap:break-word;\">\n          <tr><td style=\"padding:11px 8px;border-bottom:1px solid #D3E2F8;font-weight:800;color:#0C2548;\">Odoo 14.0<\/td><td style=\"padding:11px 8px;border-bottom:1px solid #D3E2F8;text-align:right;color:#164485;font-weight:800;\">Available now<\/td><\/tr>\n          <tr><td style=\"padding:11px 8px;border-bottom:1px solid #D3E2F8;color:#0F1A2A;\">Odoo 15.0<\/td><td style=\"padding:11px 8px;border-bottom:1px solid #D3E2F8;text-align:right;color:#64748B;\">Upgrade on request<\/td><\/tr>\n          <tr><td style=\"padding:11px 8px;border-bottom:1px solid #D3E2F8;color:#0F1A2A;\">Odoo 16.0<\/td><td style=\"padding:11px 8px;border-bottom:1px solid #D3E2F8;text-align:right;color:#64748B;\">Upgrade on request<\/td><\/tr>\n          <tr><td style=\"padding:11px 8px;border-bottom:1px solid #D3E2F8;color:#0F1A2A;\">Odoo 17.0<\/td><td style=\"padding:11px 8px;border-bottom:1px solid #D3E2F8;text-align:right;color:#64748B;\">Upgrade on request<\/td><\/tr>\n          <tr><td style=\"padding:11px 8px;border-bottom:1px solid #D3E2F8;color:#0F1A2A;\">Odoo 18.0<\/td><td style=\"padding:11px 8px;border-bottom:1px solid #D3E2F8;text-align:right;color:#64748B;\">Upgrade on request<\/td><\/tr>\n          <tr><td style=\"padding:11px 8px;color:#0F1A2A;\">Odoo 19.0<\/td><td style=\"padding:11px 8px;text-align:right;color:#64748B;\">Upgrade on request<\/td><\/tr>\n        <\/table>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- CTA: double-ruled closing line like the foot of a statement -->\n\n<section class=\"oe_container\" id=\"afg-cta\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;margin:48px 0 10px;border-top:3px double #0C2548;border-bottom:3px double #0C2548;padding:36px 12px;text-align:center;\">\n    <img src=\"../financial_audit_suite/static/description/icon.png\" alt=\"AFG\" style=\"width:56px;height:auto;display:block;margin:0 auto 14px;max-width:100%;\">\n    <h2 style=\"font-family:Georgia,'Times New Roman',serif;font-size:32px;font-weight:700;color:#0C2548;margin:0 0 10px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#DFEAFA;padding-bottom:14px;\">Close the year from inside Odoo<\/h2>\n    <p style=\"font-size:16px;line-height:1.6;color:#475569;max-width:560px;margin:0 auto 22px;\">Questions, setup help or a demo? Write to us and we will get back to you.<\/p>\n    <a href=\"mailto:info.cpabooks@gmail.com?subject=AFG%20Setup%20Help\" style=\"display:inline-block;background-color:#164485;color:#FFFFFF;padding:14px 26px;border-radius:8px;font-weight:800;font-size:15px;margin:4px;text-decoration:none;\">info.cpabooks@gmail.com<\/a>\n    <a href=\"tel:+971562568128\" style=\"display:inline-block;background-color:#FFFFFF;color:#11376B;padding:13px 25px;border-radius:8px;font-weight:800;font-size:15px;margin:4px;text-decoration:none;border:1px solid #6EA0E7;\">+971 56 256 8128<\/a>\n  <\/div>\n<\/section>\n"}, {"name": "Smart Chart of Accounts Manager", "theme": "Aubergine / Ledger architecture", "path": "smart_coa_builder/static/description/index.html", "html": "<section class=\"oe_container\" style=\"padding:18px 8px;border-bottom:1px solid #E2E8F0;margin-bottom:24px;font-family:Arial,Helvetica,sans-serif;\"><strong style=\"color:#182B45;font-size:18px;\">CPA Books ERP<\/strong><a href=\"https://cpabookserp.com/contactus\" style=\"display:inline-block;margin:6px 0 6px 20px;color:#40536A;font-size:13px;text-decoration:none;\">Live Demo<\/a><a href=\"#cpa-section-1\" style=\"display:inline-block;margin:6px 0 6px 20px;color:#40536A;font-size:13px;text-decoration:none;\">Overview<\/a><a href=\"#cpa-section-2\" style=\"display:inline-block;margin:6px 0 6px 20px;color:#40536A;font-size:13px;text-decoration:none;\">Features<\/a><a href=\"#cpa-section-7\" style=\"display:inline-block;margin:6px 0 6px 20px;color:#40536A;font-size:13px;text-decoration:none;\">Support<\/a><\/section>\n<!-- IFRS Chart of Accounts. apps.odoo.com keeps only whitelisted inline styles\n     (no background shorthand, gradients, flex, box-shadow): use background-color\n     and Bootstrap grid classes for layout. -->\n\n\n<!-- Hero -->\n\n<section class=\"oe_container\" id=\"cpa-section-1\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background-color:#1E0F2A;border-radius:16px;padding:28px 18px;text-align:left;color:#FFFFFF;\">\n    <div class=\"row align-items-center\"><div class=\"col-lg-7\" style=\"padding:18px;text-align:left;\"><img src=\"../smart_coa_builder/static/description/icon.png\" alt=\"Smart Chart of Accounts Manager\" style=\"width:96px;height:auto;border-radius:16px;display:block;margin:0 auto 20px;border:3px solid #9132DE;max-width:100%;\">\n    <div style=\"display:inline-block;background-color:#401663;border:1px solid #9132DE;color:#D4AFF2;padding:6px 16px;border-radius:16px;font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;margin-bottom:18px;\">\n      CPA Books ERP \u00b7 Odoo 14 \u00b7 Free\n    <\/div>\n    <h1 style=\"font-size:38px;line-height:1.15;font-weight:800;letter-spacing:-0.02em;margin:0 auto 16px;max-width:820px;color:#FFFFFF;overflow-wrap:break-word;\">Smart Chart of Accounts Manager<\/h1><p style=\"font-size:19px;line-height:1.6;color:#A894B8;max-width:720px;margin:0 auto 26px;\">\n      Structure your Odoo ledgers the IFRS way: L1 types, L2 groups and L3 codes.\n      Reset numbering, merge unused accounts and post opening balances from one place.\n    <\/p>\n    <div style=\"margin:0 auto 24px;\">\n      <a href=\"#sk-features\" style=\"display:inline-block;background-color:#641AA0;color:#FFFFFF;padding:14px 28px;border-radius:12px;font-weight:800;font-size:15px;margin:5px;text-decoration:none;\">Explore Features<\/a>\n      <a href=\"mailto:info.cpabooks@gmail.com?subject=CPA%20Books%20ERP%20Smart%20Smart%20Chart%20of%20Accounts%20Manager%20Manager\" style=\"display:inline-block;background-color:#1E0F2A;color:#FFFFFF;padding:13px 27px;border-radius:12px;font-weight:800;font-size:15px;margin:5px;text-decoration:none;border:1px solid #463355;\">Ask a Question<\/a>\n    <\/div>\n    <div style=\"margin:0 auto 34px;\">\n      <span style=\"display:inline-block;background-color:#8925DB;color:#E5D6F0;padding:7px 16px;border-radius:16px;font-size:12px;font-weight:800;letter-spacing:0.08em;margin:4px;\">FREE<\/span>\n      <span style=\"display:inline-block;background-color:#2E1E3B;border:1px solid #463355;color:#EAE2F0;padding:7px 14px;border-radius:16px;font-size:12px;font-weight:700;margin:4px;\">Community<\/span>\n      <span style=\"display:inline-block;background-color:#2E1E3B;border:1px solid #463355;color:#EAE2F0;padding:7px 14px;border-radius:16px;font-size:12px;font-weight:700;margin:4px;\">Enterprise<\/span>\n      <span style=\"display:inline-block;background-color:#2E1E3B;border:1px solid #463355;color:#EAE2F0;padding:7px 14px;border-radius:16px;font-size:12px;font-weight:700;margin:4px;\">Multi-Company<\/span>\n      <span style=\"display:inline-block;background-color:#2E1E3B;border:1px solid #463355;color:#EAE2F0;padding:7px 14px;border-radius:16px;font-size:12px;font-weight:700;margin:4px;\">Odoo 14.0<\/span>\n    <\/div>\n    <\/div><div class=\"col-lg-5\" style=\"padding:18px;\"><img src=\"../smart_coa_builder/static/description/banner.png\" alt=\"Smart Chart of Accounts Manager banner\" style=\"max-width:100%;border-radius:16px;display:block;margin:0 auto;border:1px solid #463355;width:100%;height:auto;\">\n    <\/div><\/div><div class=\"row\" style=\"margin-top:30px;\">\n      <div class=\"col-6 col-md-3\" style=\"padding-top:12px;padding-bottom:12px;\">\n        <div style=\"font-size:34px;font-weight:800;color:#A95EE5;\">L1<\/div>\n        <div style=\"font-size:13px;color:#A894B8;font-weight:600;\">5 account types<\/div>\n      <\/div>\n      <div class=\"col-6 col-md-3\" style=\"padding-top:12px;padding-bottom:12px;\">\n        <div style=\"font-size:34px;font-weight:800;color:#A95EE5;\">L2<\/div>\n        <div style=\"font-size:13px;color:#A894B8;font-weight:600;\">IFRS group catalog<\/div>\n      <\/div>\n      <div class=\"col-6 col-md-3\" style=\"padding-top:12px;padding-bottom:12px;\">\n        <div style=\"font-size:34px;font-weight:800;color:#A95EE5;\">L3<\/div>\n        <div style=\"font-size:13px;color:#A894B8;font-weight:600;\">company-wise ledgers<\/div>\n      <\/div>\n      <div class=\"col-6 col-md-3\" style=\"padding-top:12px;padding-bottom:12px;\">\n        <div style=\"font-size:34px;font-weight:800;color:#A85EE5;\">1 click<\/div>\n        <div style=\"font-size:13px;color:#A894B8;font-weight:600;\">to reset codes<\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- Why -->\n\n<section class=\"oe_container\" id=\"cpa-section-2\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:56px 0 16px;\">\n    <div style=\"text-align:center;margin-bottom:30px;\">\n      <div style=\"font-size:12px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:#641AA0;margin-bottom:10px;\">Why this chart<\/div>\n      <h2 style=\"font-size:32px;font-weight:800;color:#1E0F2A;margin:0 0 10px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#EEDFFA;padding-bottom:14px;\">Stop living with a messy COA<\/h2>\n      <p style=\"font-size:16px;color:#79648B;max-width:660px;margin:0 auto;line-height:1.7;\">\n        Standard Odoo charts mix country templates, duplicate codes and leftover ledgers.\n        This app gives you one IFRS-shaped tree and the tools to keep it clean.\n      <\/p>\n    <\/div>\n    <div class=\"row\">\n      <div class=\"col-md-6\" style=\"margin-bottom:20px;\">\n        <div class=\"h-100\" style=\"background-color:#FFFFFF;border:1px solid #EAE2F0;border-radius:16px;padding:28px;\">\n          <div style=\"font-size:12px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:#85699C;margin-bottom:16px;\">Without this app<\/div>\n          <p style=\"margin:0 0 8px;font-size:15px;color:#5A4769;line-height:1.6;\">\u2717\u00a0 Codes jump between 4, 5 and 6 digits<\/p>\n          <p style=\"margin:0 0 8px;font-size:15px;color:#5A4769;line-height:1.6;\">\u2717\u00a0 Groups do not match IFRS statements<\/p>\n          <p style=\"margin:0 0 8px;font-size:15px;color:#5A4769;line-height:1.6;\">\u2717\u00a0 Unused ledgers pile up after every year<\/p>\n          <p style=\"margin:0;font-size:15px;color:#5A4769;line-height:1.6;\">\u2717\u00a0 Opening balance is a manual journal hunt<\/p>\n        <\/div>\n      <\/div>\n      <div class=\"col-md-6\" style=\"margin-bottom:20px;\">\n        <div class=\"h-100\" style=\"background-color:#F6EFFC;border:1px solid #D4AFF2;border-radius:16px;padding:28px;\">\n          <div style=\"font-size:12px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:#641AA0;margin-bottom:16px;\">With Smart Chart of Accounts Manager<\/div>\n          <p style=\"margin:0 0 8px;font-size:15px;color:#1E0F2A;line-height:1.6;\"><span style=\"color:#641AA0;font-weight:800;\">\u2713<\/span>\u00a0 Clear L1 / L2 / L3 coding rules<\/p>\n          <p style=\"margin:0 0 8px;font-size:15px;color:#1E0F2A;line-height:1.6;\"><span style=\"color:#641AA0;font-weight:800;\">\u2713<\/span>\u00a0 IFRS group catalog ready to map<\/p>\n          <p style=\"margin:0 0 8px;font-size:15px;color:#1E0F2A;line-height:1.6;\"><span style=\"color:#641AA0;font-weight:800;\">\u2713<\/span>\u00a0 Preview before you reset or merge<\/p>\n          <p style=\"margin:0;font-size:15px;color:#1E0F2A;line-height:1.6;\"><span style=\"color:#641AA0;font-weight:800;\">\u2713<\/span>\u00a0 Opening balance with retained earnings offset<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- Features -->\n\n<section class=\"oe_container\" id=\"sk-features\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:40px 0 20px;\">\n    <div style=\"text-align:center;margin-bottom:30px;\">\n      <div style=\"font-size:12px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:#641AA0;margin-bottom:10px;\">Key Features<\/div>\n      <h2 style=\"font-size:32px;font-weight:800;color:#1E0F2A;margin:0;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#EEDFFA;padding-bottom:14px;\">From structure to opening balance<\/h2>\n    <\/div>\n    <div class=\"row\">\n      <div class=\"col-md-6 col-lg-4\" style=\"margin-bottom:20px;\"><div class=\"h-100\" style=\"background-color:#FFFFFF;border:1px solid #EAE2F0;border-radius:16px;padding:24px;\">\n        <div style=\"display:inline-block;font-family:'JetBrains Mono',Consolas,monospace;font-size:13px;font-weight:700;color:#FFFFFF;background-color:#641AA0;border-radius:10px;padding:8px 11px;margin-bottom:14px;\">01<\/div>\n        <h3 style=\"font-size:18px;font-weight:800;color:#1E0F2A;margin:0 0 8px;\">L1 / L2 / L3 tree<\/h3>\n        <p style=\"font-size:14px;color:#79648B;line-height:1.65;margin:0;\">Type, IFRS group and ledger code stay linked so reports and filters make sense.<\/p>\n      <\/div><\/div>\n      <div class=\"col-md-6 col-lg-4\" style=\"margin-bottom:20px;\"><div class=\"h-100\" style=\"background-color:#FFFFFF;border:1px solid #EAE2F0;border-radius:16px;padding:24px;\">\n        <div style=\"display:inline-block;font-family:'JetBrains Mono',Consolas,monospace;font-size:13px;font-weight:700;color:#FFFFFF;background-color:#641AA0;border-radius:10px;padding:8px 11px;margin-bottom:14px;\">02<\/div>\n        <h3 style=\"font-size:18px;font-weight:800;color:#1E0F2A;margin:0 0 8px;\">IFRS coding wizard<\/h3>\n        <p style=\"font-size:14px;color:#79648B;line-height:1.65;margin:0;\">Apply XXXC-style codes with a preview of every rename before you commit.<\/p>\n      <\/div><\/div>\n      <div class=\"col-md-6 col-lg-4\" style=\"margin-bottom:20px;\"><div class=\"h-100\" style=\"background-color:#FFFFFF;border:1px solid #EAE2F0;border-radius:16px;padding:24px;\">\n        <div style=\"display:inline-block;font-family:'JetBrains Mono',Consolas,monospace;font-size:13px;font-weight:700;color:#F6F1FA;background-color:#983FE0;border-radius:10px;padding:8px 11px;margin-bottom:14px;\">03<\/div>\n        <h3 style=\"font-size:18px;font-weight:800;color:#1E0F2A;margin:0 0 8px;\">Reset &amp; regenerate<\/h3>\n        <p style=\"font-size:14px;color:#79648B;line-height:1.65;margin:0;\">Rebuild ledger codes company-wise with options and a line-by-line preview.<\/p>\n      <\/div><\/div>\n      <div class=\"col-md-6 col-lg-4\" style=\"margin-bottom:20px;\"><div class=\"h-100\" style=\"background-color:#FFFFFF;border:1px solid #EAE2F0;border-radius:16px;padding:24px;\">\n        <div style=\"display:inline-block;font-family:'JetBrains Mono',Consolas,monospace;font-size:13px;font-weight:700;color:#FFFFFF;background-color:#641AA0;border-radius:10px;padding:8px 11px;margin-bottom:14px;\">04<\/div>\n        <h3 style=\"font-size:18px;font-weight:800;color:#1E0F2A;margin:0 0 8px;\">Merge &amp; delete unused<\/h3>\n        <p style=\"font-size:14px;color:#79648B;line-height:1.65;margin:0;\">Collapse duplicate ledgers and remove accounts with no history, safely.<\/p>\n      <\/div><\/div>\n      <div class=\"col-md-6 col-lg-4\" style=\"margin-bottom:20px;\"><div class=\"h-100\" style=\"background-color:#FFFFFF;border:1px solid #EAE2F0;border-radius:16px;padding:24px;\">\n        <div style=\"display:inline-block;font-family:'JetBrains Mono',Consolas,monospace;font-size:13px;font-weight:700;color:#FFFFFF;background-color:#641AA0;border-radius:10px;padding:8px 11px;margin-bottom:14px;\">05<\/div>\n        <h3 style=\"font-size:18px;font-weight:800;color:#1E0F2A;margin:0 0 8px;\">Opening balance<\/h3>\n        <p style=\"font-size:14px;color:#79648B;line-height:1.65;margin:0;\">Post opening journals with an automatic retained-earnings balancing line.<\/p>\n      <\/div><\/div>\n      <div class=\"col-md-6 col-lg-4\" style=\"margin-bottom:20px;\"><div class=\"h-100\" style=\"background-color:#FFFFFF;border:1px solid #EAE2F0;border-radius:16px;padding:24px;\">\n        <div style=\"display:inline-block;font-family:'JetBrains Mono',Consolas,monospace;font-size:13px;font-weight:700;color:#F6F1FA;background-color:#983FE0;border-radius:10px;padding:8px 11px;margin-bottom:14px;\">06<\/div>\n        <h3 style=\"font-size:18px;font-weight:800;color:#1E0F2A;margin:0 0 8px;\">Community safe<\/h3>\n        <p style=\"font-size:14px;color:#79648B;line-height:1.65;margin:0;\">No Enterprise apps required. Extra report hooks load only when those modules exist.<\/p>\n      <\/div><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- Requirements -->\n\n<section class=\"oe_container\" id=\"cpa-section-4\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background-color:#FAF8FC;border:1px solid #EAE2F0;border-radius:16px;padding:28px 24px;margin:20px 0;\">\n    <div class=\"row\">\n      <div class=\"col-md-6\" style=\"padding:8px 12px;\">\n        <div style=\"font-size:12px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:#641AA0;margin-bottom:8px;\">Requirements<\/div>\n        <p style=\"margin:0;font-size:15px;color:#463355;line-height:1.7;\">Odoo <b>14.0<\/b> Community or Enterprise<br>Required apps: Accounting, Product, Purchase, Discuss<\/p>\n      <\/div>\n      <div class=\"col-md-6\" style=\"padding:8px 12px;\">\n        <div style=\"font-size:12px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:#641AA0;margin-bottom:8px;\">Technical name<\/div>\n        <p style=\"margin:0;font-family:'JetBrains Mono',Consolas,monospace;font-size:14px;color:#1E0F2A;line-height:1.7;\">smart_coa_builder<br>License OPL-1 \u00b7 Author CPA Books ERP<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- FAQ -->\n\n<section class=\"oe_container\" id=\"cpa-section-5\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:24px 0 8px;\">\n    <div style=\"text-align:center;margin-bottom:24px;\">\n      <div style=\"font-size:12px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:#641AA0;margin-bottom:10px;\">FAQ<\/div>\n      <h2 style=\"font-size:28px;font-weight:800;color:#1E0F2A;margin:0;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#EEDFFA;paddin ackground-color:#E2F0E9;border-radius:6px;\"><\/td><td style=\"background-color:#3CDF8E;color:#0B331F;border-radius:6px;\">\u25cf<\/td>\n      <\/tr>\n    <\/table>\n  <\/div>\n<\/section>\n\n\n<!-- Contract orders: 3-step pipeline, full image, 3 wizard cards -->\n\n<section class=\"oe_container\" id=\"cpa-section-7\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:56px 0 10px;\">\n    <div style=\"text-align:center;margin-bottom:26px;\">\n      <div style=\"font-size:12px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:#16854E;margin-bottom:10px;\">Contract orders<\/div>\n      <h2 style=\"font-size:32px;font-weight:900;color:#0B331F;margin:0 0 10px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#DFFAEC;padding-bottom:14px;\">From contract to invoice without missing a period<\/h2>\n      <p style=\"font-size:16px;color:#476958;max-width:700px;margin:0 auto;line-height:1.7;\">Each billing period becomes a contract order (<b>CO/2026/00087<\/b>). Overdue orders and orders due this month are flagged automatically.<\/p>\n    <\/div>\n    <div class=\"row\" style=\"margin-bottom:26px;\">\n      <div class=\"col-md-4\" style=\"margin-bottom:12px;\">\n        <div class=\"h-100\" style=\"background-color:#F1F9F5;border-radius:12px;padding:22px;text-align:center;\">\n          <div style=\"font-size:12px;font-weight:900;color:#577969;letter-spacing:0.1em;\">STEP 1<\/div>\n          <div style=\"font-size:20px;font-weight:900;color:#0B331F;margin:6px 0;\">Quotation<\/div>\n          <div style=\"font-size:13px;color:#577969;\">Orders generated from the contract schedule<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"col-md-4\" style=\"margin-bottom:12px;\">\n        <div class=\"h-100\" style=\"background-color:#DFFAEC;border-radius:12px;padding:22px;text-align:center;\">\n          <div style=\"font-size:12px;font-weight:900;color:#15804A;letter-spacing:0.1em;\">STEP 2 \u2192<\/div>\n          <div style=\"font-size:20px;font-weight:900;color:#0B331F;margin:6px 0;\">Contract Order<\/div>\n          <div style=\"font-size:13px;color:#476958;\">Confirmed, with docs and submission status<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"col-md-4\" style=\"margin-bottom:12px;\">\n        <div class=\"h-100\" style=\"background-color:#16854E;border-radius:12px;padding:22px;text-align:center;color:#FCFDFE;\">\n          <div style=\"font-size:12px;font-weight:900;color:#F6FEFA;letter-spacing:0.1em;\">STEP 3 \u2192<\/div>\n          <div style=\"font-size:20px;font-weight:900;color:#FFFFFF;margin:6px 0;\">Invoiced<\/div>\n          <div style=\"font-size:13px;color:#F6FEFA;\">Customer invoice created in one click<\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n    <img src=\"../facility_ops_manager/static/description/04_contract_orders.png\" alt=\"Contract orders and Create Pending Invoice\" style=\"max-width:100%;border-radius:12px;border:1px solid #E2F0E9;display:block;margin:0 auto 26px;height:auto;\">\n    <div class=\"row\">\n      <div class=\"col-md-4\" style=\"margin-bottom:14px;\">\n        <div class=\"h-100\" style=\"border-top:4px solid #16854E;padding:16px 4px 0;\">\n          <div style=\"font-size:16px;font-weight:800;color:#0B331F;margin-bottom:6px;\">Generate Contract Orders<\/div>\n          <div style=\"font-size:14px;color:#597C6B;line-height:1.6;\">For all contracts, one project, one customer or one AMC contract.<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"col-md-4\" style=\"margin-bottom:14px;\">\n        <div class=\"h-100\" style=\"border-top:4px solid #178A51;padding:16px 4px 0;\">\n          <div style=\"font-size:16px;font-weight:800;color:#0B331F;margin-bottom:6px;\">Create Pending Cont. Orders<\/div>\n          <div style=\"font-size:14px;color:#597C6B;line-height:1.6;\">Pick a date range and create new or missed orders in bulk.<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"col-md-4\" style=\"margin-bottom:14px;\">\n        <div class=\"h-100\" style=\"border-top:4px solid #0B331F;padding:16px 4px 0;\">\n          <div style=\"font-size:16px;font-weight:800;color:#0B331F;margin-bottom:6px;\">Create Pending Invoice<\/div>\n          <div style=\"font-size:14px;color:#597C6B;line-height:1.6;\">Turn confirmed orders into draft invoices, new or missed.<\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n    <p style=\"font-size:14px;color:#597C6B;text-align:center;margin:10px 0 0;\">Plus <b>Monitoring Cont. Order to Invoice<\/b>: a 12-month financial-year view of orders, invoiced and pending.<\/p>\n  <\/div>\n<\/section>\n\n\n<!-- Service calls: dark, vertical status timeline left, image right -->\n\n<section class=\"oe_container\" id=\"cpa-section-8\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background-color:#0B331F;border-radius:12px;padding:48px 32px 30px;margin-top:36px;color:#6C95CC;\">\n    <div class=\"row align-items-center\">\n      <div class=\"col-lg-4\" style=\"margin-bottom:24px;\">\n        <div style=\"font-size:12px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:#3CDF8E;margin-bottom:10px;\">Service calls<\/div>\n        <h2 style=\"font-size:30px;font-weight:900;color:#FFFFFF;margin:0 0 14px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#DFFAEC;padding-bottom:14px;\">Log a call in seconds, follow it to closure<\/h2>\n        <p style=\"font-size:15px;color:#CBE1D6;line-height:1.7;margin:0 0 22px;\">AMC, VAR and PPM calls get numbers like <b style=\"color:#FFFFFF;\">26G00041A<\/b>. Choose the contract and the client, project, flat and manager fill in.<\/p>\n        <div style=\"border-left-width:3px;border-left-style:solid;border-left-color:#34D384;padding-left:18px;\">\n          <div style=\"margin-bottom:14px;\"><div style=\"font-size:15px;font-weight:800;color:#FFFFFF;\">Pending< ound-color:#D3F8E5;border-radius:12px;padding:16px;\">\n          <div style=\"font-size:11px;font-weight:900;color:#116B3E;\">5<\/div>\n          <div style=\"font-size:14px;font-weight:800;color:#0B331F;\">VAR work - Invoiced<\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n    <img src=\"../facility_ops_manager/static/description/06_var_work.png\" alt=\"VAR Work Report\" style=\"max-width:100%;border-radius:12px;border:1px solid #E2F0E9;display:block;margin:0 auto 22px;height:auto;\">\n    <div class=\"row\">\n      <div class=\"col-md-6\" style=\"margin-bottom:14px;\">\n        <div class=\"h-100\" style=\"background-color:#F8FCFA;border-radius:12px;padding:18px 20px;border:1px solid #E2F0E9;\">\n          <div style=\"font-size:15px;font-weight:800;color:#0B331F;margin-bottom:4px;\">Excel import<\/div>\n          <div style=\"font-size:14px;color:#577969;line-height:1.6;\">Bring in existing VAR sheets (22 columns) with a preview of missing client groups and projects first.<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"col-md-6\" style=\"margin-bottom:14px;\">\n        <div class=\"h-100\" style=\"background-color:#F8FCFA;border-radius:12px;padding:18px 20px;border:1px solid #E2F0E9;\">\n          <div style=\"font-size:15px;font-weight:800;color:#0B331F;margin-bottom:4px;\">VAR Work Statement<\/div>\n          <div style=\"font-size:14px;color:#577969;line-height:1.6;\">Pick the client, date and columns, then print a PDF or download Excel.<\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- PPM: mint, image left, frequency table + service chips right -->\n\n<section class=\"oe_container\" id=\"cpa-section-10\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background-color:#EDFCF4;border-radius:12px;padding:44px 32px 30px;margin-top:30px;\">\n    <div class=\"row align-items-center\">\n      <div class=\"col-lg-7\" style=\"margin-bottom:24px;\">\n        <img src=\"../facility_ops_manager/static/description/07_ppm_planner.png\" alt=\"Monthly PPM table\" style=\"max-width:100%;border-radius:12px;border:1px solid #D3F8E5;display:block;height:auto;\">\n      <\/div>\n      <div class=\"col-lg-5\" style=\"margin-bottom:24px;\">\n        <div style=\"font-size:12px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:#15814B;margin-bottom:10px;\">PPM \u00b7 planned maintenance<\/div>\n        <h2 style=\"font-size:30px;font-weight:900;color:#0B331F;margin:0 0 14px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#DFFAEC;padding-bottom:14px;\">A year of visits, planned in one go<\/h2>\n        <p style=\"font-size:15px;color:#476958;line-height:1.7;margin:0 0 16px;\">Set the frequency or tick the exact months, generate the year, then turn any month slot into a service call. The monthly table shows done and pending at a glance.<\/p>\n        <table style=\"width:100%;border-collapse:collapse;font-size:14px;background-color:#FFFFFF;border-radius:12px;margin-bottom:16px;table-layout:fixed;overflow-wrap:break-word;\">\n          <tr><td style=\"padding:10px 14px;border-bottom:1px solid #D3F8E5;color:#597C6B;font-weight:700;\">Frequency<\/td><td style=\"padding:10px 14px;border-bottom:1px solid #D3F8E5;color:#597C6B;font-weight:700;text-align:right;\">Visits a year<\/td><\/tr>\n          <tr><td style=\"padding:9px 14px;border-bottom:1px solid #EDFCF4;color:#0B331F;font-weight:700;\">Monthly<\/td><td style=\"padding:9px 14px;border-bottom:1px solid #EDFCF4;text-align:right;font-weight:900;color:#116B3E;\">12<\/td><\/tr>\n          <tr><td style=\"padding:9px 14px;border-bottom:1px solid #EDFCF4;color:#0B331F;font-weight:700;\">Quarterly<\/td><td style=\"padding:9px 14px;border-bottom:1px solid #EDFCF4;text-align:right;font-weight:900;color:#116B3E;\">4<\/td><\/tr>\n          <tr><td style=\"padding:9px 14px;border-bottom:1px solid #EDFCF4;color:#0B331F;font-weight:700;\">Half Yearly<\/td><td style=\"padding:9px 14px;border-bottom:1px solid #EDFCF4;text-align:right;font-weight:900;color:#116B3E;\">2<\/td><\/tr>\n          <tr><td style=\"padding:9px 14px;border-bottom:1px solid #EDFCF4;color:#0B331F;font-weight:700;\">Yearly<\/td><td style=\"padding:9px 14px;border-bottom:1px solid #EDFCF4;text-align:right;font-weight:900;color:#116B3E;\">1<\/td><\/tr>\n          <tr><td style=\"padding:9px 14px;color:#0B331F;font-weight:700;\">Manual months<\/td><td style=\"padding:9px 14px;text-align:right;font-weight:900;color:#116B3E;\">your pick<\/td><\/tr>\n        <\/table>\n        <div>\n          <span style=\"display:inline-block;background-color:#FFFFFF;border:1px solid #A9F1CD;color:#0E5733;padding:5px 12px;border-radius:12px;font-size:12px;font-weight:700;margin:3px;\">HVAC<\/span>\n          <span style=\"display:inline-block;background-color:#FFFFFF;border:1px solid #A9F1CD;color:#0E5733;padding:5px 12px;border-radius:12px;font-size:12px;font-weight:700;margin:3px;\">Electrical<\/span>\n          <span style=\"display:inline-block;background-color:#FFFFFF;border:1px solid #A9F1CD;color:#0E5733;padding:5px 12px;border-radius:12px;font-size:12px;font-weight:700;margin:3px;\">Plumbing<\/span>\n          <span style=\"display:inline-block;background-color:#FFFFFF;border:1px solid #A9F1CD;color:#0E5733;padding:5px 12px;border-radius:12px;font-size:12px;font-weight:700;margin:3px;\">Civil<\/span>\n          <span style=\"display:inline-block;background-color:#FFFFFF;border:1px solid #A9F1CD;color:#0E5733;padding:5px 12px;border-radius:12px;font-size:12px;font-weight:700;margin:3px;\">Cleaning<\/span>\n          <span style=\"display:inline-block;background-color:#FFFFFF;border:1px solid #A9F1CD;color:#0E5733;padding:5px 12px;border-radius:12px;font-size:12px;font-weight:700;margin:3px;\">Fire Safety<\/span>\n          <span style=\"display:inline-block;background-color:#FFFFFF;border:1px solid #A9F1CD;color:#0E5733;padding:5px 12px;border-radius:12px;font-size:12px;font-weight:700;margin:3px;\">Lift<\/span>\n          <span style=\"display:inline-block;background-color:#FFFFFF;border:1px solid #A9F1CD;color:#0E5733;padding:5px 12px;border-radius:12px;font-size:12px;font-weight:700;margin:3px;\">General<\/span>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!-- Invoice follow-up: 4 big status counters, image -->\n\n<section class=\"oe_container\" id=\"cpa-section-11\" style=\"margin-bottom:24px;\">\n  <div style=\"font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:56px 0 10px;\">\n    <div style=\"text-align:center;margin-bottom:26px;\">\n      <div style=\"font-size:12px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:#16854E;margin-bottom:10px;\">Invoice follow-up<\/div>\n      <h2 style=\"font-size:32px;font-weight:900;color:#0B331F;margin:0 0 10px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#DFFAEC;padding-bottom:14px;\">Get AMC invoices accepted, not just sent<\/h2>\n      <p style=\"font-size:16px;color:#476958;max-width:700px;margin:0 auto;line-height:1.7;\">Many clients need KPI and CSR papers before they pay. Track every invoice by stage, with due days and who is following up.<\/p>\n    <\/div>\n    <div class=\"row\" style=\"margin-bottom:26px;\">\n      <div class=\"col-6 col-md-3\" style=\"margin-bottom:12px;\">\n        <div class=\"h-100\" style=\"border:2px solid #AFF2D0;border-radius:12px;padding:20px;text-align:center;\">\n          <div style=\"font-size:13px;font-weight:800;color:#16874F;\">Waiting for KPI<\/div>\n          <div style=\"font-size:13px;color:#597C6B;margin-top:4px;\">KPI report pending<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"col-6 col-md-3\" style=\"margin-bottom:12px;\">\n        <div class=\"h-100\" style=\"border:2px solid #63E6A5;border-radius:12px;padding:20px;text-align:center;\">\n          <div style=\"font-size:13px;font-weight:800;color:#15844D;\">Waiting for in:0 auto 30px;height:auto;\">\n    <div class=\"row\">\n      <div class=\"col-lg-4\" style=\"margin-bottom:20px;\">\n        <div style=\"font-size:12px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:#3CDF8E;margin-bottom:10px;\">Reports &amp; exports<\/div>\n        <h2 style=\"font-size:28px;font-weight:900;color:#FFFFFF;margin:0 0 12px;border-bottom-width:2px;border-bottom-style:solid;border-bottom-color:#DFFAEC;padding-bottom:14px;\">8 PDF reports, 5 Excel / CSV exports<\/h2>\n        <p style=\"font-size:15px;color:#CBE1D6;line-height:1.7;margin:0;\">Tax invoices with VAT 5% and amount in words in UAE Dirhams, plus a client statement that combines AMC invoices, the AMC register and VAR work.<\/p>\n      <\/div>\n      <div class=\"col-lg-8\">\n        <div class=\"row\">\n          <div class=\"col-md-6\" style=\"margin-bottom:10px;\"><div style=\"border-left-width:3px;border-left-style:solid;border-left-color:#34D384;padding:6px 0 6px 14px;\"><div style=\"font-size:15px;font-weight:800;color:#FFFFFF;\">Print Invoice (Tally Format)<\/div><div style=\"font-size:13px;color:#94B8A6;\">TRN, LPO, VAT, bank details<\/div><\/div><\/div>\n          <div class=\"col-md-6\" style=\"margin-bottom:10px;\"><div style=\"border-left-width:3px;border-left-style:solid;border-left-color:#34D384;padding:6px 0 6px 14px;\"><div style=\"font-size:15px;font-weight:800;color:#FFFFFF;\">Client SOA - Single Project<\/div><div style=\"font-size:13px;color:#94B8A6;\">Running balance, total outstanding<\/div><\/div><\/div>\n          <div class=\"col-md-6\" style=\"margin-bottom:10px;\"><div style=\"border-left-width:3px;border-left-style:solid;border-left-color:#34D384;padding:6px 0 6px 14px;\"><div style=\"font-size:15px;font-weight:800;color:#FFFFFF;\">AMC Contract Sheet<\/div><div style=\"font-size:13px;color:#94B8A6;\">Full contract on one page<\/div><\/div><\/div>\n          <div class=\"col-md-6\" style=\"margin-bottom:10px;\"><div style=\"border-left-width:3
